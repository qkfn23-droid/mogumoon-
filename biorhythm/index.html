<script>
const CYCLES = {physical:23, emotional:28, intellectual:33};
const COLORS = {physical:'#e74c3c', emotional:'#2ecc71', intellectual:'#3498db'};
const NAMES = {physical:'신체', emotional:'감성', intellectual:'지성'};
const EMOJIS = {physical:'💪', emotional:'💚', intellectual:'🧠'};

let offsetDays = 0;
let birthDate = null;

function daysBetween(d1, d2) {
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
}

function bioValue(totalDays, cycle) {
    return Math.sin((2 * Math.PI * totalDays) / cycle);
}

function getStatus(val) {
    if (val > 0.8) return {text:'최고조 🔥', color:'#2ecc71'};
    if (val > 0.3) return {text:'좋음 ↑', color:'#4fc3f7'};
    if (val > -0.3) return {text:'보통 →', color:'#f39c12'};
    if (val > -0.8) return {text:'저조 ↓', color:'#e67e22'};
    return {text:'최저 ⚠️', color:'#e74c3c'};
}

function getAdvice(p, e, i) {
    let advice = '';
    if (p > 0.5) advice += '<strong>신체:</strong> 에너지가 넘칩니다! 운동이나 활동적인 일에 적합합니다.<br>';
    else if (p < -0.5) advice += '<strong>신체:</strong> 체력이 저하되어 있습니다. 무리하지 말고 충분히 쉬세요.<br>';
    else advice += '<strong>신체:</strong> 보통 수준입니다. 적당한 활동이 좋습니다.<br>';

    if (e > 0.5) advice += '<strong>감성:</strong> 감정이 풍부하고 안정적입니다. 사람을 만나고 사랑을 표현하세요.<br>';
    else if (e < -0.5) advice += '<strong>감성:</strong> 감정이 예민해져 있습니다. 갈등을 피하고 혼자만의 시간을 가지세요.<br>';
    else advice += '<strong>감성:</strong> 감정적으로 안정적입니다. 평소대로 지내세요.<br>';

    if (i > 0.5) advice += '<strong>지성:</strong> 두뇌가 맑고 집중력이 높습니다. 공부나 중요한 결정에 최적!';
    else if (i < -0.5) advice += '<strong>지성:</strong> 판단력이 흐려져 있습니다. 중요한 결정은 미루세요.';
    else advice += '<strong>지성:</strong> 보통 수준의 집중력입니다. 일상적인 업무에 적합합니다.';

    return advice;
}

function calculate() {
    const y = parseInt(document.getElementById('birthYear').value);
    const m = parseInt(document.getElementById('birthMonth').value);
    const d = parseInt(document.getElementById('birthDay').value);
    if (!y || !m || !d) return alert('생년월일을 선택하세요!');

    birthDate = new Date(y, m - 1, d);
    offsetDays = 0;
    render();
}

function render() {
    const today = new Date();
    today.setDate(today.getDate() + offsetDays);
    const totalDays = daysBetween(birthDate, today);

    const p = bioValue(totalDays, CYCLES.physical);
    const e = bioValue(totalDays, CYCLES.emotional);
    const i = bioValue(totalDays, CYCLES.intellectual);

    const pSt = getStatus(p), eSt = getStatus(e), iSt = getStatus(i);

    const dayNames = ['일','월','화','수','목','금','토'];
    const dateStr = `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 (${dayNames[today.getDay()]}요일)`;
    const livedDays = totalDays;

    const section = document.getElementById('resultSection');
    section.innerHTML = `
        <div class="nav-btns">
            <div class="nav-btn" onclick="offsetDays-=7;render();">◀ 1주 전</div>
            <div class="nav-btn" onclick="offsetDays--;render();">◀ 어제</div>
            <div class="nav-btn" onclick="offsetDays=0;render();" style="background:rgba(79,195,247,0.2);">오늘</div>
            <div class="nav-btn" onclick="offsetDays++;render();">내일 ▶</div>
            <div class="nav-btn" onclick="offsetDays+=7;render();">1주 후 ▶</div>
        </div>

        <div style="text-align:center;margin-bottom:16px;">
            <div style="font-size:16px;color:#4fc3f7;font-weight:700;">${dateStr}</div>
            <div style="font-size:12px;color:#666;">태어난 지 ${livedDays.toLocaleString()}일째</div>
        </div>

        <div class="today-scores">
            <div class="score-card" style="background:rgba(231,76,60,0.06);">
                <div class="sc-emoji">💪</div>
                <div class="sc-label">신체</div>
                <div class="sc-value" style="color:${COLORS.physical};">${Math.round(p * 100)}%</div>
                <div class="sc-status" style="color:${pSt.color};">${pSt.text}</div>
                <div class="sc-cycle">주기: 23일</div>
            </div>
            <div class="score-card" style="background:rgba(46,204,113,0.06);">
                <div class="sc-emoji">💚</div>
                <div class="sc-label">감성</div>
                <div class="sc-value" style="color:${COLORS.emotional};">${Math.round(e * 100)}%</div>
                <div class="sc-status" style="color:${eSt.color};">${eSt.text}</div>
                <div class="sc-cycle">주기: 28일</div>
            </div>
            <div class="score-card" style="background:rgba(52,152,219,0.06);">
                <div class="sc-emoji">🧠</div>
                <div class="sc-label">지성</div>
                <div class="sc-value" style="color:${COLORS.intellectual};">${Math.round(i * 100)}%</div>
                <div class="sc-status" style="color:${iSt.color};">${iSt.text}</div>
                <div class="sc-cycle">주기: 33일</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">30일 바이오리듬 그래프</div>
            <div class="legend">
                <div class="legend-item"><div class="legend-dot" style="background:${COLORS.physical};"></div>신체 (23일)</div>
                <div class="legend-item"><div class="legend-dot" style="background:${COLORS.emotional};"></div>감성 (28일)</div>
                <div class="legend-item"><div class="legend-dot" style="background:${COLORS.intellectual};"></div>지성 (33일)</div>
            </div>
            <canvas id="bioChart" width="660" height="300"></canvas>
        </div>

        <div class="reading-card">
            <div class="reading-title">💡 오늘의 컨디션 조언</div>
            <div class="reading-text">${getAdvice(p, e, i)}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">📖 바이오리듬이란?</div>
            <div class="reading-text">
                바이오리듬은 1900년대 초 빌헬름 플리스 박사가 제안한 이론입니다.<br><br>
                <strong>💪 신체 리듬 (23일 주기)</strong> — 체력, 지구력, 면역력, 운동 능력에 영향<br>
                <strong>💚 감성 리듬 (28일 주기)</strong> — 감정, 기분, 창의성, 인간관계에 영향<br>
                <strong>🧠 지성 리듬 (33일 주기)</strong> — 집중력, 판단력, 기억력, 학습 능력에 영향<br><br>
                +100%에 가까울수록 최고조, -100%에 가까울수록 저조, 0%를 지나는 날이 <strong>위험일</strong>입니다.
            </div>
        </div>
    `;
    section.style.display = 'block';

    // 그래프 그리기
    drawChart(totalDays);
}

function drawChart(centerDay) {
    const canvas = document.getElementById('bioChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const midY = H / 2;
    const amp = H * 0.4;
    const days = 30;
    const startDay = centerDay - 15;

    ctx.clearRect(0, 0, W, H);

    // 배경 그리드
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    // 수평선
    for (let y of [0.25, 0.5, 0.75]) {
        ctx.beginPath(); ctx.moveTo(0, H * y); ctx.lineTo(W, H * y); ctx.stroke();
    }
    // 0선
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();

    // 오늘 마커
    const todayX = (15 / days) * W;
    ctx.fillStyle = 'rgba(79,195,247,0.1)';
    ctx.fillRect(todayX - 1, 0, 3, H);
    ctx.fillStyle = 'rgba(79,195,247,0.5)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('오늘', todayX, 14);

    // 리듬 곡선
    Object.keys(CYCLES).forEach(key => {
        ctx.strokeStyle = COLORS[key];
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let d = 0; d <= days; d++) {
            const x = (d / days) * W;
            const val = bioValue(startDay + d, CYCLES[key]);
            const y = midY - val * amp;
            if (d === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // 오늘 포인트
        const todayVal = bioValue(centerDay, CYCLES[key]);
        const ty = midY - todayVal * amp;
        ctx.fillStyle = COLORS[key];
        ctx.beginPath();
        ctx.arc(todayX, ty, 5, 0, Math.PI * 2);
        ctx.fill();
    });

    // 날짜 라벨
    ctx.fillStyle = '#555';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    for (let d = 0; d <= days; d += 5) {
        const date = new Date(birthDate);
        date.setDate(date.getDate() + startDay + d);
        const x = (d / days) * W;
        ctx.fillText(`${date.getMonth()+1}/${date.getDate()}`, x, H - 4);
    }

    // Y축 라벨
    ctx.fillStyle = '#444';
    ctx.textAlign = 'left';
    ctx.fillText('+100%', 4, 16);
    ctx.fillText('0%', 4, midY - 4);
    ctx.fillText('-100%', 4, H - 16);
}

// select 초기화
(function() {
    const yEl = document.getElementById('birthYear');
    const mEl = document.getElementById('birthMonth');
    const dEl = document.getElementById('birthDay');
    const now = new Date();

    yEl.innerHTML = '<option value="">년</option>';
    for (let y = now.getFullYear(); y >= 1920; y--) yEl.innerHTML += `<option value="${y}">${y}년</option>`;

    mEl.innerHTML = '<option value="">월</option>';
    for (let m = 1; m <= 12; m++) mEl.innerHTML += `<option value="${m}">${m}월</option>`;

    function updateDays() {
        const y = parseInt(yEl.value) || 2000;
        const m = parseInt(mEl.value) || 1;
        const maxD = new Date(y, m, 0).getDate();
        const cur = parseInt(dEl.value);
        dEl.innerHTML = '<option value="">일</option>';
        for (let d = 1; d <= maxD; d++) dEl.innerHTML += `<option value="${d}"${d===cur?' selected':''}>${d}일</option>`;
    }
    yEl.onchange = updateDays;
    mEl.onchange = updateDays;
    updateDays();
})();
</script>
