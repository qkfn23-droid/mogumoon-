let currentQ = 0;
const scores = {};

function startQuiz() {
    currentQ = 0;
    Object.keys(AURAS).forEach(k => scores[k] = 0);
    showQuestion();
}

function showQuestion() {
    if (currentQ >= QUESTIONS.length) { showResult(); return; }
    const q = QUESTIONS[currentQ];
    const pct = (currentQ / QUESTIONS.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `질문 ${currentQ + 1} / ${QUESTIONS.length}`;

    document.getElementById('questionCard').innerHTML = `
        <div class="question-num">QUESTION ${currentQ + 1}</div>
        <div class="question-text">${q.q}</div>
        <div class="options">
            ${q.o.map((opt, i) => `<div class="option-btn" onclick="answer(${i})">${opt.t}</div>`).join('')}
        </div>
    `;
}

function answer(idx) {
    const q = QUESTIONS[currentQ];
    q.o[idx].c.forEach(c => { scores[c] = (scores[c] || 0) + 1; });
    currentQ++;
    showQuestion();
}

function showResult() {
    document.getElementById('quizSection').style.display = 'none';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = '완료!';
    document.getElementById('shareBar').style.display = 'block';

    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const topColor = sorted[0][0];
    const subColor = sorted[1] ? sorted[1][0] : topColor;
    const a = AURAS[topColor];
    const sub = AURAS[subColor];

    const section = document.getElementById('resultSection');
    section.innerHTML = `
        <div class="aura-orb">
            <div class="glow" style="background:${a.color};"></div>
            <div class="inner" style="background:radial-gradient(circle at 40% 40%, ${a.bg}, rgba(10,10,26,0.9));">
                <div class="color-emoji">${a.emoji}</div>
                <div class="color-name" style="color:${a.color};">${a.name}</div>
            </div>
        </div>

        <div class="result-title" style="color:${a.color};">당신의 오라는 ${a.name}!</div>
        <div class="result-subtitle">${a.keyword}</div>

        <div class="trait-grid">
            <div class="trait-item"><div class="trait-label">원소</div><div class="trait-value" style="color:${a.color};">${a.element}</div></div>
            <div class="trait-item"><div class="trait-label">차크라</div><div class="trait-value" style="color:${a.color};">${a.chakra}</div></div>
            <div class="trait-item"><div class="trait-label">보조 오라</div><div class="trait-value" style="color:${sub.color};">${sub.emoji} ${sub.name}</div></div>
        </div>

        <div class="reading-card">
            <div class="reading-title">🧿 성격 분석</div>
            <div class="reading-text">${a.personality}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💪 강점</div>
            <div class="reading-text"><strong>${a.strength}</strong></div>
        </div>

        <div class="reading-card">
            <div class="reading-title">⚠️ 약점</div>
            <div class="reading-text">${a.weakness}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💡 오라가 전하는 조언</div>
            <div class="reading-text"><strong>${a.advice}</strong></div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💞 오라 궁합</div>
            <div class="compat-grid">
                ${a.good.map(g => `<div class="compat-item compat-good">잘 맞는 오라: ${AURAS[Object.keys(AURAS).find(k=>AURAS[k].name.includes(g))]?.emoji||''} ${g}</div>`).join('')}
                ${a.bad.map(b => `<div class="compat-item compat-bad">주의할 오라: ${AURAS[Object.keys(AURAS).find(k=>AURAS[k].name.includes(b))]?.emoji||''} ${b}</div>`).join('')}
            </div>
        </div>

        <button class="retry-btn" onclick="location.reload()">🔄 다시 테스트하기</button>
    `;
    section.style.display = 'block';
    section.scrollIntoView({behavior:'smooth'});
}

startQuiz();
</script>
