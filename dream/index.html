{k:"뱀",emoji:"🐍",cat:"동물",tags:["뱀","구렁이","독사","큰뱀","뱀꿈","뱀잡는꿈","뱀물리는꿈"],
text:"뱀은 동서양을 막론하고 가장 강력한 꿈 상징 중 하나입니다. 고대부터 <strong>변화, 재생, 치유, 그리고 숨겨진 지혜</strong>를 상징해왔습니다. 뱀이 허물을 벗듯, 당신의 인생에도 근본적인 변화가 찾아오고 있습니다. 한국 전통에서 뱀꿈은 대표적인 <strong>재물꿈</strong>이기도 합니다.<br><br><strong>뱀에게 물리는 꿈</strong> — 가까운 사람의 배신이나 숨겨진 적을 경고합니다. 현재 믿고 있는 사람이 실은 당신에게 해가 될 수 있습니다. 다만 독이 없는 뱀에 물렸다면, 오히려 재물운의 상승을 뜻하기도 합니다.<br><strong>뱀을 잡는 꿈</strong> — 강력한 재물운! 예상치 못한 돈이 들어오거나 투자에 성공할 수 있습니다. 잡은 뱀이 크면 클수록 재물의 규모도 커집니다.<br><strong>큰 뱀(구렁이)을 보는 꿈</strong> — 권력자나 영향력 있는 사람의 도움을 받게 됩니다. 사업가라면 큰 거래가 성사될 수 있습니다.<br><strong>뱀이 집에 들어오는 꿈</strong> — 전통적으로 가장 좋은 뱀꿈 중 하나. 가정에 재산이 들어오거나, 집안에 경사가 생깁니다.<br><strong>뱀이 또아리를 틀고 있는 꿈</strong> — 현재 상황에서 움직이지 말고 기다리라는 메시지. 때가 오면 뱀처럼 빠르게 움직이세요.<br><strong>뱀을 죽이는 꿈</strong> — 경쟁자를 물리치거나 오래된 문제를 해결하게 됩니다. 다만 죽인 뱀이 금색이었다면 재물을 잃을 수 있으니 주의.<br><strong>뱀 두 마리가 엉켜 있는 꿈</strong> — 복잡한 인간관계를 나타냅니다. 연애 중이라면 삼각관계를 주의하세요.<br><strong>흰 뱀 꿈</strong> — 영적 각성이나 신성한 보호를 의미합니다. 매우 귀한 길몽입니다."},
{k:"개",emoji:"🐕",cat:"동물",tags:["개","강아지","멍멍이","반려견","개꿈","개물리는꿈","검은개"],
text:"인류의 가장 오래된 동반자인 개는 꿈에서 <strong>충성심, 우정, 보호본능, 그리고 인간관계</strong>를 상징합니다. 꿈속 개의 태도와 상태는 당신 주변 사람들과의 관계를 직접적으로 반영합니다.<br><br><strong>개가 꼬리를 흔들며 다가오는 꿈</strong> — 곧 당신 편이 되어줄 믿음직한 사람이 나타납니다. 새로운 친구, 동료, 혹은 멘토를 만나게 될 수 있습니다. 그 인연을 소중히 하세요.<br><strong>개에게 물리는 꿈</strong> — 가장 가까운 사람에게서 상처를 받거나 배신당할 수 있습니다. 친구, 가족, 연인 등 신뢰하는 관계를 점검하세요. 어느 부위를 물렸는지도 중요합니다 — 손을 물렸다면 일, 발을 물렸다면 진로에 관한 경고입니다.<br><strong>강아지를 안는 꿈</strong> — 순수한 기쁨과 새로운 시작의 에너지입니다. 새 프로젝트, 새 관계, 새 취미 등 신선한 무언가가 당신의 삶에 들어옵니다.<br><strong>개가 맹렬히 짖는 꿈</strong> — 무의식이 위험을 경고하고 있습니다. 현실에서 무시하고 있는 문제가 있지 않나요? 개가 특정 방향을 향해 짖고 있었다면, 그 방향이 힌트입니다.<br><strong>검은 개 꿈</strong> — 그림자 자아를 만나는 꿈입니다. 자신이 억누르고 있는 감정이나 인정하기 싫은 면을 직시해야 합니다. 검은 개가 온순했다면 그 그림자와 화해하고 있다는 좋은 신호.<br><strong>죽은 개를 보는 꿈</strong> — 오래된 우정이나 신뢰관계가 끝나가고 있습니다. 슬프지만 자연스러운 변화일 수 있습니다.<br><strong>길 잃은 개를 돌보는 꿈</strong> — 당신의 돌봄 본능이 발현되고 있습니다. 주변에 도움이 필요한 사람이 있을 수 있습니다."},
{k:"고양이",emoji:"🐈",cat:"동물",tags:["고양이","냥이","길고양이","검은고양이","새끼고양이","고양이꿈"],
text:"고양이는 고대 이집트에서 신성시된 동물로, 꿈에서는 <strong>직관, 독립성, 여성적 에너지, 그리고 신비로운 지혜</strong>를 상징합니다. 고양이는 보이지 않는 것을 보는 동물이므로, 고양이 꿈은 당신의 직관이 무언가를 감지하고 있다는 신호입니다.<br><br><strong>고양이가 가까이 다가오는 꿈</strong> — 직관을 믿으라는 강력한 메시지입니다. 논리적으로 설명할 수 없지만 '느낌이 이상하다'고 생각한 것이 있다면, 그 느낌이 맞습니다.<br><strong>검은 고양이 꿈</strong> — 미신과 달리 나쁜 꿈이 아닙니다. 숨겨진 진실이 곧 드러나거나, 영적으로 민감해지는 시기입니다. 꿈과 현실의 경계에서 중요한 통찰을 얻을 수 있습니다.<br><strong>고양이에게 할퀴거나 물리는 꿈</strong> — 주변의 질투나 시기를 경계하세요. 특히 동성 관계에서 갈등이 생길 수 있습니다. 겉으로는 친한 척하지만 속으로 다른 마음을 품은 사람이 있을 수 있습니다.<br><strong>새끼 고양이 꿈</strong> — 아직 작지만 소중한 가능성이 당신 안에서 자라고 있습니다. 새로운 재능, 취미, 관계의 씨앗이 될 수 있습니다. 성급히 키우려 하지 말고 천천히 돌보세요.<br><strong>고양이가 그르렁거리는 꿈</strong> — 마음의 안정과 치유가 필요하다는 메시지입니다. 잠시 멈추고 자기 자신을 돌보세요.<br><strong>길고양이 여러 마리 꿈</strong> — 주변에 정리되지 않은 인간관계가 많다는 뜻입니다. 진정한 관계와 표면적 관계를 구분해야 할 때입니다."},
{k:"물고기",emoji:"🐟",cat:"동물",tags:["물고기","생선","잉어","고래","돌고래","물고기꿈","물고기잡는꿈","금붕어"],
text:"물속을 자유롭게 헤엄치는 물고기는 <strong>풍요, 행운, 무의식의 보물, 그리고 영적 깨달음</strong>을 상징합니다. 동양에서는 특히 '어변성용(魚變成龍)' — 물고기가 용이 된다는 전설처럼, 물고기 꿈은 출세와 성공의 상징입니다.<br><br><strong>물고기를 잡는 꿈</strong> — 재물운 대길! 예상치 못한 수입, 보너스, 투자 수익 등이 생깁니다. 잡은 물고기가 크면 클수록 행운의 규모도 커집니다. 맨손으로 잡았다면 자수성가의 운이 있습니다.<br><strong>잉어가 뛰어오르는 꿈</strong> — 대길! 시험 합격, 승진, 취업 성공을 암시합니다. 잉어가 폭포를 거슬러 오르는 꿈이라면 어려운 도전을 극복하고 크게 성공합니다.<br><strong>금붕어 꿈</strong> — 작지만 확실한 행운. 예상치 못한 선물이나 좋은 소식이 옵니다.<br><strong>고래를 보는 꿈</strong> — 엄청난 규모의 기회나 감정이 다가오고 있습니다. 압도적이지만 두려워하지 마세요. 당신은 그것을 감당할 수 있습니다.<br><strong>물고기가 물 밖으로 튀어나오는 꿈</strong> — 무의식에서 의식으로 중요한 깨달음이 올라오고 있습니다. 갑자기 떠오르는 아이디어를 놓치지 마세요.<br><strong>죽은 물고기 꿈</strong> — 기회를 놓쳤거나, 감정적으로 메마른 상태입니다. 자신의 내면을 돌아보고 영감의 원천을 되찾으세요.<br><strong>물고기떼가 헤엄치는 꿈</strong> — 사회적 조화와 풍요. 공동체 안에서 좋은 일이 생기거나, 여러 작은 행운이 동시에 찾아옵니다."},
{k:"말",emoji:"🐎",cat:"동물",tags:["말","백마","흑마","경마","말타는꿈","야생마"],
text:"말은 인류 문명과 함께해온 고귀한 동물로, 꿈에서는 <strong>자유, 힘, 열정, 사회적 지위, 그리고 야생적 에너지</strong>를 상징합니다. 말의 색깔과 상태에 따라 해석이 크게 달라집니다.<br><br><strong>말을 타고 달리는 꿈</strong> — 인생이 빠르게 전진하고 있습니다! 목표를 향해 힘차게 나아가고 있으며, 승진이나 성공이 가까이 와 있습니다. 바람을 가르며 달리는 느낌이었다면 특히 길몽.<br><strong>백마 꿈</strong> — 순수한 행운과 고귀한 인연을 상징합니다. 이상적인 파트너를 만나거나, 존경받는 위치에 오르게 됩니다. 백마가 당신에게 다가왔다면 특별한 기회가 찾아옵니다.<br><strong>흑마 꿈</strong> — 억눌린 열정과 야생적 에너지를 나타냅니다. 자신 안의 강렬한 욕망을 인정하고 건강하게 표출하세요. 흑마를 잘 다루었다면 내면의 힘을 통제하고 있다는 뜻.<br><strong>야생마가 뛰어다니는 꿈</strong> — 자유를 갈망하는 영혼. 현재의 규칙이나 틀이 답답하게 느껴지고 있습니다. 진정한 자유가 무엇인지 생각해보세요.<br><strong>말에서 떨어지는 꿈</strong> — 자만심을 경계하라는 경고. 또는 현재 추진 중인 일에서 예상치 못한 차질이 생길 수 있습니다. 겸손하게 대비하세요.<br><strong>다친 말을 보는 꿈</strong> — 당신의 에너지나 야망이 상처받고 있습니다. 무리하고 있지 않은지 돌아보세요."},
{k:"새",emoji:"🐦",cat:"동물",tags:["새","참새","독수리","까마귀","비둘기","새꿈","봉황","학"],
text:"새는 하늘과 땅을 잇는 존재로, 고대부터 <strong>영혼의 자유, 영적 메시지, 희망, 그리고 초월</strong>을 상징해왔습니다. 새의 종류에 따라 해석이 크게 달라집니다.<br><br><strong>새가 하늘 높이 나는 꿈</strong> — 정신적 자유를 얻고 있습니다. 오래된 제약에서 벗어나 더 넓은 세계로 나아갑니다. 시야가 넓어지고 새로운 관점을 갖게 됩니다.<br><strong>독수리 꿈</strong> — 강력한 힘과 높은 시야를 상징합니다. 리더십을 발휘할 기회가 오거나, 큰 그림을 볼 수 있는 통찰력이 생깁니다. 독수리가 사냥에 성공하는 꿈이라면 목표 달성이 확실합니다.<br><strong>까마귀 꿈</strong> — 까마귀는 변화의 전령입니다. 삶에 큰 전환점이 다가오고 있으며, 숨겨진 진실이 드러납니다. 두렵더라도 변화를 받아들이세요.<br><strong>비둘기 꿈</strong> — 평화, 화해, 사랑의 메시지입니다. 갈등이 해소되거나 마음의 평화를 찾게 됩니다. 흰 비둘기라면 특히 길몽.<br><strong>새가 창문으로 들어오는 꿈</strong> — 좋은 소식이 찾아옵니다! 예상치 못한 기회나 반가운 연락이 올 수 있습니다.<br><strong>새장 속의 새 꿈</strong> — 자유를 갈망하고 있지만 현실적 제약에 갇혀 있음을 나타냅니다. 자신을 가두고 있는 것이 무엇인지 생각해보세요.<br><strong>학(두루미) 꿈</strong> — 장수, 행운, 고귀함의 상징. 건강이 좋아지거나 품격 있는 기회가 찾아옵니다.<br><strong>봉황 꿈</strong> — 최고의 길몽 중 하나! 재탄생, 영광, 위대한 성취를 암시합니다."},
{k:"호랑이",emoji:"🐅",cat:"동물",tags:["호랑이","범","백호","호랑이꿈","호랑이쫓기는꿈"],
text:"한국의 산신으로 여겨지는 호랑이는 <strong>권위, 용기, 강한 보호 에너지, 그리고 왕의 기운</strong>을 상징합니다. 한국 전통에서 호랑이꿈은 매우 강력한 길몽으로 여겨집니다.<br><br><strong>호랑이가 위엄 있게 서 있는 꿈</strong> — 권력자나 높은 사람의 도움을 받게 됩니다. 큰 행운이 다가오는 전조이며, 사회적 지위가 상승할 수 있습니다.<br><strong>호랑이에게 쫓기는 꿈</strong> — 현실에서 피하고 있는 강력한 두려움이나 압박감이 있습니다. 직면해야 할 문제를 더 이상 미루지 마세요. 하지만 쫓기다 호랑이와 마주 서면 — 문제를 극복하게 됩니다.<br><strong>호랑이를 타는 꿈</strong> — 대길 중의 대길! 엄청난 권력이나 성공을 얻게 됩니다. 비즈니스에서 큰 성과를 내거나, 시험에 합격하거나, 지도자의 위치에 오릅니다.<br><strong>백호 꿈</strong> — 수천 년에 한 번 나타난다는 백호는 매우 귀한 영물입니다. 인생을 바꿀 특별한 행운이 찾아옵니다. 이 꿈을 꾸었다면 로또를 사보세요.<br><strong>호랑이가 집에 들어오는 꿈</strong> — 귀한 아들을 낳는다는 태몽으로도 유명합니다. 태몽이 아니더라도 집안에 큰 경사가 생깁니다.<br><strong>호랑이 새끼를 보는 꿈</strong> — 아직 잠재된 큰 가능성이 당신 안에 있습니다. 지금은 작아도 곧 호랑이처럼 강해질 것입니다."},
{k:"돼지",emoji:"🐷",cat:"동물",tags:["돼지","멧돼지","돼지꿈","돼지꿈해몽","금돼지"],
text:"동양 문화에서 돼지는 <strong>재물, 풍요, 다산, 그리고 복</strong>의 상징입니다. '돼지꿈 = 돈꿈'이라는 공식이 있을 정도로, 돼지꿈은 가장 대표적인 재물꿈입니다.<br><br><strong>돼지를 보는 꿈</strong> — 재물운이 상승합니다. 기대하지 않았던 곳에서 돈이 들어오거나, 재정적으로 안정되는 시기가 옵니다.<br><strong>돼지가 집에 들어오는 꿈</strong> — 전통적으로 최고의 재물꿈! 큰 돈이 들어오거나, 사업이 번창합니다. 이 꿈을 꾸면 반드시 로또를 사보라는 말이 있을 정도입니다.<br><strong>금돼지 꿈</strong> — 엄청난 횡재를 암시합니다. 투자, 복권, 예상치 못한 유산 등 큰 돈과 관련된 행운이 옵니다.<br><strong>새끼 돼지 꿈</strong> — 작지만 확실한 재물운. 부수입이 생기거나, 저축한 것이 빛을 발합니다.<br><strong>돼지를 안는 꿈</strong> — 복을 끌어안는 것! 현재 진행 중인 일이 성공적으로 마무리됩니다.<br><strong>멧돼지 꿈</strong> — 야생적 에너지와 돌파력. 장애물을 강하게 밀어붙여 성공합니다. 다만 너무 거칠게 밀어붙이면 주변과 마찰이 생길 수 있습니다.<br><strong>돼지가 우는 꿈</strong> — 금전적 손실이나 낭비를 경고합니다. 충동적인 소비를 자제하세요."},
{k:"용",emoji:"🐉",cat:"동물",tags:["용","드래곤","용꿈","승천","금룡","청룡","흑룡"],
text:"동양 문화에서 용은 <strong>최고의 권위, 황제의 기운, 신성한 힘, 그리고 우주적 성공</strong>을 상징하는 최고의 영물입니다. 용꿈은 모든 꿈 중에서 가장 강력한 길몽으로 여겨집니다.<br><br><strong>용을 보는 꿈</strong> — 대길 중의 대길! 인생의 전환점이 될 큰 행운이 다가오고 있습니다. 평범한 용꿈이라도 매우 좋은 신호입니다.<br><strong>용이 하늘로 올라가는(승천하는) 꿈</strong> — 최고의 길몽! 사회적 지위가 급상승하거나, 시험 합격, 대형 계약 성사, 인생을 바꿀 성공이 옵니다. 구름 사이로 올라가는 모습이었다면 특히 강력합니다.<br><strong>용이 여의주를 물고 있는 꿈</strong> — 소원성취! 간절히 바라던 일이 이루어집니다. 여의주는 만능의 보물이므로, 어떤 분야든 원하는 것을 얻게 됩니다.<br><strong>금색 용 꿈</strong> — 엄청난 재물운! 금 = 재물이므로, 예상치 못한 큰 돈이 들어올 수 있습니다. 투자, 복권, 사업 수익 등. 반드시 로또를 사보세요.<br><strong>청룡 꿈</strong> — 성장과 발전의 에너지. 새로운 시작이 크게 성공합니다. 학업, 창업, 새 직장 등에서 좋은 결과.<br><strong>용이 물에서 나오는 꿈</strong> — 숨어있던 재능이나 기회가 드디어 세상에 드러납니다. 때가 왔습니다.<br><strong>용과 대화하거나 용을 타는 꿈</strong> — 당신이 특별한 사명을 가지고 있음을 나타냅니다. 리더로서의 운명이 기다리고 있습니다."},
{k:"거미",emoji:"🕷️",cat:"동물",tags:["거미","거미줄","거미꿈","거미물리는꿈","큰거미"],
text:"거미는 그물을 짜는 인내심 있는 존재로, <strong>창조, 운명의 그물, 인내, 그리고 복잡한 인간관계</strong>를 상징합니다. 그리스 신화의 아라크네처럼, 거미는 운명을 짜는 존재입니다.<br><br><strong>거미줄을 보는 꿈</strong> — 복잡하게 얽힌 인간관계나 상황을 나타냅니다. 당신이 놓은 그물일 수도, 다른 사람이 놓은 함정일 수도 있습니다. 상황을 객관적으로 파악하세요.<br><strong>거미가 줄을 짜는 꿈</strong> — 당신의 노력이 서서히 결실을 맺고 있습니다. 인내심을 가지세요. 거미처럼 차근차근 준비하면 큰 것을 잡을 수 있습니다.<br><strong>거미를 잡는 꿈</strong> — 복잡한 문제를 해결하고 상황을 통제하게 됩니다. 얽힌 관계를 정리하는 계기가 옵니다.<br><strong>거미에게 물리는 꿈</strong> — 누군가의 교묘한 함정에 빠질 수 있습니다. 달콤한 제안이나 좋은 조건 뒤에 숨겨진 의도를 파악하세요.<br><strong>큰 거미가 나타나는 꿈</strong> — 큰 프로젝트나 결정이 다가오고 있습니다. 무섭지만 도망치지 말고 직면하세요.<br><strong>거미줄에 걸리는 꿈</strong> — 현재 상황에서 벗어나기 어렵다고 느끼고 있습니다. 하지만 거미줄은 찢을 수 있습니다."},
{k:"나비",emoji:"🦋",cat:"동물",tags:["나비","나비꿈","호접","노란나비","흰나비"],
text:"나비는 애벌레에서 번데기를 거쳐 아름답게 변신하는 존재로, <strong>변신, 영혼, 아름다움, 덧없음, 그리고 부활</strong>을 상징합니다. 장자의 '호접지몽(胡蝶之夢)'처럼, 꿈과 현실의 경계를 넘나드는 존재입니다.<br><br><strong>나비가 날아다니는 꿈</strong> — 인생의 전환기에 있습니다. 애벌레 시절을 지나 더 아름다운 단계로 변화하고 있습니다. 변화를 두려워하지 마세요, 당신은 이미 날개를 가지고 있습니다.<br><strong>나비가 몸에 앉는 꿈</strong> — 행운이 당신에게 직접 찾아옵니다! 사랑, 기쁜 소식, 좋은 인연이 올 수 있습니다.<br><strong>노란 나비 꿈</strong> — 기쁨과 행복의 상징. 밝고 즐거운 시기가 다가옵니다.<br><strong>흰 나비 꿈</strong> — 돌아가신 분의 영혼이 당신을 찾아온 것일 수 있습니다. 위로와 보호의 메시지.<br><strong>나비를 잡는 꿈</strong> — 덧없는 아름다움을 붙잡으려는 마음. 사랑이 찾아오거나 기쁜 소식이 오지만, 집착하면 사라질 수 있습니다.<br><strong>죽은 나비 꿈</strong> — 하나의 아름다운 시기가 끝나고 있습니다. 슬프지만 새로운 변신을 위한 과정입니다."},
{k:"소",emoji:"🐂",cat:"동물",tags:["소","황소","소꿈","송아지","암소"],
text:"소는 동서양 모두에서 <strong>성실, 풍요, 인내, 부</strong>의 상징입니다. 농경 사회에서 소는 가장 귀한 재산이었으므로, 소꿈은 대체로 길몽입니다.<br><br><strong>살찐 소를 보는 꿈</strong> — 풍요와 번영이 다가옵니다. 재정적으로 안정되는 시기.<br><strong>소가 들판에서 풀을 뜯는 꿈</strong> — 꾸준한 노력이 결실을 맺습니다. 급하지 않아도 됩니다. 소처럼 성실하게 가면 됩니다.<br><strong>소를 타는 꿈</strong> — 사업이 번창하거나 재산이 늘어납니다. 순탄한 발전을 나타냅니다.<br><strong>황소가 돌진하는 꿈</strong> — 강한 에너지와 추진력. 하지만 너무 돌진하면 다칠 수 있으니 방향을 잘 잡으세요.<br><strong>송아지 꿈</strong> — 새로운 자산이나 기회의 시작. 작지만 성장할 잠재력이 큽니다."},
{k:"쥐",emoji:"🐀",cat:"동물",tags:["쥐","생쥐","쥐꿈","햄스터"],
text:"쥐는 <strong>재치, 생존력, 재물, 그리고 은밀함</strong>을 상징합니다. 12지신의 첫 번째 동물이기도 합니다.<br><br><strong>쥐가 집에 나타나는 꿈</strong> — 재물이 들어오거나, 작은 행운이 쌓입니다. 다만 위생적으로 불쾌했다면 사소한 문제를 정리해야 합니다.<br><strong>쥐가 많이 나오는 꿈</strong> — 걱정거리가 여러 개 있지만, 각각은 크지 않습니다. 하나씩 처리하면 됩니다.<br><strong>흰 쥐 꿈</strong> — 순수한 재물운. 예상치 못한 소득이 생깁니다.<br><strong>쥐를 잡는 꿈</strong> — 사소한 문제를 해결하거나, 숨어있던 기회를 포착합니다.<br><strong>쥐가 도망치는 꿈</strong> — 작은 기회를 놓칠 수 있습니다. 세심한 주의가 필요합니다."},

{k:"물",emoji:"💧",cat:"자연",tags:["물","강","호수","수영","홍수","물꿈","맑은물","탁한물","물에빠지는꿈"],
text:"물은 심리학자 칼 융이 '무의식의 가장 보편적 상징'이라고 부른 것으로, <strong>감정, 무의식, 생명력, 정화, 그리고 변화</strong>를 상징합니다. 물의 상태는 당신의 감정 상태를 직접 반영합니다.<br><br><strong>맑고 깨끗한 물 꿈</strong> — 마음이 맑고 평화로운 상태입니다. 감정적으로 건강하며, 앞으로 좋은 일이 생깁니다. 맑은 물을 마시는 꿈이라면 건강운도 좋습니다.<br><strong>탁하고 더러운 물 꿈</strong> — 감정적 혼란, 불안, 또는 해결되지 않은 문제가 있습니다. 내면을 정화할 시간이 필요합니다. 무엇이 물을 흐리게 하고 있는지 생각해보세요.<br><strong>홍수 꿈</strong> — 억눌렸던 감정이 한꺼번에 폭발하려 합니다. 또는 인생에 큰 변화의 물결이 밀려오고 있습니다. 저항하기보다 흐름에 몸을 맡기되, 높은 곳으로 올라가세요.<br><strong>물에 빠지는 꿈</strong> — 감정에 압도되고 있습니다. 현실에서 감당하기 어려운 상황에 처해있음을 나타냅니다. 주변에 도움을 구하세요.<br><strong>물 위를 걷는 꿈</strong> — 감정을 초월하고 있습니다! 어려운 상황에서도 흔들리지 않는 내면의 힘이 있습니다.<br><strong>폭포 꿈</strong> — 감정의 해방과 정화. 오래 참아왔던 것을 시원하게 풀어내게 됩니다.<br><strong>잔잔한 호수 꿈</strong> — 내면의 깊은 평화. 명상적인 시기로, 직관이 맑아집니다."},
{k:"불",emoji:"🔥",cat:"자연",tags:["불","화재","불꿈","방화","촛불","불나는꿈","산불"],
text:"불은 인류 문명의 시작이자, 꿈에서는 <strong>열정, 변혁, 파괴와 재생, 분노, 그리고 영감</strong>을 상징합니다. 동양에서 불꿈은 놀랍게도 대표적인 길몽입니다.<br><br><strong>집에 불이 활활 타는 꿈</strong> — 역설적으로 매우 좋은 길몽! 한국 전통 해몽에서 화재꿈은 재물이 크게 들어오거나, 사업이 번창하는 것을 의미합니다. 불길이 크고 밝을수록 재물의 규모도 큽니다.<br><strong>불을 끄는 꿈</strong> — 닥칠 뻔한 위기를 잘 넘기게 됩니다. 문제 해결 능력이 빛을 발합니다.<br><strong>불에 타는 꿈</strong> — 열정이 지나치게 타오르고 있거나, 분노를 다스려야 합니다. 에너지를 건강한 방향으로 전환하세요.<br><strong>촛불이 타는 꿈</strong> — 희망, 영적 인도, 따뜻한 위안을 나타냅니다. 어둠 속에서도 길을 찾게 됩니다.<br><strong>산불 꿈</strong> — 통제할 수 없는 큰 변화가 밀려오고 있습니다. 무섭지만, 산불 뒤에는 더 비옥한 땅이 됩니다.<br><strong>모닥불 꿈</strong> — 따뜻한 공동체와 친밀한 관계를 원하고 있습니다. 사람들과의 유대가 강해집니다.<br><strong>불꽃놀이 꿈</strong> — 축하와 기쁨! 좋은 일이 화려하게 펼쳐집니다."},
{k:"산",emoji:"⛰️",cat:"자연",tags:["산","등산","산꼭대기","절벽","산꿈","등산꿈"],
text:"산은 인류 문화에서 <strong>신성한 영역, 목표, 도전, 극복, 그리고 인생의 높이</strong>를 상징합니다. 산의 높이와 당신의 위치가 해석의 핵심입니다.<br><br><strong>산을 힘차게 오르는 꿈</strong> — 목표를 향해 꾸준히 전진하고 있습니다. 힘들지만 멈추지 마세요, 정상이 가까워지고 있습니다. 주변 풍경이 아름다웠다면 과정 자체도 즐기고 있다는 뜻.<br><strong>산꼭대기에 서는 꿈</strong> — 인생의 정점! 오랜 노력이 결실을 맺어 성취감이 넘칩니다. 성공, 합격, 승진의 매우 강력한 길몽입니다.<br><strong>산에서 내려오는 꿈</strong> — 한 단계를 마무리하고 안정기에 접어들고 있습니다. 또는 겸손하게 일상으로 돌아갈 때입니다.<br><strong>산이 무너지는 꿈</strong> — 굳건하다고 믿었던 것이 흔들립니다. 직장, 관계, 건강 등에서 예상치 못한 변화가 올 수 있습니다.<br><strong>절벽 앞에 서는 꿈</strong> — 중대한 결정의 순간. 뛰어내릴 용기가 필요할 수도 있고, 돌아갈 지혜가 필요할 수도 있습니다.<br><strong>아름다운 산 풍경을 보는 꿈</strong> — 마음의 평화와 영적 성장. 인생의 큰 그림이 보이는 시기입니다."},
{k:"꽃",emoji:"🌸",cat:"자연",tags:["꽃","장미","벚꽃","꽃밭","꽃다발","해바라기","연꽃","꽃꿈"],
text:"꽃은 자연이 빚어낸 가장 아름다운 표현으로, <strong>사랑, 아름다움, 성장, 결실, 그리고 인생의 계절</strong>을 상징합니다.<br><br><strong>꽃이 활짝 피는 꿈</strong> — 오래 기다린 노력의 결실! 사랑이 꽃피거나, 일이 성사되거나, 인정받게 됩니다.<br><strong>꽃을 받는 꿈</strong> — 누군가의 사랑이나 감사를 받게 됩니다. 고백, 축하, 좋은 제안이 올 수 있습니다.<br><strong>벚꽃 꿈</strong> — 아름답지만 순간적인 것. 지금 이 순간을 충분히 즐기세요. 아름다운 만남이 있지만 영원하지 않을 수 있습니다.<br><strong>장미 꿈</strong> — 열정적 사랑. 빨간 장미는 뜨거운 연애를, 흰 장미는 순수한 사랑을, 시든 장미는 식어가는 감정을 나타냅니다.<br><strong>연꽃 꿈</strong> — 진흙 속에서 피어나는 연꽃처럼, 어려운 환경에서도 아름다운 결과를 만들어냅니다. 영적 성장의 꿈.<br><strong>꽃밭을 걷는 꿈</strong> — 행복과 풍요가 가득한 시기. 인생이 아름다운 계절에 접어들고 있습니다.<br><strong>꽃이 시드는 꿈</strong> — 관계나 상황의 끝을 나타냅니다. 슬프지만, 계절이 바뀌면 다시 새 꽃이 핍니다.<br><strong>해바라기 꿈</strong> — 밝은 에너지와 희망! 태양을 향해 자라는 해바라기처럼, 긍정적인 방향으로 나아가세요."},
{k:"비",emoji:"🌧️",cat:"자연",tags:["비","폭우","소나기","비오는꿈","장마","우산","천둥","번개"],
text:"비는 하늘이 내리는 축복으로, <strong>정화, 감정 해소, 슬픔 후의 치유, 풍요, 그리고 새로운 시작</strong>을 상징합니다.<br><br><strong>비를 맞으며 걷는 꿈</strong> — 감정이 정화되고 있습니다. 쌓여있던 스트레스와 슬픔이 비와 함께 씻겨 내려갑니다. 비 맞는 느낌이 상쾌했다면 특히 좋은 꿈.<br><strong>폭우/장대비 꿈</strong> — 감정의 격변기입니다. 한 번에 많은 것이 쏟아지지만, 이 비가 그치면 놀라울 정도로 맑은 하늘이 펼쳐집니다.<br><strong>비가 그치고 해가 나는 꿈</strong> — 어려운 시기가 끝나고 희망이 찾아옵니다. 오래 기다려왔다면, 때가 왔습니다.<br><strong>우산을 쓰는 꿈</strong> — 보호받고 있거나, 어려운 상황에 잘 대비되어 있습니다. 든든한 사람이 곁에 있습니다.<br><strong>천둥번개를 동반한 비 꿈</strong> — 갑작스러운 깨달음이나 충격적인 소식이 올 수 있습니다. 하지만 번개가 치는 곳에 빛도 있습니다.<br><strong>보슬비 꿈</strong> — 잔잔한 감정의 흐름. 부드러운 변화와 치유가 일어나고 있습니다."},
{k:"눈",emoji:"❄️",cat:"자연",tags:["눈","눈오는꿈","설경","눈사람","눈꿈","폭설","눈밭"],
text:"눈은 세상을 하얗게 덮어 모든 것을 새롭게 만드는 것처럼, <strong>순수, 고요, 새로운 시작, 정화, 그리고 감정의 동결</strong>을 상징합니다.<br><br><strong>하얀 눈이 내리는 꿈</strong> — 새롭고 깨끗한 시작이 다가옵니다. 과거의 흔적이 눈으로 덮이듯, 새출발의 기회가 옵니다. 풍경이 아름다웠다면 특히 길몽.<br><strong>눈밭을 걷는 꿈</strong> — 고독하지만 순수한 시간. 혼자만의 시간을 통해 자기 자신을 깊이 되돌아보세요. 발자국을 남기고 있다면 당신만의 길을 개척하고 있는 것입니다.<br><strong>폭설 꿈</strong> — 갑작스러운 변화로 일상이 멈출 수 있습니다. 하지만 눈은 반드시 녹습니다. 잠시 쉬어가는 시간으로 받아들이세요.<br><strong>눈사람을 만드는 꿈</strong> — 창조적 에너지! 즐거운 일이 생기거나, 누군가와의 관계가 따뜻해집니다.<br><strong>눈이 녹는 꿈</strong> — 얼었던 감정이 풀리고 있습니다. 냉각되었던 관계가 회복되거나, 막혔던 일이 풀립니다."},
{k:"바다",emoji:"🌊",cat:"자연",tags:["바다","파도","해변","바닷가","해일","바다꿈","수영"],
text:"끝없이 펼쳐진 바다는 <strong>무의식의 깊이, 감정의 대양, 무한한 가능성, 그리고 생명의 근원</strong>을 상징합니다. 바다의 상태는 당신 감정의 현재 상태를 가장 직접적으로 보여줍니다.<br><br><strong>잔잔하고 아름다운 바다 꿈</strong> — 내면이 깊이 평화롭습니다. 큰 걱정 없이 안정된 시기를 보내고 있으며, 이 평화가 계속됩니다.<br><strong>거친 파도 꿈</strong> — 감정의 폭풍이 다가오고 있습니다. 걱정, 분노, 슬픔 등 강렬한 감정의 물결이 올 수 있습니다. 하지만 파도는 반드시 잔잔해집니다.<br><strong>바다에서 헤엄치는 꿈</strong> — 감정을 잘 다루고 있습니다. 무의식의 바다를 자유롭게 탐험하고 있으며, 자기 이해가 깊어지고 있습니다.<br><strong>바다에 빠지는 꿈</strong> — 감정에 압도되고 있습니다. 현실에서 감당하기 어려운 상황. 물 위로 올라왔다면 극복의 신호.<br><strong>해일(쓰나미) 꿈</strong> — 억눌러왔던 거대한 감정이 한꺼번에 밀려옵니다. 피할 수 없으므로 받아들이고 높은 곳으로 피하세요. 변화 후에는 새로운 풍경이 펼쳐집니다.<br><strong>해변을 걷는 꿈</strong> — 의식과 무의식의 경계에서 성찰하고 있습니다. 평화롭고 치유적인 시간."},
{k:"하늘",emoji:"🌤️",cat:"자연",tags:["하늘","구름","무지개","하늘꿈","별","달","해"],

{k:"죽은 사람",emoji:"👻",cat:"사람",tags:["죽은사람","돌아가신분","고인","조상","할머니","할아버지","돌아가신부모님"],
text:"돌아가신 분이 꿈에 나타나는 것은 <strong>영적 메시지, 미해결된 감정, 보호, 그리고 삶과 죽음의 경계를 넘어선 유대</strong>를 의미합니다. 많은 문화에서 이 꿈을 '저승에서 오는 편지'로 여깁니다.<br><br><strong>돌아가신 분이 환하게 웃는 꿈</strong> — 가장 좋은 신호입니다. 저승에서 편안히 계시며, 당신의 삶을 축복하고 있습니다. '잘 살고 있다, 걱정 마라'는 메시지입니다.<br><strong>돌아가신 분이 무언가를 말씀하시는 꿈</strong> — 매우 중요한 메시지입니다! 깨어난 직후 내용을 반드시 기억하고 기록하세요. 현실에서의 결정에 직접적인 힌트가 담겨 있을 수 있습니다.<br><strong>돌아가신 분이 음식을 주는 꿈</strong> — 전통적으로 주의를 요하는 꿈입니다. 건강을 돌보라는 경고일 수 있습니다. 건강검진을 받아보는 것이 좋습니다.<br><strong>돌아가신 분을 안는 꿈</strong> — 깊은 그리움의 표현이자, 위안의 메시지입니다. '괜찮다, 항상 곁에 있다'는 위로입니다.<br><strong>돌아가신 분이 건강하게 살아 돌아오는 꿈</strong> — 미해결된 슬픔이 있습니다. 아직 이별을 온전히 받아들이지 못했을 수 있습니다. 시간을 가지세요.<br><strong>돌아가신 분이 화내시는 꿈</strong> — 당신의 양심이 경고하고 있습니다. 현실에서 잘못된 방향으로 가고 있지 않은지 돌아보세요.<br><strong>돌아가신 분이 어딘가를 가리키는 꿈</strong> — 그 방향에 중요한 기회나 주의해야 할 것이 있습니다."},
{k:"아기",emoji:"👶",cat:"사람",tags:["아기","아이","갓난아이","임신","출산","아기꿈","태몽","쌍둥이"],
text:"아기는 인생에서 가장 순수한 존재로, <strong>새로운 시작, 무한한 가능성, 순수함, 창조성, 그리고 내면의 아이</strong>를 상징합니다.<br><br><strong>예쁜 아기를 안는 꿈</strong> — 새로운 프로젝트, 관계, 아이디어가 시작되며 성공적으로 진행됩니다. 태몽일 수도 있습니다.<br><strong>아기가 방긋 웃는 꿈</strong> — 순수한 기쁨이 찾아옵니다. 걱정을 내려놓고 아이의 눈으로 세상을 바라보세요.<br><strong>아기가 우는 꿈</strong> — 돌봐야 할 일을 소홀히 하고 있습니다. 자기 내면의 상처받은 아이가 관심을 구하고 있을 수도 있습니다.<br><strong>임신 꿈</strong> — 반드시 실제 임신을 뜻하지 않습니다! 아이디어, 프로젝트, 계획 등 무언가가 당신 안에서 자라고 있습니다. 출산이 가까우면 곧 결실을 봅니다.<br><strong>쌍둥이 아기 꿈</strong> — 기쁨이 두 배! 좋은 일이 연달아 생기거나, 두 가지 축복이 동시에 옵니다.<br><strong>아기를 잃어버리는 꿈</strong> — 중요한 가능성이나 기회를 놓치고 있다는 불안감. 정말 소중한 것이 무엇인지 되돌아보세요.<br><strong>아기에게 젖을 먹이는 꿈</strong> — 당신의 돌봄과 사랑이 무언가를 성장시키고 있습니다. 좋은 부모, 멘토, 리더가 되고 있습니다."},

text:"연인이 꿈에 나타나는 것은 <strong>사랑에 대한 갈망, 현재 관계의 상태, 자아의 또 다른 면, 그리고 감정적 욕구</strong>를 반영합니다.<br><br><strong>현재 연인과 행복한 시간을 보내는 꿈</strong> — 관계가 안정적이고 사랑이 깊다는 확인입니다. 또는 더 많은 행복한 시간을 원하고 있습니다.<br><strong>연인과 크게 싸우는 꿈</strong> — 말로 표현하지 못한 불만이나 갈등이 있습니다. 꿈에서 싸웠다고 현실에서 화내지 말고, 대화를 통해 풀어보세요.<br><strong>전 연인(ex) 꿈</strong> — 과거에 대한 미련보다는, 그 시절의 감정 패턴이 현재에도 반복되고 있다는 신호입니다. 같은 실수를 반복하지 않으려면 무엇이 달라져야 하는지 생각해보세요.<br><strong>모르는 사람과 사랑에 빠지는 꿈</strong> — 자기 안의 새로운 면을 발견하고 있습니다. 그 모르는 사람은 당신 자신의 숨겨진 측면일 수 있습니다.<br><strong>연인이 바람피우는 꿈</strong> — 실제 바람이 아니라, 관계에 대한 불안감을 나타냅니다. 자신감 부족이나 버림받는 것에 대한 두려움일 수 있습니다.<br><strong>첫사랑 꿈</strong> — 가장 순수했던 감정의 시절을 그리워하고 있습니다. 지금의 삶에 그 순수함을 되찾고 싶은 마음입니다."},

{k:"쫓기는 꿈",emoji:"🏃",cat:"상황",tags:["쫓기는","도망","추적","도망치는꿈","쫓기는꿈"],

{k:"돈",emoji:"💰",cat:"사물",tags:["돈","지폐","동전","돈줍는꿈","돈잃는꿈","부자","돈꿈","금","보석"],
text:"돈은 현대 사회의 가장 강력한 상징으로, <strong>가치, 자존감, 에너지, 능력, 그리고 교환</strong>을 나타냅니다. 돈꿈은 재물운을 직접 암시하기도 합니다.<br><br><strong>돈을 줍는 꿈</strong> — 예상치 못한 행운! 길바닥의 동전은 소소한 기쁨, 지폐 다발은 큰 행운을 암시합니다. 깨어난 후 로또를 사보라는 이유가 있는 꿈.<br><strong>돈을 잃어버리는 꿈</strong> — 에너지나 자신감을 잃고 있습니다. 또는 소중한 것을 소홀히 하고 있다는 경고. 무엇에 에너지를 낭비하고 있는지 점검하세요.<br><strong>돈이 쏟아지는 꿈</strong> — 풍요가 넘칩니다! 재물운이 매우 좋으며, 노력한 것이 크게 돌아옵니다.<br><strong>돈을 세는 꿈</strong> — 현재 상황을 점검하고 있습니다. 가진 것에 감사하거나, 계획을 세울 때입니다.<br><strong>돈을 빌려주는 꿈</strong> — 에너지를 다른 사람에게 나눠주고 있습니다. 적절한지 생각해보세요.<br><strong>금/보석을 발견하는 꿈</strong> — 숨겨진 재능이나 가치를 발견합니다. 자신도 몰랐던 능력이 빛을 발합니다.<br><strong>빈 지갑 꿈</strong> — 에너지 고갈, 공허함. 충전이 필요합니다."},
{k:"자동차",emoji:"🚗",cat:"사물",tags:["자동차","차","운전","교통사고","차꿈","브레이크","주차"],
text:"자동차는 현대인의 가장 개인적인 이동 수단으로, <strong>인생의 방향, 통제력, 야망, 사회적 지위, 그리고 자아</strong>를 상징합니다.<br><br><strong>자신이 운전하는 꿈</strong> — 인생의 핸들을 쥐고 있습니다. 스스로의 삶을 주도적으로 이끌어가고 있다는 좋은 신호.<br><strong>다른 사람이 운전하는 꿈</strong> — 인생의 통제권이 다른 사람에게 있다고 느끼고 있습니다. 운전자가 누구인지가 중요합니다.<br><strong>교통사고 꿈</strong> — 급격한 변화나 방향 전환을 경고합니다. 현재 속도가 너무 빠르거나, 방향이 잘못되었을 수 있습니다. 한 박자 쉬어가세요.<br><strong>브레이크가 안 듣는 꿈</strong> — 멈출 수 없는 상황에 대한 공포. 삶이 통제 불능이라고 느끼고 있습니다.<br><strong>새 차를 사는 꿈</strong> — 인생의 새로운 단계! 새로운 정체성이나 방향으로 나아갑니다.<br><strong>차가 고장 나는 꿈</strong> — 계획에 차질이 생기거나, 에너지가 바닥납니다. 정비(= 자기 관리)가 필요합니다.<br><strong>주차 공간을 찾는 꿈</strong> — 인생에서 자신의 자리를 찾고 있습니다. 안정적인 위치를 원하고 있습니다."},
{k:"집",emoji:"🏠",cat:"사물",tags:["집","이사","새집","빈집","집꿈","옛날집","지하실","다락방"],
text:"집은 꿈의 세계에서 <strong>당신 자신, 내면의 구조, 마음의 상태, 안정, 그리고 정체성</strong>을 상징합니다. 집의 각 부분은 당신의 다른 면을 나타냅니다.<br><br><strong>새 집에 들어가는 꿈</strong> — 인생의 새로운 단계. 환경이 바뀌거나, 자기 자신에 대한 새로운 이해가 열립니다.<br><strong>집이 무너지는 꿈</strong> — 내면의 안정이 크게 흔들리고 있습니다. 정체성이나 삶의 기반에 위기가 올 수 있습니다.<br><strong>옛날 집(어린 시절의 집) 꿈</strong> — 과거의 기억과 감정을 되돌아보고 있습니다. 그 시절 해결하지 못한 것이 현재에 영향을 주고 있습니다.<br><strong>넓고 깨끗한 집 꿈</strong> — 마음이 넓고 정돈되어 있습니다. 평화로운 시기이며, 여유가 있습니다.<br><strong>집에 모르는 방이 있는 꿈</strong> — 자기 안에 아직 발견하지 못한 면이 있습니다! 숨겨진 재능이나 가능성을 탐색해보세요.<br><strong>지하실 꿈</strong> — 무의식의 깊은 곳. 억눌린 기억이나 감정이 묻혀 있습니다.<br><strong>다락방 꿈</strong> — 높은 이상이나 영적 세계. 또는 오래된 추억과 잊힌 것들."},
{k:"열쇠",emoji:"🔑",cat:"사물",tags:["열쇠","자물쇠","문","열쇠꿈","비밀번호"],
text:"열쇠는 <strong>기회, 해답, 비밀, 접근 권한, 그리고 열림과 닫힘</strong>을 상징합니다.<br><br><strong>열쇠를 찾는 꿈</strong> — 오래된 문제의 해답을 드디어 발견합니다! 갑자기 해결책이 떠오르거나, 결정적인 정보를 얻게 됩니다.<br><strong>열쇠를 잃어버리는 꿈</strong> — 중요한 기회를 놓치고 있거나, 해답에서 멀어지고 있습니다. 정말 중요한 것에 집중하세요.<br><strong>문을 여는 꿈</strong> — 새로운 세계가 열립니다! 기회, 관계, 지식의 문이 열리고 있습니다.<br><strong>잠긴 문 앞에 서 있는 꿈</strong> — 아직 열리지 않은 것이 있습니다. 인내심을 가지세요. 때가 되면 열쇠를 찾게 됩니다.<br><strong>여러 개의 열쇠 꿈</strong> — 여러 선택지와 가능성이 있습니다. 어떤 문을 열 것인지는 당신의 선택."},
{k:"거울",emoji:"🪞",cat:"사물",tags:["거울","거울꿈","깨진거울","거울보는꿈"],
text:"거울은 <strong>자아 인식, 진실, 반성, 자기 대면, 그리고 현실과 환상의 경계</strong>를 상징합니다.<br><br><strong>거울에 비친 자신을 보는 꿈</strong> — 자기 자신을 객관적으로 바라보라는 메시지. 현재 자신의 모습에 만족하시나요?<br><strong>거울에 다른 얼굴이 비치는 꿈</strong> — 숨겨진 자아의 발견. 인정하고 싶지 않은 면을 직면해야 합니다. 또는 자신도 몰랐던 새로운 면을 발견합니다.<br><strong>거울이 깨지는 꿈</strong> — 자아상이 산산조각 나고 있습니다. 환상이 깨지는 것이 아플 수 있지만, 깨진 거울 너머에 진짜 자신이 있습니다.<br><strong>거울이 안 보이는(흐릿한) 꿈</strong> — 자기 자신을 잃어가고 있습니다. 정체성에 혼란이 있습니다. 잠시 멈추고 '나는 누구인가' 생각해보세요.<br><strong>아름다운 거울 속 자신 꿈</strong> — 자존감이 높아지고 있습니다. 자기 자신을 사랑하고 있는 좋은 상태입니다."},
{k:"옷",emoji:"👔",cat:"사물",tags:["옷","옷꿈","드레스","교복","유니폼","옷사는꿈"],
text:"옷은 <strong>사회적 페르소나, 정체성, 역할, 보호, 그리고 자기 표현</strong>을 상징합니다.<br><br><strong>새 옷을 입는 꿈</strong> — 새로운 역할이나 정체성을 얻게 됩니다. 변신과 새출발!<br><strong>옷이 안 맞는 꿈</strong> — 현재의 역할이나 상황이 자신에게 맞지 않다고 느끼고 있습니다.<br><strong>옷을 갈아입는 꿈</strong> — 태도나 접근 방식을 바꾸고 있습니다.<br><strong>화려한 옷 꿈</strong> — 인정받고 싶은 욕구. 사교적인 에너지가 높습니다.<br><strong>더러운 옷 꿈</strong> — 과거의 실수나 수치스러운 기억이 따라다니고 있습니다. 정화가 필요합니다."},

// ═══ 기타 ═══
{k:"결혼",emoji:"💒",cat:"기타",tags:["결혼","웨딩","신부","신랑","결혼식","약혼","결혼꿈"],
text:"결혼 꿈은 <strong>결합, 헌신, 새로운 인생 단계, 파트너십, 그리고 내면의 통합</strong>을 상징합니다. 반드시 실제 결혼을 의미하지 않습니다.<br><br><strong>자신이 결혼하는 꿈</strong> — 인생의 새로운 단계로 진입합니다. 프로젝트, 관계, 직장 등에서 중요한 '결합'이 이루어집니다. 심리학적으로는 자아의 다른 면과 통합되고 있다는 뜻이기도 합니다.<br><strong>결혼식이 화려한 꿈</strong> — 많은 사람의 축하와 인정을 받게 됩니다. 사회적 성취.<br><strong>결혼이 취소되는 꿈</strong> — 중요한 결정에 대한 불안이나 의심이 있습니다. 정말 원하는 것인지 다시 생각해보세요.<br><strong>모르는 사람과 결혼하는 꿈</strong> — 자기 안의 미지의 면과 결합하고 있습니다. 새로운 자아를 발견하는 과정.<br><strong>결혼식에 참석하는 꿈</strong> — 축하할 일이 생기거나, 다른 사람의 성공에서 영감을 받습니다.<br><strong>결혼식 준비 꿈</strong> — 중요한 일을 계획하고 준비하는 단계에 있습니다. 세심한 준비가 필요합니다."},
{k:"전화",emoji:"📱",cat:"기타",tags:["전화","핸드폰","전화꿈","문자","통화","전화벨"],
text:"전화는 현대의 가장 기본적인 소통 도구로, <strong>메시지, 연결, 소통, 기회, 그리고 직관적 신호</strong>를 상징합니다.<br><br><strong>전화가 울리는 꿈</strong> — 중요한 소식이나 기회가 찾아옵니다! 무의식이 '주목하라'고 말하고 있습니다.<br><strong>전화를 받아도 아무 소리도 없는 꿈</strong> — 소통의 단절. 중요한 메시지를 놓치고 있거나, 누군가와의 대화가 단절되어 있습니다.<br><strong>전화가 안 되는 꿈</strong> — 도움을 청하고 싶지만 연결되지 않는 좌절감. 고립감을 느끼고 있습니다.<br><strong>모르는 번호에서 전화가 오는 꿈</strong> — 예상치 못한 곳에서 기회가 옵니다. 미지의 가능성에 열려 있으세요.<br><strong>옛 연인/오래된 친구에게서 전화가 오는 꿈</strong> — 그 사람과의 미해결된 감정이 있거나, 그 시절로 돌아가고 싶은 마음입니다."},
{k:"길",emoji:"🛤️",cat:"기타",tags:["길","도로","갈림길","미로","길꿈","골목","터널"],
text:"길은 <strong>인생의 방향, 선택, 여정, 운명의 경로, 그리고 미래</strong>를 상징합니다.<br><br><strong>넓고 밝은 길 꿈</strong> — 앞길이 순탄합니다! 장애물 없이 목표를 향해 나아갈 수 있습니다. 자신감을 가지세요.<br><strong>갈림길에 서 있는 꿈</strong> — 인생의 중요한 선택의 순간. 어떤 길을 선택하든 그것이 당신의 운명이 됩니다. 직감을 믿으세요.<br><strong>미로에 갇히는 꿈</strong> — 혼란과 방향 상실. 너무 많은 선택지에 압도되어 있습니다. 한 발짝 물러서서 전체를 보세요.<br><strong>막다른 길 꿈</strong> — 현재의 접근 방식이 막혔습니다. 다른 방법, 다른 길을 찾아야 합니다. 포기가 아니라 방향 전환.<br><strong>터널을 지나는 꿈</strong> — 어둠 속을 지나가고 있지만, 끝에는 반드시 빛이 있습니다. 힘들어도 계속 가세요.<br><strong>길에서 보물을 발견하는 꿈</strong> — 인생의 여정 중에 예상치 못한 행운을 만납니다."},
{k:"학교",emoji:"🏫",cat:"기타",tags:["학교","교실","선생님","학교꿈","졸업","수업","시험"],
text:"학교는 <strong>배움, 성장, 과거의 기억, 사회화, 그리고 인생의 교훈</strong>을 상징합니다.<br><br><strong>학교로 돌아가는 꿈</strong> — 아직 배워야 할 인생의 교훈이 남아 있습니다. 또는 그 시절의 단순함과 구조가 그립습니다.<br><strong>교실에 앉아 있는 꿈</strong> — 현재 상황에서 뭔가를 배우고 있습니다. 수업 내용이 기억난다면 그것이 힌트.<br><strong>졸업하는 꿈</strong> — 한 단계를 완료했습니다! 축하합니다. 다음 레벨로 나아갈 준비가 되었습니다.<br><strong>학교에서 길을 잃는 꿈</strong> — 인생에서 방향을 잃고 있거나, 소속감을 찾지 못하고 있습니다.<br><strong>선생님 꿈</strong> — 인생의 멘토를 만나게 되거나, 자신이 누군가의 멘토가 됩니다."},
{k:"음식",emoji:"🍽️",cat:"기타",tags:["음식","밥","먹는꿈","요리","과일","고기","음식꿈","맛있는음식"],
text:"음식은 인간의 가장 기본적인 욕구로, <strong>에너지 보충, 감정적 만족, 영양, 사랑, 그리고 삶의 풍요</strong>를 상징합니다.<br><br><strong>맛있는 음식을 먹는 꿈</strong> — 인생에서 만족스러운 경험이 다가옵니다. 풍요와 감사의 시기입니다. 누군가와 함께 먹고 있었다면 그 사람과의 관계가 좋아집니다.<br><strong>상한 음식/맛없는 음식 꿈</strong> — 해로운 관계, 나쁜 습관, 독성 있는 환경에서 벗어나야 합니다. 무엇이 당신에게 해로운지 점검하세요.<br><strong>음식을 요리하는 꿈</strong> — 창조적 에너지가 넘칩니다! 무언가를 새로 만들어내고 있으며, 그 과정 자체가 즐겁습니다.<br><strong>음식을 나누어 먹는 꿈</strong> — 사랑과 관대함의 표현. 나눌수록 더 풍요로워지는 시기입니다.<br><strong>과일 꿈</strong> — 노력의 결실! 특히 잘 익은 과일은 때가 무르익었다는 뜻. 사과는 지혜, 포도는 풍요, 복숭아는 장수.<br><strong>고기 먹는 꿈</strong> — 에너지와 힘을 보충하고 있습니다. 현실에서 강해질 필요가 있다는 메시지."},

const POPULAR = ["뱀","이빨","물","죽은 사람","쫓기는 꿈","떨어지는 꿈","돈","불","아기","용","호랑이","돼지","고양이","바다"];
const CATEGORIES = {
    "🐾 동물": "동물",
    "🌿 자연": "자연",
    "👤 사람": "사람",
    "🦷 신체": "신체",
    "🎭 상황": "상황",
    "📦 사물·기타": ["사물","기타"]
};

// 인기 태그
document.getElementById('popularTags').innerHTML = POPULAR.map(p =>
    `<span class="tag" onclick="document.getElementById('searchInput').value='${p}';search();">${p}</span>`
).join('');

// 카테고리 브라우즈
let catHtml = '';
for (const [label, catVal] of Object.entries(CATEGORIES)) {
    const items = DREAMS.filter(d => Array.isArray(catVal) ? catVal.includes(d.cat) : d.cat === catVal);
    catHtml += `<div class="category-section">
        <div class="category-title">${label} (${items.length})</div>
        <div class="category-grid">
            ${items.map(d => `<div class="category-item" onclick="document.getElementById('searchInput').value='${d.k}';search();">
                <span class="ci-emoji">${d.emoji}</span>${d.k}
            </div>`).join('')}
        </div>
    </div>`;
}
document.getElementById('categoryBrowse').innerHTML = catHtml;

// 검색
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

function search() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) return;

    const results = DREAMS.filter(d =>
        d.k.toLowerCase().includes(q) ||
        d.tags.some(t => t.toLowerCase().includes(q))
    );

    const section = document.getElementById('resultSection');
    document.getElementById('browseSection').style.display = 'none';
    document.getElementById('shareBar').style.display = 'block';

    if (results.length === 0) {
        section.innerHTML = `
            <div class="no-result">
                <div class="emoji">🌙</div>
                <p>"<strong>${q}</strong>"에 대한 해몽을 찾지 못했습니다.</p>
                <p style="margin-top:8px;font-size:13px;">다른 키워드로 검색하거나, 아래 카테고리에서 찾아보세요.</p>
            </div>
        `;
        document.getElementById('browseSection').style.display = 'block';
    } else {
        section.innerHTML = `
            <div class="result-count">"${q}" 검색 결과 ${results.length}건</div>
            ${results.map(d => `
                <div class="dream-card">
                    <div class="dream-header">
                        <div class="dream-emoji">${d.emoji}</div>
                        <div>
                            <div class="dream-keyword">${d.k}</div>
                            <div class="dream-category">${d.cat}</div>
                        </div>
                    </div>
                    <div class="dream-text">${d.text}</div>
                    <div class="dream-tags">${d.tags.map(t => `<span class="dream-tag">${t}</span>`).join('')}</div>
                </div>
            `).join('')}
        `;
    }

    section.style.display = 'block';
    section.scrollIntoView({behavior: 'smooth'});
}
</script>
