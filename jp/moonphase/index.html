<script>
// 月の満ち欠け計算（John Conwayのアルゴリズムに基づく）
function getMoonPhase(year, month, day) {
    if (month <= 2) { year--; month += 12; }
    const A = Math.floor(year / 100);
    const B = 2 - A + Math.floor(A / 4);
    const JD = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
    const daysSinceNew = JD - 2451550.1;
    const newMoons = daysSinceNew / 29.530588853;
    const phase = newMoons - Math.floor(newMoons);
    return phase; // 0~1 (0=新月, 0.5=満月)
}

function getPhaseInfo(phase) {
    const illumination = Math.round(Math.abs(Math.cos(phase * 2 * Math.PI) * -0.5 + 0.5) * 100);
    const lunarDay = Math.round(phase * 29.5) + 1;

    if (phase < 0.0625) return {name:"新月",emoji:"🌑",idx:0,illumination,lunarDay,
        meaning:"<strong>新しい始まり</strong>のエネルギーに満ちています。月が完全に隠れるこの時期は、種を蒔くように、新しい意図や目標を立てるのに最適です。内側へ向かう時間であり、静かに計画を練りましょう。外に表すより、内側で芽吹かせる時です。",
        good:["新プロジェクトの開始","目標設定","瞑想・内省","日記を書く","デジタルデトックス"],
        bad:["大きな発表や公表","結論を出す","過度な社交活動"]};
    if (phase < 0.1875) return {name:"三日月",emoji:"🌒",idx:1,illumination,lunarDay,
        meaning:"蒔いた種が<strong>芽吹き始める</strong>時期です。意図を行動に移し始めましょう。まだ小さく弱々しいですが、コツコツとエネルギーを注げば育ちます。勇気を出して最初の一歩を踏み出しましょう。完璧でなくて大丈夫です。",
        good:["最初の行動を起こす","自己成長を始める","新しい習慣を作る","勇気を出す"],
        bad:["性急な判断","完璧主義","大きなリスク"]};
    if (phase < 0.3125) return {name:"上弦の月",emoji:"🌓",idx:2,illumination,lunarDay,
        meaning:"<strong>決断と行動</strong>の時期です。半月は光と闇のバランス——選択の瞬間です。障害が現れるかもしれませんが、それはあなたを試しているのです。大胆に決断して前進しましょう。挑戦から逃げないでください。",
        good:["重要な決断","挑戦・克服","問題と向き合う","積極的な行動"],
        bad:["優柔不断","諦め","回避"]};
    if (phase < 0.4375) return {name:"十三夜月",emoji:"🌔",idx:3,illumination,lunarDay,
        meaning:"<strong>磨きをかけて完成させる</strong>時期です。ほぼ満ちた月のように、目標に近づいています。細部を確認し、仕上げましょう。最後まで忍耐強く全力を尽くせば、満月に実を結びます。",
        good:["細部の調整","仕上げ作業","忍耐力を保つ","フィードバックを反映する"],
        bad:["新しいことを始める","方向転換","焦り"]};
    if (phase < 0.5625) return {name:"満月",emoji:"🌕",idx:4,illumination,lunarDay,
        meaning:"月のエネルギーが<strong>絶頂</strong>に達します！感情が高まり、直感が鋭くなり、隠されていたものが明らかになります。収穫の時——これまでの努力が実を結びます。感謝し、祝いましょう。満月の下での願いは特別な力を持ちます。",
        good:["祝い・感謝","願い事をする","直感に従う","成果を収穫する","気持ちを伝える"],
        bad:["感情的な決断","衝動的な行動","大きな喧嘩"]};
    if (phase < 0.6875) return {name:"十八夜月",emoji:"🌖",idx:5,illumination,lunarDay,
        meaning:"<strong>分かち合いと感謝</strong>の時期です。満月の光が徐々に減っていくように、受け取ったものを返し、分け与えましょう。学んだことを整理し、伝えましょう。内なる知恵が深まる時期です。",
        good:["分かち合い・奉仕","教える・メンタリング","感謝を伝える","整理・反省"],
        bad:["新しい始まり","欲張ること"]};
    if (phase < 0.8125) return {name:"下弦の月",emoji:"🌗",idx:6,illumination,lunarDay,
        meaning:"<strong>手放し、整理する</strong>時期です。もう必要のないものを手放しましょう——悪い習慣、有害な関係、古い荷物。新しいものが入るためには、スペースを空ける必要があります。許して手放しましょう。",
        good:["片付け・整理整頓","悪い習慣をやめる","許し・和解","不要なものを手放す"],
        bad:["新プロジェクト","執着すること","過去に縛られること"]};
    if (phase < 0.9375) return {name:"二十六夜月",emoji:"🌘",idx:7,illumination,lunarDay,
        meaning:"月が消える直前——<strong>休息と充電</strong>の時期です。エネルギーが低下するのは自然なサイクルです。無理せず十分に休みましょう。瞑想、夢、直感に注意を向けましょう。もうすぐ新月が訪れます。",
        good:["十分な休息","瞑想・祈り","夢日記","エネルギーの充電"],
        bad:["無理な活動","重要なスタート","過労"]};
    return {name:"新月",emoji:"🌑",idx:0,illumination:0,lunarDay:1,
        meaning:"<strong>新しい始まり</strong>のエネルギーに満ちています。静かに計画を練りましょう。",
        good:["新プロジェクトの開始","目標設定","瞑想"],
        bad:["大きな発表","結論を出す"]};
}

// 次の満月・新月を探す
function findNextPhase(targetPhase, startDate) {
    const d = new Date(startDate);
    for (let i = 1; i <= 35; i++) {
        d.setDate(d.getDate() + 1);
        const p = getMoonPhase(d.getFullYear(), d.getMonth() + 1, d.getDate());
        if (targetPhase === "full" && p >= 0.47 && p <= 0.53) return d;
        if (targetPhase === "new" && (p <= 0.03 || p >= 0.97)) return d;
    }
    return null;
}

// 月のSVGを描画
function drawMoon(phase) {
    const r = 90;
    const cx = 100, cy = 100;
    let d;
    const ill = phase <= 0.5 ? phase * 2 : (1 - phase) * 2;
    const sweep = phase <= 0.5 ? 1 : 0;
    const bulge = (ill - 0.5) * 2 * r;

    if (phase < 0.01 || phase > 0.99) {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1a1a2e" stroke="#333" stroke-width="1"/>`;
    }
    if (phase > 0.49 && phase < 0.51) {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#e8e4d4" />
                <circle cx="${cx-25}" cy="${cy-20}" r="12" fill="rgba(200,195,180,0.5)"/>
                <circle cx="${cx+20}" cy="${cy+15}" r="8" fill="rgba(200,195,180,0.4)"/>
                <circle cx="${cx+5}" cy="${cy-35}" r="6" fill="rgba(200,195,180,0.3)"/>`;
    }

    const lightSide = phase <= 0.5 ? "right" : "left";
    const darkFill = "#1a1a2e";
    const lightFill = "#e8e4d4";

    if (lightSide === "right") {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${lightFill}"/>
                <path d="M${cx},${cy-r} A${r},${r} 0 0,0 ${cx},${cy+r} A${Math.abs(bulge)},${r} 0 0,${bulge > 0 ? 0 : 1} ${cx},${cy-r}" fill="${darkFill}"/>`;
    } else {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${lightFill}"/>
                <path d="M${cx},${cy-r} A${r},${r} 0 0,1 ${cx},${cy+r} A${Math.abs(bulge)},${r} 0 0,${bulge > 0 ? 1 : 0} ${cx},${cy-r}" fill="${darkFill}"/>`;
    }
}

// メイン
const now = new Date();
const phase = getMoonPhase(now.getFullYear(), now.getMonth() + 1, now.getDate());
const info = getPhaseInfo(phase);
const nextFull = findNextPhase("full", now);
const nextNew = findNextPhase("new", now);

const PHASES = [
    {emoji:"🌑",name:"新月"},{emoji:"🌒",name:"三日月"},{emoji:"🌓",name:"上弦の月"},
    {emoji:"🌔",name:"十三夜月"},{emoji:"🌕",name:"満月"},{emoji:"🌖",name:"十八夜月"},
    {emoji:"🌗",name:"下弦の月"},{emoji:"🌘",name:"二十六夜月"}
];

function formatDate(d) {
    if (!d) return "-";
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function daysUntil(d) {
    if (!d) return "-";
    const diff = Math.ceil((d - now) / (1000*60*60*24));
    return `${diff}日後`;
}

const dayNames = ["日","月","火","水","木","金","土"];
const todayStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${dayNames[now.getDay()]}曜日）`;

document.getElementById("moonContent").innerHTML = `
    <div class="moon-display">
        <div class="moon-date">${todayStr}</div>
        <div class="moon-wrapper">
            <div class="moon-glow"></div>
            <svg class="moon-svg" viewBox="0 0 200 200">${drawMoon(phase)}</svg>
        </div>
        <div class="moon-name"><span class="moon-emoji">${info.emoji}</span>${info.name}</div>
        <div class="moon-sub">旧暦 約${info.lunarDay}日</div>
        <div class="moon-illumination">輝面比: ${info.illumination}%</div>
    </div>

    <div class="phase-timeline">
        ${PHASES.map((p, i) => `<div class="phase-item ${i === info.idx ? "active" : ""}">
            <div class="ph-emoji">${p.emoji}</div>
            <div class="ph-name">${p.name}</div>
        </div>`).join("")}
    </div>

    <div class="info-grid">
        <div class="info-card">
            <div class="info-label">次の満月 🌕</div>
            <div class="info-value">${formatDate(nextFull)}</div>
            <div class="info-sub">${daysUntil(nextFull)}</div>
        </div>
        <div class="info-card">
            <div class="info-label">次の新月 🌑</div>
            <div class="info-value">${formatDate(nextNew)}</div>
            <div class="info-sub">${daysUntil(nextNew)}</div>
        </div>
        <div class="info-card">
            <div class="info-label">月の周期</div>
            <div class="info-value">29.5日</div>
            <div class="info-sub">朔望周期</div>
        </div>
        <div class="info-card">
            <div class="info-label">現在位置</div>
            <div class="info-value">${Math.round(phase * 100)}%</div>
            <div class="info-sub">周期進行率</div>
        </div>
    </div>

    <div class="reading-card">
        <div class="reading-title">🌙 今日の月からのメッセージ</div>
        <div class="reading-text">${info.meaning}</div>
    </div>

    <div class="reading-card">
        <div class="reading-title">✅ この時期に良い活動 vs ❌ 避けるべき活動</div>
        <div class="activity-grid">
            ${info.good.map(g => `<div class="activity-item activity-good">✅ ${g}</div>`).join("")}
            ${info.bad.map(b => `<div class="activity-item activity-bad">❌ ${b}</div>`).join("")}
        </div>
    </div>

    <div class="reading-card">
        <div class="reading-title">📖 月の8つの満ち欠け</div>
        <div class="reading-text">
            <strong>🌑 新月</strong> — 新しい始まり、意図の設定<br>
            <strong>🌒 三日月</strong> — 種が芽吹く、最初の行動<br>
            <strong>🌓 上弦の月</strong> — 決断、挑戦、障害の克服<br>
            <strong>🌔 十三夜月</strong> — 磨きをかける、完成直前<br>
            <strong>🌕 満月</strong> — 絶頂、収穫、感情の高まり<br>
            <strong>🌖 十八夜月</strong> — 分かち合い、感謝、整理<br>
            <strong>🌗 下弦の月</strong> — 手放す、整理、許し<br>
            <strong>🌘 二十六夜月</strong> — 休息、充電、内側へ
        </div>
    </div>
`;
</script>
