        personality:"あなたは<strong>澄んで純粋な魂</strong>の持ち主です。世俗の汚れのないクリーンなエネルギーを持っています。自然な癒し能力があり、一緒にいると心が浄化されます。高いスピリチュアルレベルにあり、すべての色を包み込みます。",
        strength:"純粋さ、癒し力、包容力、スピリチュアルな成熟、浄化能力",
        weakness:"世間知らず、無邪気さ、自己防衛の欠如、疲労",
        advice:"純粋さを守りながら、世界の現実も知る必要があります。すべての色を包み込む力があなたの中にあります。",
        good:["緑","青"],bad:["赤","オレンジ"]}
};

let currentQ = 0;
const scores = {};

function startQuiz() {
    currentQ = 0;
    Object.keys(AURAS).forEach(k => scores[k] = 0);
    showQuestion();
}

function showQuestion() {
    if (currentQ >= QUESTIONS.length) { showResult(); return; }
    const q = QUESTIONS[currentQ];
    const pct = (currentQ / QUESTIONS.length) * 100;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressText").textContent = "質問 " + (currentQ + 1) + " / " + QUESTIONS.length;

    document.getElementById("questionCard").innerHTML =
        "<div class=\"question-num\">QUESTION " + (currentQ + 1) + "</div>" +
        "<div class=\"question-text\">" + q.q + "</div>" +
        "<div class=\"options\">" +
            q.o.map(function(opt, i) { return "<div class=\"option-btn\" onclick=\"answer(" + i + ")\">" + opt.t + "</div>"; }).join("") +
        "</div>";
}

function answer(idx) {
    const q = QUESTIONS[currentQ];
    q.o[idx].c.forEach(function(c) { scores[c] = (scores[c] || 0) + 1; });
    currentQ++;
    showQuestion();
}

function showResult() {
    document.getElementById("quizSection").style.display = "none";
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("progressText").textContent = "完了！";
    document.getElementById("shareBar").style.display = "block";

    const sorted = Object.entries(scores).sort(function(a, b) { return b[1] - a[1]; });
    const topColor = sorted[0][0];
    const subColor = sorted[1] ? sorted[1][0] : topColor;
    const a = AURAS[topColor];
    const sub = AURAS[subColor];

    const section = document.getElementById("resultSection");
    section.innerHTML =
        "<div class=\"aura-orb\">" +
            "<div class=\"glow\" style=\"background:" + a.color + ";\"></div>" +
            "<div class=\"inner\" style=\"background:radial-gradient(circle at 40% 40%, " + a.bg + ", rgba(10,10,26,0.9));\">" +
                "<div class=\"color-emoji\">" + a.emoji + "</div>" +
                "<div class=\"color-name\" style=\"color:" + a.color + ";\">" + a.name + "</div>" +
            "</div>" +
        "</div>" +

        "<div class=\"result-title\" style=\"color:" + a.color + ";\">あなたのオーラは... " + a.name + "!</div>" +
        "<div class=\"result-subtitle\">" + a.keyword + "</div>" +

        "<div class=\"trait-grid\">" +
            "<div class=\"trait-item\"><div class=\"trait-label\">元素</div><div class=\"trait-value\" style=\"color:" + a.color + ";\">" + a.element + "</div></div>" +
            "<div class=\"trait-item\"><div class=\"trait-label\">チャクラ</div><div class=\"trait-value\" style=\"color:" + a.color + ";\">" + a.chakra + "</div></div>" +
            "<div class=\"trait-item\"><div class=\"trait-label\">サブオーラ</div><div class=\"trait-value\" style=\"color:" + sub.color + ";\">" + sub.emoji + " " + sub.name + "</div></div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">🧿 性格分析</div>" +
            "<div class=\"reading-text\">" + a.personality + "</div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">💪 強み</div>" +
            "<div class=\"reading-text\"><strong>" + a.strength + "</strong></div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">⚠️ 弱み</div>" +
            "<div class=\"reading-text\">" + a.weakness + "</div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">💡 オーラからのアドバイス</div>" +
            "<div class=\"reading-text\"><strong>" + a.advice + "</strong></div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">💞 オーラ相性</div>" +
            "<div class=\"compat-grid\">" +
                a.good.map(function(g) {
                    const key = Object.keys(AURAS).find(function(k) { return AURAS[k].name.includes(g); });
                    return "<div class=\"compat-item compat-good\">相性◎: " + (key ? AURAS[key].emoji : "") + " " + g + "</div>";
                }).join("") +
                a.bad.map(function(b) {
                    const key = Object.keys(AURAS).find(function(k) { return AURAS[k].name.includes(b); });
                    return "<div class=\"compat-item compat-bad\">注意: " + (key ? AURAS[key].emoji : "") + " " + b + "</div>";
                }).join("") +
            "</div>" +
        "</div>" +

        "<button class=\"retry-btn\" onclick=\"location.reload()\">🔄 もう一度診断する</button>";

    section.style.display = "block";
    section.scrollIntoView({behavior:"smooth"});
}

startQuiz();
</script>

</body>
</html>
