function reduceNum(n) {
    while (n > 9 && n !== 11 && n !== 22) {
        n = String(n).split("").reduce((s, d) => s + Number(d), 0);
    }
    return n;
}

function seededRand(seed) {
    let s = seed;
    for (let i = 0; i < 10; i++) s = (s * 16807) % 2147483647;
    return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

                <div class="trait-label">前世の寿命</div>
                <div class="trait-value">${deathAge}歳</div>
            </div>
            <div class="trait-item">
                <div class="trait-label">カルマスコア</div>
                <div class="trait-value">${karmaScore}/100</div>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">🏛️ 前世のあなた</div>
            <div class="reading-text">
                あなたは<strong>${pl.era}</strong>の<strong>${pl.region}</strong>で<strong>${job}</strong>として生きていました。<br><br>
                ${pl.personality}
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">🔄 カルマ（前世が現世に与える影響）</div>
            <div class="reading-text">${pl.karma}</div>
            <div class="karma-meter">
                <div style="font-size:12px;color:#888;margin-bottom:4px;">カルマ解消率</div>
                <div class="karma-bar"><div class="karma-fill" style="width:${karmaScore}%;background:linear-gradient(90deg,#b8942a,#d4a853);"></div></div>
                <div class="karma-labels"><span>未解消</span><span>解消完了</span></div>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">⭐ 前世からの才能</div>
            <div class="reading-text"><strong>${pl.talent}</strong><br><br>これらの才能は現世でもあなたの中に潜んでいます。説明のできない引き寄せや、初めてなのに慣れ親しんだ感覚があれば、それが前世の記憶です。</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">😨 前世のトラウマ</div>
            <div class="reading-text"><strong>${pl.fear}</strong><br><br>現世で理由もなく怖いものがあるなら、前世の経験に由来するものかもしれません。</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💀 前世の死</div>
            <div class="reading-text">
                あなたは前世で<strong>${deathAge}歳</strong>に生涯を終えました。<br>
                死因: <strong>${death}</strong>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">📖 前世からの教訓</div>
            <div class="reading-text">前世のあなたが現世のあなたに最も伝えたいメッセージ：<br><br><strong>「${lesson}」</strong></div>
        </div>

        <button class="retry-btn" onclick="document.getElementById('resultSection').style.display='none';window.scrollTo({top:0,behavior:'smooth'});">🔄 もう一度テスト</button>
    `;
    section.style.display = "block";
    section.scrollIntoView({behavior:"smooth"});
}

(function() {
    const yEl = document.getElementById("birthYear");
    const mEl = document.getElementById("birthMonth");
    const dEl = document.getElementById("birthDay");
    const now = new Date();

    yEl.innerHTML = "<option value=\"\">年</option>";
    for (let y = now.getFullYear(); y >= 1920; y--) yEl.innerHTML += `<option value="${y}">${y}年</option>`;

    mEl.innerHTML = "<option value=\"\">月</option>";
    for (let m = 1; m <= 12; m++) mEl.innerHTML += `<option value="${m}">${m}月</option>`;

    function updateDays() {
        const y = parseInt(yEl.value) || 2000;
        const m = parseInt(mEl.value) || 1;
        const maxD = new Date(y, m, 0).getDate();
        const cur = parseInt(dEl.value);
        dEl.innerHTML = "<option value=\"\">日</option>";
        for (let d = 1; d <= maxD; d++) dEl.innerHTML += `<option value="${d}"${d===cur?" selected":""}>${d}日</option>`;
    }
    yEl.onchange = updateDays;
    mEl.onchange = updateDays;
    updateDays();
})();
</script>
