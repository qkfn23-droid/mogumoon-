    { name: 'Oc', ko: 'オク', glyph: '🐕', meaning: '犬/忠誠/導き手', element: '風', direction: '北', color: '白',

    { name: 'Chuen', ko: 'チュエン', glyph: '🐒', meaning: '猿/芸術家', element: '土', direction: '西', color: '青',

const TONES = [

    { num: 2, name: '二重性', meaning: '挑戦、均衡、選択。両極性を理解し均衡を見つけるエネルギー。パートナーシップ。' },

// HAAB months (365-day solar calendar)
const HAAB_MONTHS = ['Pop','Wo','Sip','Sotz','Sek','Xul','Yaxkin','Mol','Chen','Yax','Sak','Keh','Mak','Kankin','Muwan','Pax','Kayab','Kumku','Wayeb'];
const HAAB_MONTHS_KO = ['ポプ','ウォ','シプ','ソツ','セク','シュル','ヤシュキン','モル','チェン','ヤシュ','サク','ケ','マク','カンキン','ムワン','パシュ','カヤブ','クムク','ワイェブ(不吉な5日)'];

// ═══════════════════════════════════
// CALCULATION
// ═══════════════════════════════════
// GMT correlation constant (Goodman-Martinez-Thompson)
const GMT_CORRELATION = 584283;

function gregorianToJDN(y, m, d) {
    if (m <= 2) { y--; m += 12; }
    const A = Math.floor(y / 100);
    const B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524;
}

function jdnToMayaLongCount(jdn) {
    let d = jdn - GMT_CORRELATION;
    const baktun = Math.floor(d / 144000); d %= 144000;
    const katun = Math.floor(d / 7200); d %= 7200;
    const tun = Math.floor(d / 360); d %= 360;
    const winal = Math.floor(d / 20); d %= 20;
    const kin = d;
    return { baktun, katun, tun, winal, kin };
}

function jdnToTzolkin(jdn) {
    const num = ((jdn - GMT_CORRELATION + 19) % 13 + 13) % 13 + 1; // 1-13
    const sign = ((jdn - GMT_CORRELATION + 19) % 20 + 20) % 20; // 0-19
    return { num, sign };
}

function jdnToHaab(jdn) {
    const d = (jdn - GMT_CORRELATION + 348) % 365;
    const month = Math.floor(d / 20);
    const day = d % 20;
    return { month: Math.min(month, 18), day };
}

function initForm() {
    const y = document.getElementById('birthYear');
    const m = document.getElementById('birthMonth');
    const d = document.getElementById('birthDay');
    for (let i = 2025; i >= 1940; i--) {
        const o = document.createElement('option');
        o.value = i; o.textContent = i + '年';
        if (i === 1995) o.selected = true;
        y.appendChild(o);
    }
    for (let i = 1; i <= 12; i++) {
        const o = document.createElement('option');
        o.value = i; o.textContent = i + '月';
        if (i === 3) o.selected = true;
        m.appendChild(o);
    }
    for (let i = 1; i <= 31; i++) {
        const o = document.createElement('option');
        o.value = i; o.textContent = i + '日';
        if (i === 15) o.selected = true;
        d.appendChild(o);
    }
}

function calculate() {
    const year = parseInt(document.getElementById('birthYear').value);
    const month = parseInt(document.getElementById('birthMonth').value);
    const day = parseInt(document.getElementById('birthDay').value);

    const jdn = gregorianToJDN(year, month, day);
    const longCount = jdnToMayaLongCount(jdn);
    const tzolkin = jdnToTzolkin(jdn);
    const haab = jdnToHaab(jdn);

    const sign = DAY_SIGNS[tzolkin.sign];
    const tone = TONES[tzolkin.num - 1];

    // Long Count
    document.getElementById('longCount').textContent =
        longCount.baktun + '.' + longCount.katun + '.' + longCount.tun + '.' + longCount.winal + '.' + longCount.kin;

        <span class="tzolkin-glyph">${sign.glyph}</span>

        <div class="tzolkin-name">${sign.name}</div>
        <div class="tzolkin-name-ko">${sign.ko} — "${sign.meaning}"</div>

    // Info Grid
    document.getElementById('infoGrid').innerHTML = `
        <div class="info-item">

        </div>

            <div class="info-label">トーン (宇宙的目的)</div>

            <div class="info-desc">${tone.meaning}</div>
        </div>
        <div class="info-item">
            <div class="info-label">元素 / 方角</div>
            <div class="info-value">${sign.element} / ${sign.direction}</div>
            <div class="info-desc">色: ${sign.color}</div>
        </div>
        <div class="info-item">
            <div class="info-label">Haab (太陽暦)</div>
            <div class="info-value">${haab.day} ${HAAB_MONTHS[haab.month]}</div>
            <div class="info-desc">${HAAB_MONTHS_KO[haab.month]}</div>
        </div>
    `;

    // Sign Interpretation
    document.getElementById('signInterpWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">${sign.glyph} ${sign.name} (${sign.ko}) — "${sign.meaning}"</div>
            <div class="interp-text">${sign.personality}</div>
        </div>
        <div class="interp-card">
            <div class="interp-title">💪 強み</div>
            <div class="interp-text">${sign.strength}</div>
        </div>
        <div class="interp-card">
            <div class="interp-title">⚠️ 課題</div>
            <div class="interp-text">${sign.challenge}</div>
        </div>
        <div class="interp-card">
            <div class="interp-title">💼 適した職業</div>
            <div class="interp-text">${sign.career}</div>
        </div>
        <div class="interp-card">
            <div class="interp-title">💕 恋愛＆関係</div>
            <div class="interp-text">${sign.love}</div>
        </div>
        ${sign.spiritual ? `<div class="interp-card">
            <div class="interp-title">🔮 霊的メッセージ</div>
            <div class="interp-text">${sign.spiritual}</div>
        </div>` : ''}
        ${sign.wealth ? `<div class="interp-card">
            <div class="interp-title">💰 財運</div>
            <div class="interp-text">${sign.wealth}</div>
        </div>` : ''}
        ${sign.health ? `<div class="interp-card">
            <div class="interp-title">🏥 健康</div>
            <div class="interp-text">${sign.health}</div>
        </div>` : ''}
    `;

    // Tone Interpretation
    const toneComboTexts = {
        1: `トーン1「統合」は${sign.ko}のエネルギーに純粋な始まりの火花を与えます。あなたは${sign.ko}の特性を最も原初的で純粋な形で経験し、新しい周期を切り開くパイオニアです。独立的に自分の道を切り開く力があり、${sign.ko}のエネルギーを世界に初めて披露する役割をします。リーダーシップが強いですが協力を学ぶ必要があります。`,
        2: `トーン2「二重性」は${sign.ko}のエネルギーに均衡と選択の課題を与えます。あなたは${sign.ko}の光と影の両面を強く経験し、内面の両極性の間で均衡を見つけることが人生の核心テーマです。パートナーシップを通じて${sign.ko}のエネルギーが完成され、関係の中で最も大きな成長をします。`,
        3: `トーン3「活性化」は${sign.ko}のエネルギーを躍動的に動かします。あなたは${sign.ko}の特性を行動で表現する活動家で、アイデアを現実に移す推進力が優れています。創造的エネルギーにあふれ、${sign.ko}の潜在力を世界に活発に現します。ただしエネルギーを分散させないよう集中する練習が必要です。`,
        4: `トーン4「安定」は${sign.ko}のエネルギーに構造と基盤を提供します。あなたは${sign.ko}の特性を安定的で体系的に発現し、堅固な土台の上にこつこつと積み上げていく建築家です。四方向の均衡が取れており、${sign.ko}のエネルギーが実用的で持続可能な形で現れます。変化を恐れない柔軟性を養ってください。`,
        5: `トーン5「力能」は${sign.ko}のエネルギーに強力な中心と権限を与えます。あなたは${sign.ko}の特性を最も強力に発揮する位置にあり、宇宙的な力を付与された存在です。決断力が優れ、${sign.ko}のエネルギーが周囲に大きな影響力を及ぼします。その力を謙虚に使うことが霊的課題です。`,
        6: `トーン6「流動」は${sign.ko}のエネルギーを有機的で柔軟に流れさせます。あなたは${sign.ko}の特性が水のように状況に応じて自然に適応し、反応と流れの達人です。他の人のニーズに敏感に反応し、${sign.ko}のエネルギーを調和的に配分します。自分だけの方向性を失わないことが重要です。`,
        7: `トーン7「共鳴」は${sign.ko}のエネルギーを宇宙的周波数とつなげます。あなたは${sign.ko}の特性が最も霊的で直感的な方法で発現し、見えない世界とのチャンネルが開いています。神秘的な経験が多く、${sign.ko}のエネルギーがインスピレーションと予言の形で現れます。現実とのつながりを維持することが課題です。`,
        8: `トーン8「調和」は${sign.ko}のエネルギーを全てのものと調和させる力を与えます。あなたは${sign.ko}の特性を統合的でバランスの取れた方法で表現し、異なる要素を一つにまとめる能力があります。${sign.ko}のエネルギーがモデルとなり他の人々に手本を示します。完璧な調和に執着しないことが成長の鍵です。`,
        9: `トーン9「太陽」は${sign.ko}のエネルギーに生命力と実現の脈動を吹き込みます。あなたは${sign.ko}の特性を最も生き生きと活力にあふれた形で発現し、目標への強い意志があります。太陽のようにエネルギーが充満し、${sign.ko}の潜在力を現実で完全に実現する力を持っています。過度な情熱で他人を焼かないよう注意してください。`,
        10: `トーン10「顕現」は${sign.ko}のエネルギーを具体的現実にする力を与えます。あなたは${sign.ko}の特性が可視的な成果物として現れ、生産と完成の能力が優れています。夢を現実に変える錬金術師で、${sign.ko}のエネルギーが物質世界で具体的な形を備えます。内面の価値も外面の成果と同じくらい重要であることを覚えてください。`,
        11: `トーン11「解放」は${sign.ko}のエネルギーを解放し自由に放ちます。あなたは${sign.ko}の特性から不要なものを取り除き本質だけを残す能力があり、変化と解体を通じた自由を経験します。${sign.ko}のエネルギーが慣習を破り新しい可能性を開く方法で作用します。解体後に再建することも忘れないでください。`,
        12: `トーン12「協力」は${sign.ko}のエネルギーを分かち合いと理解の方法で発現します。あなたは${sign.ko}の特性を深く理解しそれを他の人々と共有する能力が優れています。複雑なことを明確に説明し、${sign.ko}のエネルギーをコミュニティのために使います。与えることと受け取ることのバランスを維持してください。`,
        13: `トーン13「超越」は${sign.ko}のエネルギーを最も高い次元に引き上げます。あなたは${sign.ko}の特性が最も超越的で宇宙的な方法で発現し、全ての周期の完成と新しい始まりの境界に立っています。${sign.ko}のエネルギーが忍耐と超越を通じて宇宙的知恵に昇華されます。最も高いエネルギーを持っているため、それに見合う責任感も伴います。`
    };

    document.getElementById('toneInterpWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">🔢 トーン ${tzolkin.num}: ${tone.name}</div>
            <div class="interp-text">
                ${tone.meaning}
            </div>
        </div>
        <div class="interp-card">
            <div class="interp-title">🌀 トーン ${tzolkin.num} 「${tone.name}」 + ${sign.glyph} ${sign.ko} 組み合わせ解釈</div>
            <div class="interp-text">
                ${toneComboTexts[tzolkin.num]}
            </div>
        </div>
    `;

    // Haab
    document.getElementById('haabWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">🌞 Haab 位置: ${haab.day} ${HAAB_MONTHS[haab.month]} (${HAAB_MONTHS_KO[haab.month]})</div>
            <div class="interp-text">
                Haabはマヤの<strong>365日太陽暦</strong>です。18の月（各20日）+ 5日のワイェブ（不吉な日）で構成されます。<br><br>
                ${haab.month === 18 ? '⚠️ ワイェブ（Wayeb）期間に生まれました。マヤの人々はこの5日間を危険だが強力な霊的エネルギーの時期と見ていました。特別な霊的使命を持って生まれたと解釈されます。' :
                  `${HAAB_MONTHS[haab.month]} 月の${haab.day}日。この時期は自然の循環の中で${haab.month < 6 ? '成長と始まり' : haab.month < 12 ? '収穫と結実' : '省察と準備'}のエネルギーを持ちます。`}
            </div>
        </div>
    `;

    // Fortune
    const fortuneTexts = [
        '創造と始まりのエネルギーが強いです。新しいプロジェクトを始めるのに良い時期。',
        'コミュニケーションと関係のエネルギー。縁を広げ、対話を通じて問題を解決してください。',
        '内面を振り返る時期。瞑想と自己省察を通じて答えを見つけてください。',
        '物質的豊かさのエネルギー。財政的な機会が訪れる可能性があります。',
        '変革の時期。古いものを捨て、新しい自分に出会う準備をしてください。'
    ];
    const fortuneIdx = (tzolkin.num + tzolkin.sign) % 5;

    document.getElementById('fortuneWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">🌀 ${sign.name} + トーン ${tzolkin.num}の運勢エネルギー</div>
            <div class="interp-text">
                ${fortuneTexts[fortuneIdx]}<br><br>
                <strong>ラッキーカラー:</strong> ${sign.color}<br>
                <strong>ラッキー方角:</strong> ${sign.direction}<br>
                <strong>元素:</strong> ${sign.element}<br>
                <strong>260日周期の位置:</strong> ${((tzolkin.sign * 13 + tzolkin.num - 1) % 260) + 1}/260
            </div>
        </div>
    `;

    // ═══════════════════════════════════
    // 相性
    // ═══════════════════════════════════
    const COMPAT_BEST = {
        0:[4,8,12,16], 1:[5,9,13,17], 2:[6,10,14,18], 3:[7,11,15,19],
        4:[0,8,12,16], 5:[1,9,13,17], 6:[2,10,14,18], 7:[3,11,15,19],
        8:[0,4,12,16], 9:[1,5,13,17], 10:[2,6,14,18], 11:[3,7,15,19],
        12:[0,4,8,16], 13:[1,5,9,17], 14:[2,6,10,18], 15:[3,7,11,19],
        16:[0,4,8,12], 17:[1,5,9,13], 18:[2,6,10,14], 19:[3,7,11,15]
    };
    const bestMatch = COMPAT_BEST[tzolkin.sign] || [];
    let compatHtml = `<div class="interp-card">
        <div class="interp-title">💞 ${sign.glyph} ${sign.ko}の相性</div>
        <div class="interp-text">
            <strong>最高の相性 (同じ元素「${sign.element}」・方角「${sign.direction}」):</strong><br><br>`;
    bestMatch.forEach(idx => {
        const s = DAY_SIGNS[idx];
        compatHtml += `${s.glyph} <strong>${s.ko}</strong> (${s.name}) — ${s.meaning}<br>`;
    });
    const challengeIdx = (tzolkin.sign + 10) % 20;
    const challengeSign = DAY_SIGNS[challengeIdx];
    compatHtml += `<br><strong>チャレンジ相性 (成長の関係):</strong><br>
        ${challengeSign.glyph} <strong>${challengeSign.ko}</strong> (${challengeSign.name}) — 互いに異なるからこそ学ぶ点が多いが葛藤もある関係。`;
    compatHtml += `</div></div>`;
    document.getElementById('compatWrap').innerHTML = compatHtml;

    // ═══════════════════════════════════
    // 今日のTzolkinエネルギー
    // ═══════════════════════════════════
    const todayJDN = gregorianToJDN(new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate());
    const todayTz = jdnToTzolkin(todayJDN);
    const todaySign = DAY_SIGNS[todayTz.sign];
    const todayTone = TONES[todayTz.num - 1];
    const isSameSign = todayTz.sign === tzolkin.sign;

    document.getElementById('todayWrap').innerHTML = `
        <div class="interp-card" ${isSameSign ? 'style="border:2px solid #e8a020;"' : ''}>
            <div class="interp-title">${todaySign.glyph} 今日: ${todayTz.num} ${todaySign.ko} (${todaySign.name})</div>
            <div class="interp-text">
                今日のエネルギー: <strong>トーン ${todayTz.num} 「${todayTone.name}」</strong> + <strong>${todaySign.ko} 「${todaySign.meaning}」</strong><br><br>
                ${isSameSign ? '🌟 <strong>今日はあなたのサインと同じ日です！</strong> エネルギーが最大化される特別な日。重要な決定や新しい始まりに良いです。' :
                  bestMatch.includes(todayTz.sign) ? '✨ 今日のエネルギーがあなたのサインと調和しています。良い流れに乗る日。' :
                  '今日のエネルギーを受け入れ、' + todaySign.ko + 'の教えに注意を向けてみてください。'}
            </div>
        </div>
    `;

    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
}

initForm();
document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>
