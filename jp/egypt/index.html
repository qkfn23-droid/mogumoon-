      career: '農業、食品業、健康産業、フィットネストレーナー、生命工学、園芸など成長と豊穣に関連する分野で成功します。ミンがレタス畑の神であったように、小さな種から大きな収穫を生み出す才能があります。着実な努力で豊かな財を収穫します。',
      health: '生殖器とホルモンバランスに注意が必要です。旺盛なエネルギーを適切に分配しないと消耗することがあります。自然の中での活動と新鮮な食品の摂取が健康の核心です。', lucky: { color: '緑、金色', stone: 'エメラルド', number: '2, 9', animal: '雄牛' }, compat: [0,6,12,18,24,30] },
    { name: 'モンチュの戦争', deity: 'モンチュ (Montu)', glyph: '⚔️', element: '火', dates: '9/11~9/20', startM:9, startD:11, endM:9, endD:20,
      personality: '戦争の神モンチュの強烈な戦士エネルギーを持っています。テーベの守護神としてファラオたちが戦場で呼んだ戦争の神らしく、勇気と戦闘本能が極度に強いです。挑戦を楽しみ競争の中で輝く生まれながらの戦士です。モンチュが雄牛の姿を取ったように、一度突進すると止まらない不屈の意志があります。恐れを知らず、危機的状況でむしろ強くなります。',
      love: '征服するように愛し、挑戦的な相手に惹かれます。簡単に手に入る愛には興味を感じず、自分と対等に戦える強いパートナーを求めます。愛でも戦士らしく直進し、心を決めたら勢いよく突き進みます。保護本能が強く愛する人のためにはどんな敵とも立ち向かいます。',
      career: '軍人、プロスポーツ選手、武術家、競争の激しいビジネス分野で頭角を現します。モンチュの戦車のように素早く目標に向かって突進する分野が適しています。競争に勝って得る報酬で大きな財を集めます。',
      health: '頭痛と外傷性の怪我に注意が必要です。戦闘的気質で無理しやすいので適切な回復時間が必須です。格闘技や高強度トレーニングでエネルギーを健全に放出してください。', lucky: { color: '赤、黒', stone: 'ルビー', number: '1, 9', animal: '雄牛' }, compat: [1,7,11,19,25,31] },
    { name: 'ワジェトの毒', deity: 'ワジェト (Wadjet)', glyph: '🐍', element: '水', dates: '9/21~9/30', startM:9, startD:21, endM:9, endD:30,
      personality: 'コブラ女神ワジェトの致命的で神秘的なエネルギーを持っています。ファラオの額に飾られたウラエウス（コブラ王冠）の女神らしく、王室級の保護本能が強いです。危険を直感する驚くべき能力があり、静かに忍耐しながら正確な瞬間に致命的に行動します。下エジプトの守護女神として、愛する人と領土を守ることに一切の妥協がありません。外見は落ち着いていますが内面にはコブラの毒のように強烈な情熱が隠されています。',
      love: '保護的で直感的な愛をします。パートナーに迫る危険を事前に感知し遮断する守護者の役割をします。ワジェトが幼いホルスを守ったように、愛する人を全力で守ります。裏切りに対してはコブラの毒のように致命的に反応するため、信頼を破らないことが重要です。',
      career: 'セキュリティ専門家、医師、薬学者、毒性学者、宝石鑑定士、外交官など鋭い判断力が必要な分野で成功します。ワジェトの目のように危険と機会を同時に感知する能力で投資でも成果を上げます。秘密情報を扱う職業で特に輝きます。',
      health: '毒素の蓄積とアレルギー反応に注意が必要です。デトックス食事と浄化療法が健康維持に重要です。ワジェトのエネルギーを浄化するために温かいお湯での入浴が役立ちます。', lucky: { color: '緑、金色', stone: 'サーペンティン', number: '5, 8', animal: 'コブラ' }, compat: [3,9,15,21,27,33] },
    { name: 'シューの風', deity: 'シュー (Shu)', glyph: '💨', element: '風', dates: '10/1~10/10', startM:10, startD:1, endM:10, endD:10,
      personality: '風と大気の神シューの自由でダイナミックなエネルギーを持っています。空（ヌト）と大地（ゲブ）を分離して生命が存在する空間を作った神らしく、混沌の中から秩序を生み出す仲裁者の能力が卓越しています。自由で独立的であり、いかなる束縛も耐えがたいです。風のようにどこへでも行け、どこにも縛られない魂です。シューが光と空気を象徴するように、明確な思考と透明なコミュニケーション能力があります。',
      love: '自由な愛を追求しパートナーの空間と独立を尊重する関係を望みます。シューがヌトとゲブの間に立ったように、適切な距離を維持しながらも関係を支える役割をします。束縛する愛には風のように逃げますが、自由を与えるパートナーには限りなく戻ってきます。コミュニケーションがうまくいく関係で幸福を感じます。',
      career: '航空関連職業、環境運動家、仲裁者、カウンセラー、風力エネルギー、コミュニケーション専門家などコミュニケーションと空間に関連する分野で輝きます。シューが空と大地の間を支えたように、対立する両者を仲裁する役割で大きな価値を発揮します。自由な魂らしくフリーランスで財を集めます。',
      health: '肺と呼吸器の健康が最も重要です。新鮮な空気の中での呼吸運動と有酸素運動が必須です。密閉された空間に長時間いるとエネルギーが急激に落ちるので換気と屋外活動を頻繁に行ってください。', lucky: { color: '水色、白', stone: 'アクアマリン', number: '3, 7', animal: 'ライオン' }, compat: [2,5,11,17,23,29] },
    { name: 'テフヌトの雨', deity: 'テフヌト (Tefnut)', glyph: '🌧️', element: '水', dates: '10/11~10/20', startM:10, startD:11, endM:10, endD:20,
      personality: '湿気と雨の女神テフヌトの感情的で浄化するエネルギーを持っています。神話でエジプトを離れてから戻り大地に生命をもたらした女神のように、消えてから戻る循環のエネルギーが人生全体を貫きます。感情が深く変化に富み、雨のように一瞬で降り注ぐ感情の爆発があります。テフヌトがライオンの姿を取ったように、柔らかい雨の裏には荒々しい野性が隠れています。浄化と再生の能力があり周囲の停滞したエネルギーを洗い流します。',
      love: '感情的で変化に富んだ愛をします。テフヌトがエジプトを離れてから戻ったように、関係でも離れてから戻るパターンが現れることがあります。感情の雨が降り注げばすべてを潤す強烈な愛です。テフヌトが戻った時にエジプト中が喜んだように、この人の愛を受けると世界が祝福で満ちる感覚です。',
      career: '水資源管理、環境科学、心理療法、浄化産業、スパ、ウェルネス分野で成功します。テフヌトが大地に雨を降らせ生命をもたらしたように、停滞した状況に活力を吹き込む役割で輝きます。感情的エネルギーを生産的に活用すれば豊富な財が流れ込みます。',
      health: '涙腺と水分代謝に特別な注意が必要です。感情変動が激しいと身体にも影響するため感情管理が健康の核心です。温泉や水泳など水に関連する活動が最高の癒しです。', lucky: { color: '青、銀色', stone: 'ムーンストーン', number: '2, 11', animal: 'ライオン' }, compat: [0,6,10,18,24,30] },
    { name: 'アテンの円盤', deity: 'アテン (Aten)', glyph: '☀️', element: '火', dates: '10/21~10/31', startM:10, startD:21, endM:10, endD:31,
      personality: '太陽円盤アテンの純粋で革命的な光のエネルギーを持っています。ファラオ・アクナテンがすべての神を捨てアテンのみを崇拝したように、既存の慣習と伝統を大胆に打ち破る進歩的思考の持ち主です。唯一神思想の源となった神らしく、一つの真理への揺るぎない確信があります。時代を先行く革新家であり、他者が理解できなくても自分の道を歩みます。純粋な光のように偽りや偽善に耐えられません。',
      love: '純粋で革新的な愛をします。伝統的な関係の形式に縛られず、自分だけの愛の方法を作り上げていきます。アクナテンとネフェルティティの愛のように、パートナーと共に新しい世界を作り上げる関係を夢見ます。魂の真のつながりを追求し外見や条件に左右されません。',
      career: '革新企業家、科学研究者、技術開発者、宗教革新家、社会運動家など新しいパラダイムを作る分野で輝きます。アテンがエジプトの宗教を完全に変えたように、既存のシステムを革新する役割に天賦の才能があります。革新的なアイデアで大きな財を創出します。',
      health: '皮膚の健康とビタミンDの値に注意が必要です。太陽のエネルギーを直接受けることが重要ですが過度な紫外線は避けてください。瞑想と光治癒（光線療法）が精神的、肉体的健康に大きく役立ちます。', lucky: { color: '金色、白', stone: 'シトリン', number: '1, 10', animal: 'フンコロガシ' }, compat: [1,7,13,19,25,31] },
    { name: 'アンクの生命', deity: 'アンク (Ankh)', glyph: '☥', element: '風', dates: '11/1~11/10', startM:11, startD:1, endM:11, endD:10,
      personality: '永遠の生命の象徴アンクの神聖なエネルギーを持っています。古代エジプトで神々が手に持っていた生命の鍵らしく、生の喜びと永遠を同時に追求します。治癒と再生のエネルギーが極めて強く、死後も続くものの価値を理解しています。霊的な深さがありながらも現実の生命力を失わないバランスの取れた存在です。アンクが鍵の形をしているように、閉ざされた扉を開く解決者の役割をします。',
      love: '永遠の愛を追求し前世と来世をつなぐ縁を信じます。アンクがこの世とあの世をつなぐ鍵であるように、愛でも肉体的結合と霊的結合の両方を重視します。一度結ばれた縁は死をもって断ち切れないと信じ、それだけ深く真剣な愛をします。軽いまたは一時的な関係には関心がありません。',
      career: '医師、霊的ヒーラー、哲学者、宝石職人、生命工学研究者など生命と永遠に関連する分野で成功します。アンクがすべての神殿に刻まれたように、普遍的で根本的な価値を扱う職業で輝きます。人を救い癒す仕事で財とやりがいを同時に得ます。',
      health: '循環器系と免疫システムに特別な注意が必要です。アンクのエネルギーを維持するために生命力を充電する活動が重要です。自然の中の散歩と瞑想、そして他者を助けるボランティア活動が健康の核心です。', lucky: { color: '金色、ターコイズ', stone: 'ターコイズ', number: '7, 13', animal: '鷲' }, compat: [4,8,14,20,26,32] },
    { name: 'スフィンクスの謎', deity: 'スフィンクス (Sphinx)', glyph: '🦁', element: '土', dates: '11/11~11/20', startM:11, startD:11, endM:11, endD:20,
      personality: '謎のスフィンクスの神秘的で複合的なエネルギーを持っています。人間の知恵、ライオンの力、鷲の視野を同時に持つ存在で、真実を守る守護者です。「朝は四本足、昼は二本足、夕は三本足で歩くものは？」という謎のように、生の本質を見抜く洞察力があります。秘密を守る能力が卓越しており、簡単に本心を明かしません。ギザの大スフィンクスのように数千年を耐える忍耐と威厳を備えています。',
      love: '謎めいた愛をします。パートナーの真心を試し確認しようとする傾向があり、簡単に心を開きません。スフィンクスの謎を解いてこそ通過できるように、この人の愛を得るには真正さと知恵が必要です。しかし一旦謎を解けば、その先には想像以上の深い愛が待っています。',
      career: '教授、研究者、心理学者、セキュリティ専門家、暗号解読家、考古学者など秘密と知識を扱う分野で輝きます。スフィンクスが神殿の入口を守ったように、重要な情報と資源を守る役割で卓越した能力を発揮します。知的能力と洞察力で高い価値を認められ財を集めます。',
      health: '精神的ストレスと頭痛に特別な注意が必要です。常に警戒状態を維持しようとする習慣が緊張と疲労を引き起こします。謎を一旦下ろしてシンプルな楽しみを見つけることが健康の核心です。', lucky: { color: '砂色、金色', stone: 'タイガーアイ', number: '3, 11', animal: 'スフィンクス' }, compat: [2,5,11,17,23,29] },
    { name: 'ピラミッドの頂', deity: 'ベンベン (Benben)', glyph: '🔺', element: '火', dates: '11/21~11/30', startM:11, startD:21, endM:11, endD:30,
      personality: 'ピラミッドの頂石ベンベンの上昇と永遠のエネルギーを持っています。古代エジプトで最初の大地であり創造の出発点とされたベンベン石のように、頂点への絶え間ない野望と永遠に残る遺産を追求します。体系的で目標志向的であり、人生のピラミッドを一層一層積み上げていく建築家です。ピラミッドが数千年を耐えたように、一度建てたものは永遠に崩れない堅固さがあります。頂点に立つことが運命だと信じ、その信念が現実を作ります。',
      love: '共に頂点に向かって歩ける野望あるパートナーを求めます。ピラミッドの二面が頂点で出会うように、各自の道を歩みながらも結局一つの頂点で出会う関係を夢見ます。愛でも品格と威厳を重視し、自分とパートナーの両方を高い所へ導きます。永遠に残る愛の記念碑を建てようとします。',
      career: 'CEO、建築家、政治指導者、歴史学者、プロジェクトマネージャーなど頂点を目指すすべての分野で成功します。ベンベン石が太陽の最初の光を受けたように、新しい時代を開く最初の人になる役割に適しています。体系的な計画と実行力でピラミッドのように堅固な財を蓄積します。',
      health: '背中と脊椎の健康に特別な注意が必要です。常に高い所を目指す姿勢で腰に負担がかかることがあります。ピラミッドの均衡のように姿勢矯正とコアの筋力強化が健康の核心です。', lucky: { color: '金色、白', stone: 'ダイヤモンド', number: '1, 4', animal: 'タカ' }, compat: [1,7,13,19,25,31] },
    { name: 'スカラベの誕生', deity: 'ケペラ (Khepera)', glyph: '🌅', element: '土', dates: '12/1~12/10', startM:12, startD:1, endM:12, endD:10,
      personality: '明けの太陽を転がすスカラベのもう一つの形態ケペラの再誕生エネルギーを持っています。ケプリと同一の根源ですが年末に位置するデカンとして、一年の終わりに新しい始まりを見出す特別な能力があります。毎日自分自身を新しく作り替える再誕生のエネルギーが尽きることなく、失敗や終わりが怖くありません。スカラベが糞から生命を生み出すように、最も低い所から最も高い価値を創造します。循環と変化を自然の法則として受け入れる知恵があります。',
      love: '終わりなく新しくなる愛をします。毎日違う姿でパートナーを驚かせ、関係が決して退屈になりません。スカラベが毎日新しい太陽を転がすように、愛にも毎日新しいエネルギーを吹き込みます。関係の危機も再誕生の機会に変えるポジティブな愛の錬金術師です。',
      career: 'スタートアップ創業者、革新コンサルタント、リハビリ療法士、自己啓発コーチ、リサイクル産業など再誕生と革新に関連する分野で輝きます。ケペラが毎日太陽を新しくしたように、古いものを新しく作る能力で独創的な財を創出します。何度もの失敗を踏み台に大きな成功を収めるタイプです。',
      health: '消化器系と全般的なエネルギー管理に注意が必要です。絶え間ない変化と再誕生のエネルギーが体力を消耗させることがあるため十分な栄養摂取が重要です。朝の日の出を見ながら一日を始めることがケペラのエネルギーを最大に引き出す方法です。', lucky: { color: '金色、緑', stone: 'ペリドット', number: '1, 8', animal: 'スカラベ' }, compat: [3,9,15,21,27,33] },
    { name: 'ワセトの王笏', deity: 'ワセト (Waset)', glyph: '👑', element: '風', dates: '12/11~12/20', startM:12, startD:11, endM:12, endD:20,
      personality: 'テーベ（現ルクソール）の王笏ワセトの権威と統治エネルギーを持っています。エジプト新王国時代の首都でありアムン=ラーの都テーベの名を冠したこのデカンは、生まれながらにリーダーの気質を持っています。自然と周囲を統率し、伝統と秩序を重視する保守的でありながらも威厳のある性向です。ファラオが王笏（ワス笏）を持って統治したように、権威と責任感を同時に持った存在です。歴史と伝統に対する深い敬意があります。',
      love: '王と女王のような品格ある愛を追求します。関係でも威厳と尊敬を重視し、パートナーに王族にふさわしい待遇をします。テーベの神殿のように壮大で美しい愛を夢見、軽い恋愛よりは真剣で格式のある関係を好みます。一度選んだパートナーへの忠誠はファラオの誓いほど重いです。',
      career: '政治家、外交官、高位行政官、法律家、文化財管理、博物館長など権威と伝統が重要な分野で輝きます。ワセトがエジプトの宗教的首都であったように、文化と宗教関連分野でも大きな成功を収めることができます。権威と名声で自然に財が付いてきます。',

function getDecanIndex(month, day) {
    for (let i = 0; i < DECANS.length; i++) {
        const d = DECANS[i];
        const start = d.startM * 100 + d.startD;
        const end = d.endM * 100 + d.endD;
        const target = month * 100 + day;
        if (target >= start && target <= end) return i;
    }
    return 0;
}

function initForm() {
    const y = document.getElementById('birthYear');
    const m = document.getElementById('birthMonth');
    const d = document.getElementById('birthDay');
    for (let i = 2025; i >= 1940; i--) { const o = document.createElement('option'); o.value = i; o.textContent = i + '年'; if (i === 1995) o.selected = true; y.appendChild(o); }
    for (let i = 1; i <= 12; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i + '月'; if (i === 3) o.selected = true; m.appendChild(o); }
    for (let i = 1; i <= 31; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i + '日'; if (i === 15) o.selected = true; d.appendChild(o); }
}

function calculate() {
    const month = parseInt(document.getElementById('birthMonth').value);
    const day = parseInt(document.getElementById('birthDay').value);
    const idx = getDecanIndex(month, day);
    const decan = DECANS[idx];

    // Decan Card
    document.getElementById('decanCard').innerHTML = `
        <div class="decan-card">
            <span class="decan-glyph">${decan.glyph}</span>
            <div class="decan-name">${decan.name}</div>
            <div class="decan-deity">守護神: ${decan.deity}</div>
            <div class="decan-dates">${decan.dates}</div>
        </div>
    `;

    // Info Grid
    document.getElementById('infoGrid').innerHTML = `
        <div class="info-item">
            <div class="info-label">守護神</div>
            <div class="info-value">${decan.glyph} ${decan.deity}</div>
        </div>
        <div class="info-item">
            <div class="info-label">元素</div>
            <div class="info-value">${decan.element}</div>
        </div>
        <div class="info-item">
            <div class="info-label">デカン番号</div>
            <div class="info-value">${idx + 1} / 36</div>
        </div>
        <div class="info-item">
            <div class="info-label">期間</div>
            <div class="info-value">${decan.dates}</div>
        </div>
    `;

    // Personality
    document.getElementById('personalityWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">${decan.glyph} ${decan.name} — ${decan.deity}</div>
            <div class="interp-text">${decan.personality}</div>
        </div>
    `;

    // Love
    document.getElementById('loveWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">💕 ${decan.deity}の愛の方式</div>
            <div class="interp-text">${decan.love}</div>
        </div>
    `;

    // Career
    document.getElementById('careerWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">💼 職業＆財運</div>
            <div class="interp-text">${decan.career}</div>
        </div>
    `;

    // Health
    document.getElementById('healthWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">🏥 健康上の注意点</div>
            <div class="interp-text">${decan.health}</div>
        </div>
    `;

    // Compatibility
    let compatHtml = '<div class="interp-card"><div class="interp-title">💞 相性の良い守護神</div><div class="interp-text">';
    decan.compat.forEach(ci => {
        if (ci < DECANS.length) {
            const c = DECANS[ci];
            compatHtml += `${c.glyph} <strong>${c.name}</strong> (${c.deity}) — ${c.dates}<br>`;
        }
    });
    compatHtml += '</div></div>';
    document.getElementById('compatWrap').innerHTML = compatHtml;

    // Lucky
    document.getElementById('luckyWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-text">
                <strong>🎨 ラッキーカラー:</strong> ${decan.lucky.color}<br>
                <strong>💎 ラッキーストーン:</strong> ${decan.lucky.stone}<br>
                <strong>🔢 ラッキーナンバー:</strong> ${decan.lucky.number}<br>
                <strong>🐾 守護動物:</strong> ${decan.lucky.animal}
            </div>
        </div>
    `;

    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
}

initForm();
document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>
