                <div class="sb-value" style="color:#2ecc71;">${comm}%</div>
            </div>
            <div class="score-bar-item">
                <div class="sb-label">🔥 情熱</div>
                <div class="sb-bar"><div class="sb-fill" style="width:${passion}%;background:#f39c12;"></div></div>
                <div class="sb-value" style="color:#f39c12;">${passion}%</div>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💕 恋愛相性</div>
            <div class="reading-text">${detail.love}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">👫 友情</div>
            <div class="reading-text">${detail.friend}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💡 関係アドバイス</div>
            <div class="reading-text"><strong>${detail.tip}</strong></div>
        </div>

        <div class="reading-card">
            <div class="reading-title">📊 元素分析</div>
            <div class="reading-text">
                <strong>${s1.name}</strong>: ${ELEMENT_NAME[s1.element]}の星座 (${s1.date}) · 守護星: ${s1.ruler}<br>
                <strong>${s2.name}</strong>: ${ELEMENT_NAME[s2.element]}の星座 (${s2.date}) · 守護星: ${s2.ruler}<br><br>
                ${s1.element === s2.element ?
                    `同じ元素（${ELEMENT_NAME[s1.element]}）同士の出会い！本能的にお互いを理解できますが、共通の欠点が増幅されることもあります。` :
                    `${ELEMENT_NAME[s1.element]}と${ELEMENT_NAME[s2.element]}の出会い――異なる世界から来た二人が新しいバランスを作っていきます。`
                }
            </div>
        </div>

        <button class="retry-btn" onclick="document.getElementById('resultSection').style.display='none';window.scrollTo({top:0,behavior:'smooth'});">🔄 別の相性を見る</button>
    `;
    section.style.display = "block";
    section.scrollIntoView({behavior:"smooth"});
}

renderPickers();
</script>

</body>
</html>
