<script>
// ═══ 별자리 데이터 ═══
const SIGNS = [
    {name:'牡羊座',emoji:'♈',element:'fire',quality:'cardinal',ruler:'火星',dates:[[3,21],[4,19]]},
    {name:'牡牛座',emoji:'♉',element:'earth',quality:'fixed',ruler:'金星',dates:[[4,20],[5,20]]},
    {name:'双子座',emoji:'♊',element:'air',quality:'mutable',ruler:'水星',dates:[[5,21],[6,20]]},
    {name:'蟹座',emoji:'♋',element:'water',quality:'cardinal',ruler:'月',dates:[[6,21],[7,22]]},
    {name:'獅子座',emoji:'♌',element:'fire',quality:'fixed',ruler:'太陽',dates:[[7,23],[8,22]]},
    {name:'乙女座',emoji:'♍',element:'earth',quality:'mutable',ruler:'水星',dates:[[8,23],[9,22]]},
    {name:'天秤座',emoji:'♎',element:'air',quality:'cardinal',ruler:'金星',dates:[[9,23],[10,22]]},
    {name:'蠍座',emoji:'♏',element:'water',quality:'fixed',ruler:'冥王星',dates:[[10,23],[11,21]]},
    {name:'射手座',emoji:'♐',element:'fire',quality:'mutable',ruler:'木星',dates:[[11,22],[12,21]]},
    {name:'山羊座',emoji:'♑',element:'earth',quality:'cardinal',ruler:'土星',dates:[[12,22],[1,19]]},
    {name:'水瓶座',emoji:'♒',element:'air',quality:'fixed',ruler:'天王星',dates:[[1,20],[2,18]]},
    {name:'魚座',emoji:'♓',element:'water',quality:'mutable',ruler:'海王星',dates:[[2,19],[3,20]]}
];

const ELEMENT_NAME = {fire:'火🔥',earth:'土🌍',air:'風🌬️',water:'水🌊'};
const ELEMENT_CLASS = {fire:'el-fire',earth:'el-earth',air:'el-air',water:'el-water'};
const CHALDEAN = ['火星','太陽','金星','水星','月','土星','木星'];

// ═══ Sun 경도 계산 (이집트 デカン 페이지와 동일) ═══
function getSunLongitude(year, month, day) {
    const jd = 367*year - Math.floor(7*(year+Math.floor((month+9)/12))/4) + Math.floor(275*month/9) + day + 1721013.5;
    const T = (jd - 2451545.0) / 36525.0;
    const L0 = (280.46646 + 36000.76983*T + 0.0003032*T*T) % 360;
    const M = (357.52911 + 35999.05029*T - 0.0001537*T*T) % 360;
    const Mrad = M * Math.PI / 180;
    const C = (1.914602 - 0.004817*T)*Math.sin(Mrad) + (0.019993 - 0.000101*T)*Math.sin(2*Mrad) + 0.000289*Math.sin(3*Mrad);
    return (L0 + C + 360) % 360;
}

function getSignAndDecan(sunLon) {
    const signIdx = Math.floor(sunLon / 30) % 12;
    const デカンInSign = Math.floor((sunLon % 30) / 10) + 1;
    const デカンIdx = Math.floor(sunLon / 10) % 36;
    const ruler = CHALDEAN[デカンIdx % 7];
    return { signIdx, デカン: デカンInSign, デカンIdx, ruler, degree: sunLon };
}

// ═══ 元素相性 ═══
function elementCompat(e1, e2) {
    if (e1 === e2) return { score: 85, type: '同一元素', desc: '同じ元素 — 本能的に理解し合いますが、同じ弱点も増幅される可能性があります。' };
    const pair = [e1,e2].sort().join('-');
    const data = {
        'air-fire': { score: 82, type: '相生', desc: 'Fire + Air = flames grow higher! A fantastic combination of mutual inspirationとenergy.' },
        'earth-water': { score: 80, type: '相生', desc: '水が大地を潤すように柔らかく自然な調和。感情の深さと現実的な安定の出会い。' },
        'earth-fire': { score: 50, type: '緊張', desc: '情熱と安定の衝突。ペースを合わせることが鍵。' },
        'fire-water': { score: 45, type: '衝突', desc: '熱い火と冷たい水 — 激情的ですが衝突も頻繁。' },
        'air-water': { score: 48, type: '緊張', desc: '思考と感情の出会い。異なるコミュニケーションスタイルには努力が必要。' },
        'air-earth': { score: 50, type: '緊張', desc: '自由と安定の衝突。違いを好奇心で見てください。' },
    };
    return data[pair] || { score: 60, type: '中立', desc: '異なる魅力で惹かれ合う関係です。' };
}

// ═══ 각도(애스펙트) 분석 ═══
function aspectAnalysis(sign1, sign2) {
    const diff = Math.abs(sign1 - sign2);
    const angle = Math.min(diff, 12 - diff);
    const aspects = {
        0: { name: '合(0°)', score: 8, desc: '同じ星座 — 深い理解と共感。鏡のような関係。' },
        1: { name: '半合(30°)', score: -3, desc: '隣り合う星座 — 微妙な緊張。似ているようで異なるエネルギー。' },
        2: { name: 'セクスタイル(60°)', score: 10, desc: '相生 angle — naturally compatibleとmutually supportive.' },
        3: { name: 'スクエア(90°)', score: -8, desc: '挑戦的 — 摩擦がありますが成長の原動力になります。' },
        4: { name: 'トライン(120°)', score: 12, desc: 'Most harmonious angle — flows naturally like water.' },
        5: { name: 'インコンジャンクト(150°)', score: -5, desc: 'Difficult to understand — unfamiliar worlds but much to learn.' },
        6: { name: 'オポジション(180°)', score: 3, desc: '正反対 — 強い引力と衝突が共存。補完的だが緊張感。' },
    };
    return aspects[angle] || { name: '中立', score: 0, desc: '' };
}

// ═══ デカン 궁합 ═══
function デカンCompat(d1, d2) {
    if (d1.ruler === d2.ruler) return { score: 10, desc: '同じ惑星支配！ <strong>' + d1.ruler + '</strong>のエネルギーを共有 — 深い共感。' };
    // 相生 행성 조합
    const good = [['金星','月'],['木星','太陽'],['金星','木星']];
    for (const [a,b] of good) {
        if ((d1.ruler===a && d2.ruler===b) || (d1.ruler===b && d2.ruler===a))
            return { score: 6, desc: d1.ruler + 'と' + d2.ruler + ' — harmonious meeting. Energies complement each other gently.' };
    }
    const tense = [['火星','土星'],['火星','月'],['土星','金星']];
    for (const [a,b] of tense) {
        if ((d1.ruler===a && d2.ruler===b) || (d1.ruler===b && d2.ruler===a))
            return { score: -4, desc: d1.ruler + 'と' + d2.ruler + ' — tense relationship. Friction exists but overcoming it creates strong bonds.' };
    }
    return { score: 2, desc: d1.ruler + 'と' + d2.ruler + ' — 特別な衝突なく穏やかなエネルギー交流。' };
}

// ═══ 종합 ═══
function checkCompat() {
    const y1=parseInt(document.getElementById('y1').value), m1=parseInt(document.getElementById('m1').value), d1=parseInt(document.getElementById('d1').value);
    const y2=parseInt(document.getElementById('y2').value), m2=parseInt(document.getElementById('m2').value), d2=parseInt(document.getElementById('d2').value);
    if (!y1||!m1||!d1||!y2||!m2||!d2) return alert('二人の生年月日を選択してください！');

    const name1 = document.getElementById('name1').value.trim() || '私';
    const name2 = document.getElementById('name2').value.trim() || '相手';

    const sun1 = getSunLongitude(y1, m1, d1);
    const sun2 = getSunLongitude(y2, m2, d2);
    const info1 = getSignAndDecan(sun1);
    const info2 = getSignAndDecan(sun2);
    const s1 = SIGNS[info1.signIdx], s2 = SIGNS[info2.signIdx];

    const elResult = elementCompat(s1.element, s2.element);
    const aspResult = aspectAnalysis(info1.signIdx, info2.signIdx);
    const decResult = デカンCompat(info1, info2);

    const totalScore = Math.min(99, Math.max(15, elResult.score + aspResult.score + decResult.score));
    const scoreText = totalScore >= 85 ? '運命の相性！' : totalScore >= 75 ? '素晴らしい相性！' : totalScore >= 65 ? 'とても良い相性' : totalScore >= 55 ? '良い相性' : totalScore >= 45 ? '普通の相性' : '挑戦的な相性';

    const section = document.getElementById('resultSection');
    section.innerHTML = `
        <div class="compat-header">
            <div class="compat-signs">${s1.emoji} 💕 ${s2.emoji}</div>
            <div class="compat-names">${name1} & ${name2}</div>
        </div>

        <div class="score-display">
            <div class="score-circle">
                <div class="score-num">${totalScore}%</div>
                <div class="score-label">${scoreText}</div>
            </div>
        </div>

        <h3 class="section-title">⭐ 二人の星座</h3>
        <div class="reading-card">
            <div class="reading-text">
                <strong>${name1}</strong> (${y1}.${m1}.${d1})<br>
                ${s1.emoji} <strong>${s1.name}</strong> ${info1.デカン}デカン <span class="element-badge ${ELEMENT_CLASS[s1.element]}">${ELEMENT_NAME[s1.element]}</span><br>
                デカン支配星: <strong>${info1.ruler}</strong> · 守護星: ${s1.ruler}<br><br>
                <strong>${name2}</strong> (${y2}.${m2}.${d2})<br>
                ${s2.emoji} <strong>${s2.name}</strong> ${info2.デカン}デカン <span class="element-badge ${ELEMENT_CLASS[s2.element]}">${ELEMENT_NAME[s2.element]}</span><br>
                デカン支配星: <strong>${info2.ruler}</strong> · 守護星: ${s2.ruler}
            </div>
        </div>

        <h3 class="section-title">🔥 元素相性</h3>
        <div class="reading-card">
            <div class="reading-title">${ELEMENT_NAME[s1.element]} × ${ELEMENT_NAME[s2.element]} = <span class="tag-${elResult.score >= 70 ? 'good' : elResult.score >= 50 ? 'neutral' : 'bad'}">${elResult.type}</span></div>
            <div class="reading-text">${elResult.desc}</div>
        </div>

        <h3 class="section-title">📐 アスペクト相性</h3>
        <div class="reading-card">
            <div class="reading-title">${s1.name} ↔ ${s2.name} = <span class="tag-${aspResult.score >= 5 ? 'good' : aspResult.score >= 0 ? 'neutral' : 'bad'}">${aspResult.name}</span></div>
            <div class="reading-text">${aspResult.desc}</div>
        </div>

        <h3 class="section-title">𓂀 デカン相性</h3>
        <div class="reading-card">
            <div class="reading-title">${s1.name} ${info1.デカン}デカン(${info1.ruler}) × ${s2.name} ${info2.デカン}デカン(${info2.ruler})</div>
            <div class="reading-text">${decResult.desc}<br><br>
            <a href="../egypt/" style="color:#e84393;font-size:12px;">→ デカン詳細解釈を見る</a></div>
        </div>

        <h3 class="section-title">📋 総合</h3>

                元素: <strong>${elResult.score}点</strong> · アスペクト: <strong>${aspResult.score >= 0 ? '+' : ''}${aspResult.score}点</strong> · デカン: <strong>${decResult.score >= 0 ? '+' : ''}${decResult.score}点</strong><br><br>
                ${totalScore >= 65
                    ? '全体的に<strong>調和のとれた関係</strong>です。自然に合う部分が多いです。'

                    ? '適度な<strong>緊張と調和</strong>が共存。違いが成長の原動力になります。'
                    : 'A <strong>challenging relationship</strong>, but great opportunity for growth. Respect differences.'

        <button class="retry-btn" onclick="document.getElementById('resultSection').style.display='none';window.scrollTo({top:0,behavior:'smooth'});">🔄 別の相性を見る</button>
    `;
    section.style.display = 'block';
    section.scrollIntoView({behavior:'smooth'});
}

// select 초기화
(function() {
    const now = new Date();
    ['1','2'].forEach(n => {
        const yEl = document.getElementById('y'+n);
        const mEl = document.getElementById('m'+n);
        const dEl = document.getElementById('d'+n);
        yEl.innerHTML = '<option value="">年</option>';
        for (let y = now.getFullYear(); y >= 1920; y--) yEl.innerHTML += `<option value="${y}年">${y}年</option>`;
        mEl.innerHTML = '<option value="">月</option>';
        for (let m = 1; m <= 12; m++) mEl.innerHTML += `<option value="${m}月">${m}月</option>`;
        function updateDays() {
            const y = parseInt(yEl.value) || 2000;
            const m = parseInt(mEl.value) || 1;
            const maxD = new Date(y, m, 0).getDate();
            const cur = parseInt(dEl.value);
            dEl.innerHTML = '<option value="">日</option>';
            for (let d = 1; d <= maxD; d++) dEl.innerHTML += `<option value="${d}日"${d===cur?' selected':''}>${d}日</option>`;
        }
        yEl.onchange = updateDays;
        mEl.onchange = updateDays;
        updateDays();
    });
})();
</script>
