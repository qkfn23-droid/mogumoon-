{k:"ウサギ",emoji:"🐇",cat:"동물",tags:["ウサギ","白ウサギ","ウサギの夢"],
text:"ウサギは<strong>多産、幸運、敏捷さ、月のエネルギー</strong>を象徴します。<br><br><strong>ウサギを見る夢</strong> — 幸運が近づいています。特に恋愛運と豊穣の気運が強いです。<br><strong>白いウサギの夢</strong> — 純粋な幸運と霊的導き。新しい世界への入口を発見するかもしれません。<br><strong>ウサギが子を産む夢</strong> — 豊穣！良いことが続々と起こります。"},
{k:"鶏",emoji:"🐓",cat:"동물",tags:["鶏","雄鶏","ヒヨコ","鶏の夢","卵"],
text:"鶏は<strong>夜明けを告げる存在、勤勉さ、時間意識</strong>を象徴します。<br><br><strong>雄鶏が鳴く夢</strong> — 新しい始まりの知らせ！待っていた機会がついに来ます。<br><strong>卵を見つける夢</strong> — 可能性と潜在力の象徴。慎重に育てれば大きなものが生まれます。金運の信号でもあります。<br><strong>金の卵の夢</strong> — 大当たり！予期しない大きな収入が入ってきます。"},
{k:"カエル",emoji:"🐸",cat:"동물",tags:["カエル","ガマガエル","オタマジャクシ","カエルの夢"],
text:"カエルは<strong>変身、浄化、豊穣、雨の祝福</strong>を象徴します。<br><br><strong>カエルを見る夢</strong> — 変化と成長の時期。完全な変身を遂げる時です。<br><strong>ガマガエルの夢</strong> — 伝統的に財物の象徴！お金が入ってきたり事業が繁盛します。<br><strong>オタマジャクシの夢</strong> — まだ成長中。忍耐を持ちましょう。時が来れば完全に変身します。"},
{k:"鹿",emoji:"🦌",cat:"동물",tags:["鹿","鹿の夢","牡鹿","鹿の角"],
text:"鹿は森の貴族として<strong>高貴さ、霊的導き、柔らかな力、幸運</strong>を象徴します。<br><br><strong>鹿を見る夢</strong> — 霊的な導き手が現れたり、高貴な縁に出会います。<br><strong>牡鹿の夢</strong> — 権威とリーダーシップ。尊敬される立場に就きます。<br><strong>鹿が逃げる夢</strong> — 純粋な機会が過ぎ去ろうとしています。優しくアプローチしてください。"},
{k:"虫",emoji:"🐛",cat:"동물",tags:["虫","虫の夢","毛虫","ゴキブリ","ミミズ","ウジ虫"],
text:"虫は<strong>変化の前兆、些細な問題、浄化、そして忍耐</strong>を象徴します。<br><br><strong>虫が体を這う夢</strong> — 些細だが気になる問題があります。一つずつ整理しましょう。<br><strong>毛虫の夢</strong> — 変身前の準備段階。今は見た目が悪くてもすぐ蝶になります。<br><strong>ウジ虫の夢</strong> — 気持ち悪いですが金運の夢！逆境から機会が生まれます。"},
{k:"鷲",emoji:"🦅",cat:"동물",tags:["鷲","タカ","鷲の夢","猛禽類"],
text:"空の王者である鷲は<strong>最高の視野、権力、自由、霊的覚醒、そして勝利</strong>を象徴します。<br><br><strong>鷲が空を飛ぶ夢</strong> — 視野が広がり大局を見られるようになります。リーダーシップが輝く時期。<br><strong>鷲が獲物を捕らえる夢</strong> — チャンスを正確に捉えて成功します！決定的な瞬間に素早く行動を。<br><strong>鷲が肩に止まる夢</strong> — 強力な保護者や後援者があなたの味方になります。"},
// === 自然 ===
{k:"水",emoji:"💧",cat:"자연",tags:["水","川","湖","泳ぐ","洪水","水の夢","きれいな水","濁った水","溺れる夢"],
text:"水は心理学者ユングが「無意識の最も普遍的な象徴」と呼んだもので、<strong>感情、無意識、生命力、浄化、そして変化</strong>を象徴します。<br><br><strong>きれいな水の夢</strong> — 心が澄んで平和な状態。感情的に健康で、良いことが起こります。<br><strong>濁った水の夢</strong> — 感情的な混乱や不安。内面を浄化する時間が必要です。<br><strong>洪水の夢</strong> — 抑えていた感情が一気に爆発しようとしています。または人生に大きな変化の波が押し寄せています。<br><strong>水に溺れる夢</strong> — 感情に圧倒されています。周囲に助けを求めてください。<br><strong>水の上を歩く夢</strong> — 感情を超越しています！困難な状況でも揺るがない内なる力があります。"},
{k:"火",emoji:"🔥",cat:"자연",tags:["火","火事","火の夢","放火","ろうそく","山火事"],
text:"火は<strong>情熱、変革、破壊と再生、怒り、そしてインスピレーション</strong>を象徴します。東洋では火の夢は驚くほど代表的な吉夢です。<br><br><strong>家が燃える夢</strong> — 逆説的に非常に良い吉夢！伝統的に火事の夢は財物が大きく入ってくることを意味します。炎が大きく明るいほど財物の規模も大きい。<br><strong>火を消す夢</strong> — 危機をうまく乗り越えることができます。<br><strong>ろうそくの夢</strong> — 希望、霊的導き、温かい慰め。<br><strong>山火事の夢</strong> — コントロールできない大きな変化が押し寄せています。しかし山火事の後にはより肥沃な大地になります。"},
{k:"山",emoji:"⛰️",cat:"자연",tags:["山","登山","山頂","崖","山の夢"],
text:"山は<strong>神聖な領域、目標、挑戦、克服、そして人生の高み</strong>を象徴します。<br><br><strong>山を力強く登る夢</strong> — 目標に向かって着実に前進しています。辛くても止まらないでください。頂上が近づいています。<br><strong>山頂に立つ夢</strong> — 人生の頂点！長い努力が実を結び、達成感に満ちています。成功、合格、昇進の非常に強い吉夢。<br><strong>山が崩れる夢</strong> — 堅固だと信じていたものが揺らぎます。<br><strong>美しい山の風景を見る夢</strong> — 心の平和と霊的成長。人生の大きな絵が見える時期です。"},
{k:"花",emoji:"🌸",cat:"자연",tags:["花","バラ","桜","花畑","花束","ヒマワリ","蓮","花の夢"],
text:"花は<strong>愛、美しさ、成長、結実、そして人生の季節</strong>を象徴します。<br><br><strong>花が満開になる夢</strong> — 長く待った努力の結実！愛が花開いたり、物事が成就します。<br><strong>花をもらう夢</strong> — 誰かの愛や感謝を受けます。告白、祝い事、良い提案があるかも。<br><strong>蓮の夢</strong> — 泥の中から咲く蓮のように、困難な環境でも美しい結果を生み出します。霊的成長の夢。<br><strong>花が枯れる夢</strong> — 関係や状況の終わりを示します。季節が変われば新しい花が咲きます。"},
{k:"雨",emoji:"🌧️",cat:"자연",tags:["雨","豪雨","にわか雨","雨の夢","傘","雷","稲妻"],
text:"雨は<strong>浄化、感情の解放、悲しみの後の癒し、豊穣、そして新しい始まり</strong>を象徴します。<br><br><strong>雨に打たれて歩く夢</strong> — 感情が浄化されています。溜まっていたストレスと悲しみが雨と共に洗い流されます。<br><strong>豪雨の夢</strong> — 感情の激変期。しかしこの雨が止めば驚くほど晴れた空が広がります。<br><strong>雨が止んで晴れる夢</strong> — 辛い時期が終わり希望が訪れます。<br><strong>傘をさす夢</strong> — 守られているか、困難な状況にしっかり備えています。"},
{k:"雪",emoji:"❄️",cat:"자연",tags:["雪","雪の夢","雪景色","雪だるま","吹雪","雪原"],
text:"雪は<strong>純粋さ、静寂、新しい始まり、浄化、そして感情の凍結</strong>を象徴します。<br><br><strong>白い雪が降る夢</strong> — 新しくきれいな始まりが近づいています。過去の痕跡が雪に覆われるように、再出発の機会が来ます。<br><strong>雪原を歩く夢</strong> — 孤独だが純粋な時間。自分自身を深く振り返ってください。<br><strong>雪が溶ける夢</strong> — 凍っていた感情がほぐれています。冷却した関係が回復したり、行き詰まっていたことが解決します。"},
{k:"海",emoji:"🌊",cat:"자연",tags:["海","波","浜辺","海辺","津波","海の夢","泳ぐ"],
text:"果てしなく広がる海は<strong>無意識の深み、感情の大海、無限の可能性、そして生命の源</strong>を象徴します。<br><br><strong>穏やかで美しい海の夢</strong> — 内面が深く平和です。安定した時期を過ごしています。<br><strong>荒波の夢</strong> — 感情の嵐が近づいています。しかし波は必ず静まります。<br><strong>海で泳ぐ夢</strong> — 感情をうまくコントロールしています。自由な状態。<br><strong>津波の夢</strong> — 抑えてきた巨大な感情が一気に押し寄せます。避けられないので受け入れて高いところへ。"},
{k:"空",emoji:"🌤️",cat:"자연",tags:["空","雲","虹","空の夢","星","月","太陽"],
text:"空は<strong>霊的世界、無限の可能性、希望、自由、そして神聖さ</strong>を象徴します。<br><br><strong>澄んだ青空の夢</strong> — 人生の障害が消え、前途が明るく開けています。<br><strong>虹の夢</strong> — 最高の吉夢の一つ！願いが叶い、暗闇の後に輝かしい報いが待っています。<br><strong>空を飛ぶ夢</strong> — 自由を渇望しているか、すでに限界を超越しています。<br><strong>日の出の夢</strong> — 新しい始まり！闇が過ぎ去り光がやってきます。"},
{k:"木",emoji:"🌳",cat:"자연",tags:["木","森","大木","古木","木の夢","松"],
text:"根の深い木は<strong>成長、安定、家族、生命力、そして人生の根</strong>を象徴します。<br><br><strong>大きく茂った木の夢</strong> — 安定した基盤の上で成長しています。健康、財、人間関係すべてが豊かな時期。<br><strong>木に花が咲く夢</strong> — 長く準備してきたことが実を結びます。<br><strong>木に実がなる夢</strong> — 金運上昇！努力の対価が戻ってきます。<br><strong>枯れ木の夢</strong> — エネルギーが枯渇しているか、古いものが終わろうとしています。"},
{k:"地震",emoji:"🌋",cat:"자연",tags:["地震","地震の夢","地面が揺れる夢","火山"],
text:"地震は<strong>人生の基盤が揺らぐこと、急激な変化、不安定、そして隠された力の爆発</strong>を象徴します。<br><br><strong>強い地震の夢</strong> — 生活の安定した基盤（仕事、関係、健康）が大きく揺らぐ可能性。しかし地震の後にはより堅固な地盤ができます。<br><strong>地震から生き延びる夢</strong> — 大きな危機を克服します！どんな困難が来ても耐えられる内なる力があります。<br><strong>火山が噴火する夢</strong> — 長く抑えてきた感情が一気に噴き出します。健全に発散してください。"},
{k:"月",emoji:"🌙",cat:"자연",tags:["月","満月","三日月","月食","月の夢","月明かり"],
text:"月は<strong>直感、女性性、循環、無意識、感情、そして神秘</strong>を象徴します。<br><br><strong>満月の夢</strong> — 完成と豊穣！長く準備したものが実を結びます。<br><strong>三日月の夢</strong> — 新しい始まり。まだ小さいですが徐々に満ちていきます。<br><strong>月明かりに照らされる夢</strong> — 闇の中でも道を導かれています。直感を信じてください。"},
{k:"台風",emoji:"🌪️",cat:"자연",tags:["台風","嵐","竜巻","強風","台風の夢","風"],
text:"台風は<strong>破壊的変化、感情の激動、制御不能、そして浄化</strong>を象徴します。<br><br><strong>台風が近づく夢</strong> — 大きな変化の前兆。避けられない変化が押し寄せています。備えてください。<br><strong>台風の目にいる夢</strong> — 混乱の真っただ中にいますが妙に平和な状態。嵐はあなたの周りを回っていますがあなたは安全です。<br><strong>台風が過ぎた後の夢</strong> — 混乱が終わり新しい風景が広がります。"},

{k:"亡くなった人",emoji:"👻",cat:"사람",tags:["亡くなった人","故人","先祖","祖母","祖父","亡くなった両親"],
text:"亡くなった方が夢に現れるのは<strong>霊的メッセージ、未解決の感情、保護、そして生と死を超えた絆</strong>を意味します。<br><br><strong>亡くなった方が明るく笑う夢</strong> — 最も良い信号。あの世で安らかにおられ、あなたの人生を祝福しています。<br><strong>亡くなった方が何かを話す夢</strong> — 非常に重要なメッセージ！目覚めた直後に内容を必ず覚えて記録してください。<br><strong>亡くなった方が食べ物をくれる夢</strong> — 注意が必要な夢。健康を気をつけてという信号かもしれません。<br><strong>亡くなった方を抱きしめる夢</strong> — 深い懐かしさの表現であり、慰めのメッセージです。"},
{k:"赤ちゃん",emoji:"👶",cat:"사람",tags:["赤ちゃん","赤ん坊","妊娠","出産","赤ちゃんの夢","胎夢","双子"],
text:"赤ちゃんは<strong>新しい始まり、無限の可能性、純粋さ、創造性</strong>を象徴します。<br><br><strong>可愛い赤ちゃんを抱く夢</strong> — 新しいプロジェクト、関係、アイデアが始まり成功的に進みます。<br><strong>赤ちゃんが微笑む夢</strong> — 純粋な喜びが訪れます。<br><strong>妊娠の夢</strong> — 必ずしも実際の妊娠を意味しません！アイデアや計画があなたの中で育っています。<br><strong>双子の赤ちゃんの夢</strong> — 喜びが二倍！良いことが続けて起こります。"},
{k:"恋人",emoji:"💑",cat:"사람",tags:["恋人","彼氏","彼女","愛","元カレ","元カノ","初恋","恋人の夢","キス"],
text:"恋人が夢に現れるのは<strong>愛への渇望、現在の関係の状態、自我のもう一つの面</strong>を反映します。<br><br><strong>現在の恋人と幸せな時間を過ごす夢</strong> — 関係が安定していて愛が深いことの確認。<br><strong>恋人と大喧嘩する夢</strong> — 言葉にできていない不満や葛藤があります。対話を通じて解決しましょう。<br><strong>元恋人の夢</strong> — 過去への未練というより、あの頃の感情パターンが現在にも繰り返されているという信号。<br><strong>恋人が浮気する夢</strong> — 実際の浮気ではなく、関係への不安感。自信不足や見捨てられる恐怖かもしれません。"},
{k:"両親",emoji:"👨‍👩‍👧",cat:"사람",tags:["両親","父","母","お母さん","お父さん","両親の夢"],
text:"両親は<strong>保護、権威、無条件の愛、良心、そしてアイデンティティの根</strong>を象徴します。<br><br><strong>両親が温かく微笑む夢</strong> — 家庭に平和と幸福が宿ります。人生が正しい方向に向かっているという確認。<br><strong>両親がひどく怒る夢</strong> — 内なる良心が警告しています。わかっていながら間違ったことをしていませんか？<br><strong>両親を失う夢</strong> — 独立への欲求か、保護者なしで自立することへの不安。成長の自然なプロセスです。<br><strong>両親が病気になる夢</strong> — ご両親への心配の表現。電話を一本かけてみてください。"},
{k:"友人",emoji:"👫",cat:"사람",tags:["友人","親友","幼馴染","友人の夢","同級生"],
text:"友人は<strong>自我の反映、社会的関係、支え</strong>を象徴します。<br><br><strong>友人と楽しく遊ぶ夢</strong> — 社会的欲求が満たされているか、より多くの交流を望んでいます。<br><strong>友人と喧嘩する夢</strong> — 自分の内面の葛藤を投影したものかもしれません。<br><strong>古い友人に会う夢</strong> — 過去の自分を振り返っています。あの頃の純粋さやエネルギーが懐かしいのです。"},
{k:"有名人",emoji:"🌟",cat:"사람",tags:["有名人","芸能人","アイドル","俳優","歌手","有名人の夢","セレブ"],
text:"有名人が夢に現れるのは<strong>憧れ、自己投影、隠された欲望、そして承認欲求</strong>を象徴します。<br><br><strong>好きな芸能人と一緒にいる夢</strong> — その人が持つ特性（才能、魅力、成功）を自分も持ちたいという気持ち。<br><strong>有名人と友達になる夢</strong> — 社会的認知を受けたい欲求。まもなく社会的地位が上がるかも。<br><strong>自分が有名になる夢</strong> — 認められ注目されたい強い欲求。才能を世に見せる準備ができています。"},
{k:"見知らぬ人",emoji:"🕴️",cat:"사람",tags:["見知らぬ人","知らない人","ストーカー","影","見知らぬ人の夢"],
text:"夢の中の見知らぬ人は<strong>自我の未知の面、新しい可能性、影の自我、そして無意識のメッセンジャー</strong>を象徴します。<br><br><strong>見知らぬ人が近づいてくる夢</strong> — 自分の新しい面を発見することになります。<br><strong>見知らぬ人に追われる夢</strong> — 自分の中の認めたくない面から逃げています。<br><strong>見知らぬ人が助けてくれる夢</strong> — 予期しないところから助けが来ます。開いた心で受け入れてください。"},
// === 身体 ===
{k:"歯",emoji:"🦷",cat:"신체",tags:["歯","歯の夢","歯が抜ける夢","歯がぐらぐらする夢","歯が折れる夢"],
text:"歯の夢は世界中で最も多く見られる夢の一つです。歯は<strong>自信、外見、健康、老化への恐怖、そして言葉と表現</strong>を象徴します。<br><br><strong>歯が抜ける夢</strong> — 最も一般的で強烈な夢！自信喪失、不安、またはコントロールを失うことへの恐怖。伝統的には近しい家族の健康を警告する夢とも。上の歯は目上の人、下の歯は目下の人に注意。<br><strong>歯がぐらぐらする夢</strong> — 現在の状況が不安定です。基盤を再び固めてください。<br><strong>歯が折れる夢</strong> — 面子が大きく傷つくか、自尊心が傷つく出来事が起こる可能性。<br><strong>新しい歯が生える夢</strong> — 驚くべき再生と新しい始まり！失った自信を取り戻します。"},
{k:"髪",emoji:"💇",cat:"신체",tags:["髪","髪の毛","抜け毛","髪を切る夢","長い髪","白髪"],
text:"髪は古代から<strong>エネルギー、生命力、魅力、思考方式、そしてアイデンティティ</strong>を象徴してきました。<br><br><strong>髪を切る夢</strong> — 過去との断絶を望んでいます。古い考え、習慣、関係を整理して再出発したい気持ち。<br><strong>髪が抜ける夢</strong> — エネルギー消耗、ストレス、または老化への恐怖。休んでください。<br><strong>髪が長く伸びる夢</strong> — 豊穣、健康、魅力が上昇。人生が豊かになる時期。<br><strong>白髪の夢</strong> — 知恵と経験の象徴。成熟しているという肯定的な信号です。"},
{k:"血",emoji:"🩸",cat:"신체",tags:["血","出血","血の夢","輸血","鼻血"],
text:"血は体内を流れる生命そのもので、<strong>生命力、情熱、エネルギー、家族の絆、そして犠牲</strong>を象徴します。<br><br><strong>血が流れる夢</strong> — エネルギーが失われています。感情的にも物理的にも消耗しているので充電が必要です。<br><strong>血をたくさん見る夢</strong> — 逆説的に東洋では金運の象徴！大きな変化と共に新しい機会が来ます。<br><strong>鼻血の夢</strong> — ストレスが限界に達しています。体も心もオーバーロード状態なので休みが必要です。"},
{k:"手",emoji:"🤲",cat:"신체",tags:["手","指","握手","手の夢","手をつなぐ夢"],
text:"手は<strong>能力、関係、表現、仕事、そしてつながり</strong>を象徴します。<br><br><strong>握手する夢</strong> — 新しい関係や契約が成立します。ビジネスに良い信号。<br><strong>手を怪我する夢</strong> — 仕事の能力や表現力に問題が生じる可能性。<br><strong>誰かの手を握る夢</strong> — その人との絆が深まるか、助け合うことになります。"},
// === 状況 ===
{k:"追われる夢",emoji:"🏃",cat:"상황",tags:["追われる","逃げる","追跡","追いかけられる夢"],
text:"追われる夢は世界中で最も一般的な夢のタイプの一つで、<strong>回避、直面できていない恐怖、抑圧されたストレス</strong>を表します。<br><br><strong>正体不明の存在に追われる夢</strong> — 現実で避けている問題があります。恐怖が漠然としているのは、その恐怖が曖昧だということ。具体的に何が怖いのか向き合ってみてください。<br><strong>動物に追われる夢</strong> — 自分の本能的感情（怒り、欲望、攻撃性）を抑えています。<br><strong>逃げ切れずに捕まる夢</strong> — もう逃げられない状況。しかし捕まった瞬間、意外と怖くないかもしれません。直面すれば恐怖は消えます。<br><strong>追われて立ち止まり振り返る夢</strong> — 最も良い結末！恐怖に立ち向かう勇気を示す夢です。"},
{k:"落ちる夢",emoji:"😱",cat:"상황",tags:["落ちる","墜落","落下","崖","落ちる夢","高いところ"],
text:"落ちる夢は<strong>不安、コントロール喪失、失敗への恐怖、そして支え基盤の崩壊</strong>を表します。<br><br><strong>高いビルから落ちる夢</strong> — 社会的地位や名声など「高い場所」から落ちることへの不安。<br><strong>果てしなく落ち続ける夢</strong> — 終わりの見えない不安。「底」がどこかわからない状態。しかし夢の中の底は大抵存在しません — 恐怖が実際より大きいということ。<br><strong>落ちて着地に成功する夢</strong> — 危機をうまく乗り越えます！怖いですが結果的に無事です。<br><strong>落ちてから飛び上がる夢</strong> — 最高の逆転！危機を機会に変えてさらに高く昇ります。"},
{k:"飛ぶ夢",emoji:"🦅",cat:"상황",tags:["飛ぶ","空を飛ぶ夢","飛行","翼"],
text:"空を飛ぶ夢は最も楽しい夢のタイプの一つで、<strong>自由、超越、解放、高い理想</strong>を象徴します。<br><br><strong>自由に空を飛ぶ夢</strong> — 現実の制約から脱した状態。精神的自由を満喫しているか、自由を切望しています。<br><strong>高く高く飛ぶ夢</strong> — 野望が大きく大きな夢を持っています。その高さに到達できる能力があなたにあります。<br><strong>飛んでいて墜落する夢</strong> — 理想は高いが現実の制約がある。夢と現実のバランスを取る必要があります。"},
{k:"試験",emoji:"📝",cat:"상황",tags:["試験","試験の夢","不合格","合格","面接","発表"],
text:"試験の夢は<strong>評価への不安、準備不足への恐怖、自己検証</strong>を表します。<br><br><strong>試験なのに何もわからない夢</strong> — 現実で準備が足りないと感じています。しかしほとんどの場合は過度な心配です。<br><strong>試験に遅刻する夢</strong> — 機会を逃すのではないかと焦っています。<br><strong>試験に合格する夢</strong> — 自信が上昇し、認められます。現実でも良い結果が来る可能性。"},
{k:"死",emoji:"💀",cat:"상황",tags:["死","死ぬ夢","死亡","葬式","死の夢","復活"],
text:"死の夢は怖いですがほとんどの場合<strong>変化、一つの時代の終結、再誕生、そして古いものの消滅</strong>を象徴します。実際の死とはほぼ無関係です。<br><br><strong>自分が死ぬ夢</strong> — 人生の一つの章が終わり、全く新しい始まりが来ます。逆説的に非常に良い夢！過去の自分が死んでこそ新しい自分が生まれます。<br><strong>死んでから生き返る夢</strong> — 復活！大きな危機を克服してより強くなって戻ります。<br><strong>葬式の夢</strong> — 過去を整理し弔う時間。手放すべきものを手放してください。"},
{k:"裸の夢",emoji:"😳",cat:"상황",tags:["裸","素っ裸","恥ずかしい夢","服を脱ぐ夢"],
text:"公共の場で裸になる夢は<strong>脆弱さ、恥、真の自我、隠したいものの露出</strong>を象徴します。<br><br><strong>人前で裸になる夢</strong> — 弱点や秘密が露わになることへの恐怖。しかし興味深いことに、夢の中のほとんどの人はあなたの裸を気にしていません。<br><strong>裸が恥ずかしくない夢</strong> — ありのままの自分を受け入れています。本当の自信の表現！"},
{k:"遅刻",emoji:"⏰",cat:"상황",tags:["遅刻","遅れる夢","飛行機に乗り遅れる","バスに乗り遅れる","約束"],
text:"遅刻する夢は<strong>時間への圧迫、機会喪失への不安、準備不足</strong>を表します。<br><br><strong>大事な約束に遅れる夢</strong> — 現実で時間に追われています。重要な機会を逃すのではないかと不安です。<br><strong>飛行機・電車に乗り遅れる夢</strong> — 人生の重要な転換点や機会を逃す可能性への警告。決断を先延ばしにしているなら今すぐ行動を。<br><strong>遅れたが結局到着する夢</strong> — 遅くても機会はあります。諦めないでください。"},
{k:"戦争",emoji:"⚔️",cat:"상황",tags:["戦争","戦い","戦闘","戦争の夢","軍隊","銃"],
text:"戦争は<strong>内的葛藤、対立、生存闘争、価値観の衝突</strong>を象徴します。<br><br><strong>戦場にいる夢</strong> — 現実で深刻な葛藤や競争の中にいます。<br><strong>戦争に勝つ夢</strong> — 葛藤を克服し勝利します！<br><strong>戦争が終わる夢</strong> — 長い葛藤が解消されます。平和が訪れます。"},
{k:"泳ぐ",emoji:"🏊",cat:"상황",tags:["泳ぐ","水泳","水泳の夢","潜水","水中"],
text:"泳ぐことは<strong>感情のコントロール、自己努力、生存、そして無意識の探検</strong>を象徴します。<br><br><strong>自由に泳ぐ夢</strong> — 感情をうまくコントロールしています。感情的成熟の表現。<br><strong>苦しく泳ぐ夢</strong> — 感情的困難と戦っています。疲れないで、もうすぐ浅瀬が見えます。<br><strong>潜水する夢</strong> — 無意識の奥深くに入っています。隠された感情や記憶を探索中。"},
{k:"引っ越し",emoji:"📦",cat:"상황",tags:["引っ越し","引っ越しの夢","荷造り","新居"],
text:"引っ越しは<strong>人生の変化、新しい始まり、環境転換</strong>を象徴します。<br><br><strong>新しい家に引っ越す夢</strong> — 人生の新しい段階！環境、関係、仕事に新鮮な変化が来ます。<br><strong>荷造りする夢</strong> — 過去を整理しています。持っていくものと捨てるものを区別する過程。<br><strong>引っ越したくない夢</strong> — 変化への抵抗。現状が快適で変えるのが怖いのです。"},

{k:"お金",emoji:"💰",cat:"사물",tags:["お金","紙幣","硬貨","お金を拾う夢","お金を失う夢","金持ち","金","宝石"],
text:"お金は<strong>価値、自尊心、エネルギー、能力、そして交換</strong>を表します。<br><br><strong>お金を拾う夢</strong> — 予期しない幸運！道端の硬貨はささやかな喜び、紙幣の束は大きな幸運を暗示。<br><strong>お金を失う夢</strong> — エネルギーや自信を失っています。大切なものを疎かにしているという警告。<br><strong>お金が降り注ぐ夢</strong> — 豊穣があふれます！金運が非常に良く、努力が大きく報われます。<br><strong>金・宝石を見つける夢</strong> — 隠された才能や価値を発見します。"},
{k:"車",emoji:"🚗",cat:"사물",tags:["車","自動車","運転","交通事故","車の夢","ブレーキ","駐車"],
text:"車は<strong>人生の方向、コントロール力、野望、社会的地位</strong>を象徴します。<br><br><strong>自分が運転する夢</strong> — 人生のハンドルを握っています。主体的に人生を導いている良い信号。<br><strong>交通事故の夢</strong> — 急激な変化や方向転換への警告。スピードを落としてください。<br><strong>新車を買う夢</strong> — 人生の新しい段階！新しいアイデンティティへ。<br><strong>ブレーキが効かない夢</strong> — 止められない状況への恐怖。人生がコントロール不能だと感じています。"},
{k:"家",emoji:"🏠",cat:"사물",tags:["家","引っ越し","新居","空き家","家の夢","昔の家","地下室","屋根裏"],
text:"家は<strong>あなた自身、内面の構造、心の状態、安定、そしてアイデンティティ</strong>を象徴します。<br><br><strong>新しい家に入る夢</strong> — 人生の新しい段階。自分自身への新しい理解が開けます。<br><strong>家が崩れる夢</strong> — 内面の安定が大きく揺らいでいます。<br><strong>昔の家の夢</strong> — 過去の記憶と感情を振り返っています。<br><strong>家に知らない部屋がある夢</strong> — 自分の中にまだ発見されていない面があります！隠された才能や可能性を探ってみてください。"},
{k:"鍵",emoji:"🔑",cat:"사물",tags:["鍵","錠前","ドア","鍵の夢","パスワード"],
text:"鍵は<strong>機会、答え、秘密、アクセス権</strong>を象徴します。<br><br><strong>鍵を見つける夢</strong> — 長年の問題の答えをついに発見します！<br><strong>鍵を失くす夢</strong> — 重要な機会を逃しているか、答えから遠ざかっています。<br><strong>ドアを開ける夢</strong> — 新しい世界が開きます！機会、関係、知識の扉が開かれています。"},
{k:"鏡",emoji:"🪞",cat:"사물",tags:["鏡","鏡の夢","割れた鏡","鏡を見る夢"],
text:"鏡は<strong>自己認識、真実、反省、自己対面</strong>を象徴します。<br><br><strong>鏡に映った自分を見る夢</strong> — 自分自身を客観的に見なさいというメッセージ。<br><strong>鏡に別の顔が映る夢</strong> — 隠された自我の発見。認めたくない面と向き合う必要があります。<br><strong>鏡が割れる夢</strong> — 自己像が崩れています。幻想が砕けるのは痛いかもしれませんが、割れた鏡の向こうに本当の自分がいます。"},
{k:"服",emoji:"👔",cat:"사물",tags:["服","服の夢","ドレス","制服","ユニフォーム","服を買う夢"],
text:"服は<strong>社会的ペルソナ、アイデンティティ、役割、保護</strong>を象徴します。<br><br><strong>新しい服を着る夢</strong> — 新しい役割やアイデンティティを得ます。変身と再出発！<br><strong>服が合わない夢</strong> — 現在の役割や状況が自分に合わないと感じています。<br><strong>汚れた服の夢</strong> — 過去の過ちや恥ずかしい記憶がつきまとっています。浄化が必要です。"},
{k:"結婚",emoji:"💒",cat:"기타",tags:["結婚","ウェディング","花嫁","花婿","結婚式","婚約","結婚の夢"],
text:"結婚の夢は<strong>結合、献身、新しい人生の段階、パートナーシップ</strong>を象徴します。<br><br><strong>自分が結婚する夢</strong> — 人生の新しい段階に入ります。必ずしも実際の結婚を意味しません。<br><strong>結婚が取り消される夢</strong> — 重要な決断への不安や疑い。本当に望んでいることなのか考え直してください。<br><strong>結婚式に参列する夢</strong> — 祝うべきことが起きるか、他人の成功からインスピレーションを受けます。"},
{k:"電話",emoji:"📱",cat:"기타",tags:["電話","携帯","電話の夢","メッセージ","通話","着信音"],
text:"電話は<strong>メッセージ、つながり、コミュニケーション、機会</strong>を象徴します。<br><br><strong>電話が鳴る夢</strong> — 重要な知らせや機会が来ます！<br><strong>電話がつながらない夢</strong> — コミュニケーションの断絶。孤立感を感じています。<br><strong>知らない番号からの電話の夢</strong> — 予期しないところから機会が来ます。"},
{k:"道",emoji:"🛤️",cat:"기타",tags:["道","道路","分かれ道","迷路","道の夢","路地","トンネル"],
text:"道は<strong>人生の方向、選択、旅路、運命の経路</strong>を象徴します。<br><br><strong>広く明るい道の夢</strong> — 前途が順調です！障害なく目標に向かえます。<br><strong>分かれ道に立つ夢</strong> — 人生の重要な選択の瞬間。直感を信じてください。<br><strong>迷路にはまる夢</strong> — 混乱と方向喪失。一歩引いて全体を見てください。<br><strong>トンネルを通る夢</strong> — 暗闇を通過中ですが、終わりには必ず光があります。"},
{k:"学校",emoji:"🏫",cat:"기타",tags:["学校","教室","先生","学校の夢","卒業","授業"],
text:"学校は<strong>学び、成長、過去の記憶、社会化</strong>を象徴します。<br><br><strong>学校に戻る夢</strong> — まだ学ぶべき人生の教訓が残っています。<br><strong>卒業する夢</strong> — 一つの段階を完了しました！おめでとうございます。次のレベルへ。<br><strong>学校で道に迷う夢</strong> — 人生で方向を見失っているか、居場所を見つけられていません。"},
{k:"食べ物",emoji:"🍽️",cat:"기타",tags:["食べ物","ご飯","食べる夢","料理","果物","肉","おいしい食べ物"],
text:"食べ物は<strong>エネルギー補充、感情的満足、栄養、愛</strong>を象徴します。<br><br><strong>おいしいものを食べる夢</strong> — 人生で満足のいく経験が近づいています。豊穣と感謝の時期。<br><strong>腐った食べ物の夢</strong> — 有害な関係や環境から離れる必要があります。<br><strong>料理する夢</strong> — 創造的エネルギーがあふれています！何か新しいものを作り出しています。<br><strong>果物の夢</strong> — 努力の結実！よく熟した果物は機が熟したということ。"},
{k:"星",emoji:"⭐",cat:"기타",tags:["星","流れ星","夜空","星の夢","流星","北極星"],
text:"星は<strong>希望、夢、霊的導き、運命、そして無限の可能性</strong>を象徴します。<br><br><strong>星空の夢</strong> — 可能性は無限！あなたの前に数多くの道と機会が広がっています。<br><strong>流れ星の夢</strong> — 願いが叶うかもしれません！切に願うことがあれば今がチャンスです。<br><strong>星を手に握る夢</strong> — 夢を現実にしました！大きな達成の象徴。"},
{k:"エレベーター",emoji:"🛗",cat:"기타",tags:["エレベーター","昇降機","上がる夢","エレベーターの夢"],
text:"エレベーターは<strong>人生の上昇と下降、感情の変化、社会的地位</strong>を象徴します。<br><br><strong>上がるエレベーターの夢</strong> — 成功と上昇！昇進、合格、成長に向かって進んでいます。<br><strong>エレベーターが故障する夢</strong> — 人生の進行が行き詰まっていると感じています。別の方法（階段）を探してください。<br><strong>エレベーターが急落する夢</strong> — コントロール喪失への極度の恐怖。深呼吸して落ち着いて対処しましょう。<br><strong>最上階に到着する夢</strong> — 目標達成！最も高いところに登りました。"},
{k:"トイレ",emoji:"🚻",cat:"기타",tags:["トイレ","便器","トイレの夢","大便","小便","うんちの夢"],
text:"トイレは<strong>浄化、解消、プライベート空間、感情の排出、そして財物</strong>を象徴します。東洋では大便の夢は代表的な金運の夢です。<br><br><strong>大便の夢</strong> — 伝統的に最高の金運の夢！汚くて多いほど大きなお金が入ってきます。逆説的ですが確かな吉夢。<br><strong>トイレが汚い夢</strong> — 整理すべき感情や状況が溜まっています。<br><strong>トイレが見つからない夢</strong> — 感情を発散できる場所がないと感じています。"},
{k:"階段",emoji:"🪜",cat:"기타",tags:["階段","はしご","階段の夢","上る夢","下りる夢"],
text:"階段は<strong>段階的成長、努力、段階的発展</strong>を象徴します。<br><br><strong>階段を上がる夢</strong> — 一段ずつ成長しています。速くはないが確実な発展。<br><strong>果てしない階段の夢</strong> — 目標が遠く感じられています。しかし毎段が前進です。<br><strong>螺旋階段の夢</strong> — 同じ問題が繰り返されるようですが、実は毎回より高いところから見ています。成長しています。"},
{k:"船",emoji:"🚢",cat:"사물",tags:["船","ボート","船の夢","航海","ヨット"],

{k:"飛行機",emoji:"✈️",cat:"사물",tags:["飛行機","飛行機の夢","飛行","空港","離陸","着陸"],

const POPULAR = ["蛇","歯","水","亡くなった人","追われる夢","落ちる夢","お金","火","赤ちゃん","龍","虎","豚","猫","海"];
const CATEGORIES = {
    "🐾 動物": "동물",
    "🌿 自然": "자연",
    "👤 人物": "사람",
    "🦷 身体": "신체",
    "🎭 状況": "상황",
    "📦 物・その他": ["사물","기타"]
};

// 인기 태그
document.getElementById('popularTags').innerHTML = POPULAR.map(p =>
    `<span class="tag" onclick="document.getElementById('searchInput').value='${p}';search();">${p}</span>`
).join('');

// 카테고리 브라우즈
let catHtml = '';
for (const [label, catVal] of Object.entries(CATEGORIES)) {
    const items = DREAMS.filter(d => Array.isArray(catVal) ? catVal.includes(d.cat) : d.cat === catVal);
    catHtml += `<div class="category-section">
        <div class="category-title">${label} (${items.length})</div>
        <div class="category-grid">
            ${items.map(d => `<div class="category-item" onclick="document.getElementById('searchInput').value='${d.k}';search();">
                <span class="ci-emoji">${d.emoji}</span>${d.k}
            </div>`).join('')}
        </div>
    </div>`;
}
document.getElementById('categoryBrowse').innerHTML = catHtml;

// 검색
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

function search() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) return;

    const results = DREAMS.filter(d =>
        d.k.toLowerCase().includes(q) ||
        d.tags.some(t => t.toLowerCase().includes(q))
    );

    const section = document.getElementById('resultSection');
    document.getElementById('browseSection').style.display = 'none';
    document.getElementById('shareBar').style.display = 'block';

    if (results.length === 0) {
        section.innerHTML = `
            <div class="no-result">
                <div class="emoji">🌙</div>
                <p>"<strong>${q}</strong>"の夢占いが見つかりませんでした。</p>
                <p style="margin-top:8px;font-size:13px;">別のキーワードで検索するか、下のカテゴリーで探してください</p>
            </div>
        `;
        document.getElementById('browseSection').style.display = 'block';
    } else {
        section.innerHTML = `
            <div class="result-count">"${q}" 検索結果 ${results.length}件</div>
            ${results.map(d => `
                <div class="dream-card">
                    <div class="dream-header">
                        <div class="dream-emoji">${d.emoji}</div>
                        <div>
                            <div class="dream-keyword">${d.k}</div>
                            <div class="dream-category">${d.cat}</div>
                        </div>
                    </div>
                    <div class="dream-text">${d.text}</div>
                    <div class="dream-tags">${d.tags.map(t => `<span class="dream-tag">${t}</span>`).join('')}</div>
                </div>
            `).join('')}
        `;
    }

    section.style.display = 'block';
    section.scrollIntoView({behavior: 'smooth'});
}
</script>
