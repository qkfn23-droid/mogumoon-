        weakness:"感情に圧倒される、現実感覚の欠如、重さ",
        message:"海は深いが水面にも上がらなければ息ができません。時には軽く浮かび上がってください。",
        good:"イルカ、カメ",bad:"ワシ、キツネ"},
    hawk:{name:"タカ",emoji:"🦅",title:"鋭利な狩人",element:"空・火",
        personality:"あなたのスピリットアニマルは<strong>タカ</strong>です。タカは集中力、機敏さ、そしてメッセンジャーを象徴します。あなたは一度目標を定めると離さないレーザーのような集中力があります。素早い判断力と行動力でチャンスを正確に捉えます。",
        strength:"集中力、機敏さ、判断力、メッセージ伝達、鋭さ",
        weakness:"性急さ、冷酷に見える可能性、忍耐の不足",
        message:"最も高く飛ぶ鳥が最も遠くを見ます。しかし時には巣に戻って休むことも必要です。",
        good:"フクロウ、キツネ",bad:"イルカ、シカ"}
};

let currentQ = 0;
const scores = {};

function startQuiz() {
    currentQ = 0;
    Object.keys(ANIMALS).forEach(k => scores[k] = 0);
    showQuestion();
}

function showQuestion() {
    if (currentQ >= QUESTIONS.length) { showResult(); return; }
    const q = QUESTIONS[currentQ];
    const pct = (currentQ / QUESTIONS.length) * 100;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressText").textContent = "質問 " + (currentQ + 1) + " / " + QUESTIONS.length;

    document.getElementById("questionCard").innerHTML =
        "<div class=\"question-num\">QUESTION " + (currentQ + 1) + "</div>" +
        "<div class=\"question-text\">" + q.q + "</div>" +
        "<div class=\"options\">" +
        q.o.map(function(opt, i) { return "<div class=\"option-btn\" onclick=\"answer(" + i + ")\">" + opt.t + "</div>"; }).join("") +
        "</div>";
}

function answer(idx) {
    QUESTIONS[currentQ].o[idx].c.forEach(function(c) { scores[c] = (scores[c] || 0) + 1; });
    currentQ++;
    showQuestion();
}

function showResult() {
    document.getElementById("quizSection").style.display = "none";
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("progressText").textContent = "完了！";
    document.getElementById("shareBar").style.display = "block";

    const sorted = Object.entries(scores).sort(function(a, b) { return b[1] - a[1]; });
    const topKey = sorted[0][0];
    const subKey = sorted[1] ? sorted[1][0] : topKey;
    const a = ANIMALS[topKey];
    const sub = ANIMALS[subKey];

    const section = document.getElementById("resultSection");
    section.innerHTML =
        "<div class=\"animal-display\">" +
            "<span class=\"animal-emoji\">" + a.emoji + "</span>" +
            "<div class=\"animal-name\">" + a.name + "</div>" +
            "<div class=\"animal-title\">" + a.title + "</div>" +
            "<div class=\"animal-element\">元素: " + a.element + "</div>" +
        "</div>" +

        "<div class=\"trait-grid\">" +
            "<div class=\"trait-item\">" +
                "<div class=\"trait-label\">メインの動物</div>" +
                "<div class=\"trait-value\">" + a.emoji + " " + a.name + "</div>" +
            "</div>" +
            "<div class=\"trait-item\">" +
                "<div class=\"trait-label\">サブの動物</div>" +
                "<div class=\"trait-value\">" + sub.emoji + " " + sub.name + "</div>" +
            "</div>" +
            "<div class=\"trait-item\">" +
                "<div class=\"trait-label\">元素</div>" +
                "<div class=\"trait-value\">" + a.element + "</div>" +
            "</div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">🐾 あなたのスピリットアニマル</div>" +
            "<div class=\"reading-text\">" + a.personality + "</div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">💪 強み</div>" +
            "<div class=\"reading-text\"><strong>" + a.strength + "</strong></div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">⚠️ 弱み</div>" +
            "<div class=\"reading-text\">" + a.weakness + "</div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">💌 スピリットアニマルのメッセージ</div>" +
            "<div class=\"reading-text\"><strong>「" + a.message + "」</strong></div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">🤝 動物の相性</div>" +
            "<div class=\"compat-row\">" +
                "<div class=\"compat-item compat-good\">相性のいい動物: " + a.good + "</div>" +
                "<div class=\"compat-item compat-bad\">注意する動物: " + a.bad + "</div>" +
            "</div>" +
        "</div>" +

        "<button class=\"retry-btn\" onclick=\"location.reload()\">🔄 もう一度診断する</button>";

    section.style.display = "block";
    section.scrollIntoView({behavior:"smooth"});
}

startQuiz();
</script>

</body>
</html>
