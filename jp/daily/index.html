    zodiacHTML += `<button class="zodiac-btn" onclick="showZodiac(${i})"><span class="emoji">${z.emoji}</span>${z.name}</button>`;
});
document.getElementById('zodiacGrid').innerHTML = zodiacHTML;

function showZodiac(idx) {
    const z = ZODIAC[idx];
    const zRand = seededRandom(dateSeed + idx * 7);

    const msgs = ZODIAC_MSGS[idx];
    const overall = Math.floor(zRand() * 40) + 60;
    const love = Math.floor(zRand() * 50) + 50;
    const work = Math.floor(zRand() * 50) + 50;
    const money = Math.floor(zRand() * 50) + 50;
    const health = Math.floor(zRand() * 30) + 70;

    document.querySelectorAll('.zodiac-btn').forEach(b => b.classList.remove('active'));
    event.target.closest('.zodiac-btn').classList.add('active');

    const zr = document.getElementById('zodiacReading');
    zr.innerHTML = `
        <div class="zr-title">${z.emoji} ${z.name}</div>
        <div class="zr-date">${z.date}</div>
        <div class="zr-text">
            <strong>💫 総合運：</strong> ${msgs[0]}<br><br>
            <strong>💕 恋愛運：</strong> ${msgs[1]}<br><br>
            <strong>💰 金運：</strong> ${msgs[2]}
        </div>
        <div class="zr-meters">
            <div class="zr-meter">総合運 ${overall}%<div class="bar"><div class="bar-fill" style="width:${overall}%"></div></div></div>
            <div class="zr-meter">恋愛運 ${love}%<div class="bar"><div class="bar-fill" style="width:${love}%;background:#e84393"></div></div></div>
            <div class="zr-meter">仕事運 ${work}%<div class="bar"><div class="bar-fill" style="width:${work}%;background:#3498db"></div></div></div>
            <div class="zr-meter">金運 ${money}%<div class="bar"><div class="bar-fill" style="width:${money}%;background:#27ae60"></div></div></div>
        </div>
    `;
    zr.style.display = 'block';
    zr.scrollIntoView({ behavior: 'smooth' });
}
</script>
