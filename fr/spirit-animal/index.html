let currentQ = 0;
const scores = {};

function startQuiz() {
    currentQ = 0;
    Object.keys(ANIMALS).forEach(k => scores[k] = 0);
    showQuestion();
}

function showQuestion() {
    if (currentQ >= QUESTIONS.length) { showResult(); return; }
    const q = QUESTIONS[currentQ];
    const pct = (currentQ / QUESTIONS.length) * 100;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressText").textContent = "Question " + (currentQ + 1) + " / " + QUESTIONS.length;

    document.getElementById("questionCard").innerHTML =
        "<div class=\"question-num\">QUESTION " + (currentQ + 1) + "</div>" +
        "<div class=\"question-text\">" + q.q + "</div>" +
        "<div class=\"options\">" +
        q.o.map((opt, i) => "<div class=\"option-btn\" onclick=\"answer(" + i + ")\">" + opt.t + "</div>").join("") +
        "</div>";
}

function answer(idx) {
    QUESTIONS[currentQ].o[idx].c.forEach(c => { scores[c] = (scores[c] || 0) + 1; });
    currentQ++;
    showQuestion();
}

function showResult() {
    document.getElementById("quizSection").style.display = "none";
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("progressText").textContent = "Terminé !";
    document.getElementById("shareBar").style.display = "block";

    const topKey = sorted[0][0];
    const subKey = sorted[1] ? sorted[1][0] : topKey;
    const a = ANIMALS[topKey];
    const sub = ANIMALS[subKey];

    const section = document.getElementById("resultSection");
    section.innerHTML =
        "<div class=\"animal-display\">" +
            "<span class=\"animal-emoji\">" + a.emoji + "</span>" +
            "<div class=\"animal-name\">" + a.name + "</div>" +
            "<div class=\"animal-title\">" + a.title + "</div>" +
            "<div class=\"animal-element\">Élément : " + a.element + "</div>" +
        "</div>" +

        "<div class=\"trait-grid\">" +
            "<div class=\"trait-item\">" +
                "<div class=\"trait-label\">Animal principal</div>" +
                "<div class=\"trait-value\">" + a.emoji + " " + a.name + "</div>" +
            "</div>" +
            "<div class=\"trait-item\">" +
                "<div class=\"trait-label\">Animal secondaire</div>" +
                "<div class=\"trait-value\">" + sub.emoji + " " + sub.name + "</div>" +
            "</div>" +
            "<div class=\"trait-item\">" +
                "<div class=\"trait-label\">Élément</div>" +
                "<div class=\"trait-value\">" + a.element + "</div>" +
            "</div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">🐾 Votre animal totem</div>" +
            "<div class=\"reading-text\">" + a.personality + "</div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">💪 Forces</div>" +
            "<div class=\"reading-text\"><strong>" + a.strength + "</strong></div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">⚠️ Faiblesses</div>" +
            "<div class=\"reading-text\">" + a.weakness + "</div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">💌 Message de votre animal totem</div>" +
            "<div class=\"reading-text\"><strong>\"" + a.message + "\"</strong></div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">🤝 Compatibilité animale</div>" +
            "<div class=\"compat-row\">" +
                "<div class=\"compat-item compat-good\">Animaux compatibles : " + a.good + "</div>" +
                "<div class=\"compat-item compat-bad\">Animaux à surveiller : " + a.bad + "</div>" +
            "</div>" +
        "</div>" +

        "<button class=\"retry-btn\" onclick=\"location.reload()\">🔄 Refaire le test</button>";

    section.style.display = "block";
    section.scrollIntoView({behavior:"smooth"});
}

startQuiz();
</script>
