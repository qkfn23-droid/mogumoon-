function reduceNum(n) {
    while (n > 9 && n !== 11 && n !== 22) {
        n = String(n).split("").reduce((s, d) => s + Number(d), 0);
    }
    return n;
}

function seededRand(seed) {
    let s = seed;
    for (let i = 0; i < 10; i++) s = (s * 16807) % 2147483647;
    return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

            </div>

        <div class="reading-card">
            <div class="reading-title">⭐ Talents apportes de la vie anterieure</div>
            <div class="reading-text"><strong>${pl.talent}</strong><br><br>Ces talents sont toujours presents en vous dans la vie actuelle. Si vous ressentez une attirance inexplicable ou une familiarite avec quelque chose de nouveau, c'est le souvenir de votre vie anterieure.</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">😨 Traumatismes de la vie anterieure</div>
            <div class="reading-text"><strong>${pl.fear}</strong><br><br>Si vous eprouvez des peurs inexpliquees dans la vie actuelle, elles peuvent provenir d'experiences vecues dans vos vies anterieures.</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💀 La mort dans la vie anterieure</div>
            <div class="reading-text">
                Dans votre vie anterieure, vous avez quitte ce monde a <strong>${deathAge} ans</strong>.<br>
                Cause : <strong>${death}</strong>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">📖 La lecon laissee par la vie anterieure</div>
            <div class="reading-text">Le message que vous de votre vie anterieure souhaitez le plus transmettre a votre vie actuelle :<br><br><strong>"${lesson}"</strong></div>
        </div>

        <button class="retry-btn" onclick="document.getElementById('resultSection').style.display='none';window.scrollTo({top:0,behavior:'smooth'});">🔄 Refaire le Test</button>
    `;
    section.style.display = "block";
    section.scrollIntoView({behavior:"smooth"});
}

// Initialisation des selects
(function() {
    const yEl = document.getElementById("birthYear");
    const mEl = document.getElementById("birthMonth");
    const dEl = document.getElementById("birthDay");
    const now = new Date();

    yEl.innerHTML = "<option value=\"\">Annee</option>";
    for (let y = now.getFullYear(); y >= 1920; y--) yEl.innerHTML += `<option value="${y}">${y}</option>`;

    mEl.innerHTML = "<option value=\"\">Mois</option>";
    for (let m = 1; m <= 12; m++) mEl.innerHTML += `<option value="${m}">${m}</option>`;

    function updateDays() {
        const y = parseInt(yEl.value) || 2000;
        const m = parseInt(mEl.value) || 1;
        const maxD = new Date(y, m, 0).getDate();
        const cur = parseInt(dEl.value);
        dEl.innerHTML = "<option value=\"\">Jour</option>";
        for (let d = 1; d <= maxD; d++) dEl.innerHTML += `<option value="${d}"${d===cur?" selected":""}>${d}</option>`;
    }
    yEl.onchange = updateDays;
    mEl.onchange = updateDays;
    updateDays();
})();
</script>
