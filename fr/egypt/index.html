    { name: 'Star of Seshat', deity: 'Seshat', glyph: '⭐', element: 'Vent', dates: '8/1~8/10', startM:8, startD:1, endM:8, endD:10,

    { name: 'Sky of Nut', deity: 'Nut', glyph: '🌌', element: 'Vent', dates: '8/21~8/31', startM:8, startD:21, endM:8, endD:31,

    { name: 'Peak of the Pyramid', deity: 'Benben', glyph: '🔺', element: 'Feu', dates: '11/21~11/30', startM:11, startD:21, endM:11, endD:30,

    { name: 'Birth of the Scarab', deity: 'Khepera', glyph: '🌅', element: 'Terre', dates: '12/1~12/10', startM:12, startD:1, endM:12, endD:10,

function getDecanIndex(month, day) {
    for (let i = 0; i < DECANS.length; i++) {
        const d = DECANS[i];
        const start = d.startM * 100 + d.startD;
        const end = d.endM * 100 + d.endD;
        const target = month * 100 + day;
        if (target >= start && target <= end) return i;
    }
    return 0;
}

function initForm() {
    const y = document.getElementById('birthYear');
    const m = document.getElementById('birthMonth');
    const d = document.getElementById('birthDay');
    for (let i = 2025; i >= 1940; i--) { const o = document.createElement('option'); o.value = i; o.textContent = i; if (i === 1995) o.selected = true; y.appendChild(o); }
    for (let i = 1; i <= 12; i++) { const o = document.createElement('option'); o.value = i; o.textContent = 'Mois ' + i; if (i === 3) o.selected = true; m.appendChild(o); }
    for (let i = 1; i <= 31; i++) { const o = document.createElement('option'); o.value = i; o.textContent = 'Jour ' + i; if (i === 15) o.selected = true; d.appendChild(o); }
}

function calculate() {
    const month = parseInt(document.getElementById('birthMonth').value);
    const day = parseInt(document.getElementById('birthDay').value);
    const idx = getDecanIndex(month, day);
    const decan = DECANS[idx];

    // Decan Card
    document.getElementById('decanCard').innerHTML = `
        <div class="decan-card">
            <span class="decan-glyph">${decan.glyph}</span>
            <div class="decan-name">${decan.name}</div>
            <div class="decan-deity">Divinité gardienne : ${decan.deity}</div>
            <div class="decan-dates">${decan.dates}</div>
        </div>
    `;

    // Info Grid
    document.getElementById('infoGrid').innerHTML = `
        <div class="info-item">
            <div class="info-label">Divinité gardienne</div>
            <div class="info-value">${decan.glyph} ${decan.deity}</div>
        </div>
        <div class="info-item">
            <div class="info-label">Élément</div>
            <div class="info-value">${decan.element}</div>
        </div>
        <div class="info-item">
            <div class="info-label">Numéro du décan</div>
            <div class="info-value">${idx + 1} / 36</div>
        </div>
        <div class="info-item">
            <div class="info-label">Période</div>
            <div class="info-value">${decan.dates}</div>
        </div>
    `;

    // Personality
    document.getElementById('personalityWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">${decan.glyph} ${decan.name} — ${decan.deity}</div>
            <div class="interp-text">${decan.personality}</div>
        </div>
    `;

    // Love
    document.getElementById('loveWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">Style amoureux de ${decan.deity}</div>
            <div class="interp-text">${decan.love}</div>
        </div>
    `;

    // Career
    document.getElementById('careerWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">Carrière et richesse</div>
            <div class="interp-text">${decan.career}</div>
        </div>
    `;

    // Health
    document.getElementById('healthWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">Précautions de santé</div>
            <div class="interp-text">${decan.health}</div>
        </div>
    `;

    // Compatibility
    let compatHtml = '<div class="interp-card"><div class="interp-title">Divinités compatibles</div><div class="interp-text">';
    decan.compat.forEach(ci => {
        if (ci < DECANS.length) {
            const c = DECANS[ci];
            compatHtml += `${c.glyph} <strong>${c.name}</strong> (${c.deity}) — ${c.dates}<br>`;
        }
    });
    compatHtml += '</div></div>';
    document.getElementById('compatWrap').innerHTML = compatHtml;

    // Lucky
    document.getElementById('luckyWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-text">
                <strong>Couleur porte-bonheur :</strong> ${decan.lucky.color}<br>
                <strong>Pierre précieuse :</strong> ${decan.lucky.stone}<br>
                <strong>Nombre porte-bonheur :</strong> ${decan.lucky.number}<br>
                <strong>Animal gardien :</strong> ${decan.lucky.animal}
            </div>
        </div>
    `;

    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
}

initForm();
document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>
