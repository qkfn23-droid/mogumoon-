function getDecanIndex(month, day) {
    for (let i = 0; i < DECANS.length; i++) {
        const d = DECANS[i];
        const start = d.startM * 100 + d.startD;
        const end = d.endM * 100 + d.endD;
        const target = month * 100 + day;
        if (target >= start && target <= end) return i;
    }
    return 0;
}

function initForm() {
    const y = document.getElementById('birthYear');
    const m = document.getElementById('birthMonth');
    const d = document.getElementById('birthDay');
    for (let i = 2025; i >= 1940; i--) { const o = document.createElement('option'); o.value = i; o.textContent = i; if (i === 1995) o.selected = true; y.appendChild(o); }
    for (let i = 1; i <= 12; i++) { const o = document.createElement('option'); o.value = i; o.textContent = 'Mes ' + i; if (i === 3) o.selected = true; m.appendChild(o); }
    for (let i = 1; i <= 31; i++) { const o = document.createElement('option'); o.value = i; o.textContent = 'Dia ' + i; if (i === 15) o.selected = true; d.appendChild(o); }
}

                <strong>Piedra de la suerte:</strong> ${decan.lucky.stone}<br>
                <strong>Numero de la suerte:</strong> ${decan.lucky.number}<br>
                <strong>Animal guardian:</strong> ${decan.lucky.animal}
            </div>
        </div>
    `;

    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
}

initForm();
document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>

</body>
</html>
