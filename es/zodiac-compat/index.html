function key(a,b){ return Math.min(a,b)+"-"+Math.max(a,b); }

function baseScore(a,b) {
    const ea = SIGNS[a].element, eb = SIGNS[b].element;
    if (ea === eb) return 85;
    if ((ea==="fire"&&eb==="air")||(ea==="air"&&eb==="fire")) return 80;
    if ((ea==="earth"&&eb==="water")||(ea==="water"&&eb==="earth")) return 80;
    if ((ea==="fire"&&eb==="earth")||(ea==="earth"&&eb==="fire")) return 55;
    if ((ea==="fire"&&eb==="water")||(ea==="water"&&eb==="fire")) return 45;
    if ((ea==="air"&&eb==="water")||(ea==="water"&&eb==="air")) return 50;
    if ((ea==="air"&&eb==="earth")||(ea==="earth"&&eb==="air")) return 50;
    return 60;
}

function angleBonus(a,b) {
    const diff = Math.abs(a-b);
    const angle = Math.min(diff, 12-diff);
    if (angle===0) return 5;
    if (angle===1) return -5;
    if (angle===2) return 10;
    if (angle===3) return -10;
    if (angle===4) return 8;
    if (angle===5) return -3;
    if (angle===6) return 0;
    return 0;
}

    "fire-air":{love:"El viento aviva el fuego y lo hace arder con mas fuerza. Una combinacion fantastica que se dan inspiracion y energia mutuamente. El fuego aporta pasion y el aire, ideas.",friend:"Juntos, posibilidades infinitas. Lo mejor para aventuras, viajes y nuevos retos.",tip:"Un viento demasiado fuerte puede apagar el fuego. Una distancia adecuada mantiene viva la relacion."},
    "fire-earth":{love:"El encuentro entre la pasion y la estabilidad. Si el fuego es demasiado intenso, la tierra se seca; si la tierra es demasiado pesada, el fuego se apaga. Ajustar el ritmo del otro es la clave.",friend:"La combinacion del realista y el idealista. Pueden compensar sus carencias mutuamente, aunque tambien habra conflictos.",tip:"Respetad los mundos del otro. El fuego regala aventura a la tierra y la tierra ofrece estabilidad al fuego."},

            </div>
        `).join("");
    });
}

function selectSign(picker, idx) {
    if (picker === 0) selected1 = idx; else selected2 = idx;
    document.querySelectorAll(`#picker${picker+1} .zodiac-btn`).forEach(b => {
        b.classList.toggle("selected", parseInt(b.dataset.idx) === idx);
    });

function getElementPair(a, b) {
    const pair = [SIGNS[a].element, SIGNS[b].element].sort().join("-");
    return pair;
}

function checkCompat() {
    if (selected1 < 0 || selected2 < 0) return alert("Por favor, selecciona los dos signos.");

    const s1 = SIGNS[selected1], s2 = SIGNS[selected2];

            <div class="score-bar-item">

                }
            </div>
        </div>

        <button class="retry-btn" onclick="document.getElementById('resultSection').style.display='none';window.scrollTo({top:0,behavior:'smooth'});">🔄 Probar Otra Combinacion</button>
    `;
    section.style.display = "block";
    section.scrollIntoView({behavior:"smooth"});
}

renderPickers();
</script>
