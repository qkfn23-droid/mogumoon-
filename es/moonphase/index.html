<script>
function getMoonPhase(year, month, day) {
    if (month <= 2) { year--; month += 12; }
    const A = Math.floor(year / 100);
    const B = 2 - A + Math.floor(A / 4);
    const JD = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
    const daysSinceNew = JD - 2451550.1;
    const newMoons = daysSinceNew / 29.530588853;
    const phase = newMoons - Math.floor(newMoons);
    return phase;
}

function getPhaseInfo(phase) {
    const illumination = Math.round(Math.abs(Math.cos(phase * 2 * Math.PI) * -0.5 + 0.5) * 100);
    const lunarDay = Math.round(phase * 29.5) + 1;

    if (phase < 0.0625) return {name:"Luna Nueva",emoji:"🌑",idx:0,illumination,lunarDay,
        meaning:"La energía de un <strong>nuevo comienzo</strong> llena el aire. Con la luna completamente oculta, es el momento ideal para plantar semillas, establecer nuevas intenciones y fijar metas. Es un tiempo de introspección — planifica en silencio y deja que los brotes germinen desde adentro.",
        good:["Iniciar nuevos proyectos","Establecer metas","Meditación y reflexión","Escribir en el diario","Desintoxicación digital"],
        bad:["Grandes presentaciones públicas","Tomar decisiones finales","Actividad social excesiva"]};
    if (phase < 0.1875) return {name:"Creciente",emoji:"🌒",idx:1,illumination,lunarDay,
        meaning:"Las semillas que plantaste comienzan a <strong>brotar</strong>. Es hora de pasar de la intención a la acción. Aunque todo es aún pequeño y delicado, la energía constante lo hará crecer. Atrévete a dar el primer paso — no necesita ser perfecto.",
        good:["Dar los primeros pasos","Comenzar el desarrollo personal","Crear nuevos hábitos","Tomar coraje"],
        bad:["Juicios precipitados","Perfeccionismo","Grandes riesgos"]};
    if (phase < 0.3125) return {name:"Cuarto Creciente",emoji:"🌓",idx:2,illumination,lunarDay,
        meaning:"Es el momento de la <strong>decisión y la acción</strong>. La media luna simboliza el equilibrio entre luz y sombra — un momento de elección. Pueden surgir obstáculos, pero son una prueba. Decide con valentía y avanza. No huyas del desafío.",
        good:["Tomar decisiones importantes","Afrontar retos","Enfrentar problemas","Acción activa"],
        bad:["Indecisión","Rendirse","Evitar responsabilidades"]};
    if (phase < 0.4375) return {name:"Gibosa Creciente",emoji:"🌔",idx:3,illumination,lunarDay,
        meaning:"Es el tiempo de <strong>refinar y completar</strong>. Como la luna casi llena, te estás acercando a tu meta. Revisa los detalles y termina lo que empezaste. Con paciencia y esfuerzo hasta el final, cosecharás frutos en la luna llena.",
        good:["Ajustes finales","Trabajo de cierre","Mantener la paciencia","Incorporar retroalimentación"],
        bad:["Empezar algo nuevo","Cambiar de dirección","Actuar con precipitación"]};
    if (phase < 0.5625) return {name:"Luna Llena",emoji:"🌕",idx:4,illumination,lunarDay,
        meaning:"¡La energía de la luna alcanza su <strong>punto máximo</strong>! Las emociones se intensifican, la intuición se agudiza y lo oculto sale a la luz. Es la época de la cosecha — tus esfuerzos dan fruto. Celebra y da gracias. Los deseos bajo la luna llena tienen un poder especial.",
        good:["Celebrar y agradecer","Pedir deseos","Seguir la intuición","Cosechar resultados","Confesar el amor"],
        bad:["Decisiones emocionales","Acciones impulsivas","Grandes discusiones"]};
    if (phase < 0.6875) return {name:"Gibosa Menguante",emoji:"🌖",idx:5,illumination,lunarDay,
        meaning:"Es un tiempo de <strong>compartir y gratitud</strong>. Así como la luz de la luna llena disminuye poco a poco, devuelve y comparte lo que has recibido. Ordena y enseña lo aprendido. La sabiduría interior se profundiza en esta etapa.",
        good:["Compartir y servir","Enseñar y mentorear","Expresar gratitud","Organizar y reflexionar"],
        bad:["Nuevos comienzos","Ser codicioso"]};
    if (phase < 0.8125) return {name:"Cuarto Menguante",emoji:"🌗",idx:6,illumination,lunarDay,
        meaning:"Es el momento de <strong>soltar y ordenar</strong>. Deshazme de lo que ya no necesitas — malos hábitos, relaciones tóxicas, cargas antiguas. Para que entre lo nuevo, hay que hacer espacio. Perdona y suelta.",
        good:["Organizar y limpiar","Romper malos hábitos","Perdonar y reconciliar","Desechar lo innecesario"],
        bad:["Nuevos proyectos","Aferrarse","Vivir en el pasado"]};
    if (phase < 0.9375) return {name:"Menguante",emoji:"🌘",idx:7,illumination,lunarDay,
        meaning:"La luna está a punto de desaparecer — es un tiempo de <strong>descanso y recarga</strong>. Que la energía baje es parte natural del ciclo. No te esfuerces de más; descansa lo suficiente. Presta atención a la meditación, los sueños y la intuición. Pronto llegará la luna nueva.",
        good:["Descanso suficiente","Meditación y oración","Diario de sueños","Recargar energía"],
        bad:["Actividad excesiva","Inicios importantes","Trabajar en exceso"]};
    return {name:"Luna Nueva",emoji:"🌑",idx:0,illumination:0,lunarDay:1,
        meaning:"La energía de un <strong>nuevo comienzo</strong> te rodea. Planifica en silencio.",
        good:["Iniciar nuevos proyectos","Establecer metas","Meditación"],
        bad:["Grandes presentaciones","Tomar decisiones finales"]};
}

function findNextPhase(targetPhase, startDate) {
    const d = new Date(startDate);
    for (let i = 1; i <= 35; i++) {
        d.setDate(d.getDate() + 1);
        const p = getMoonPhase(d.getFullYear(), d.getMonth() + 1, d.getDate());
        if (targetPhase === "full" && p >= 0.47 && p <= 0.53) return d;
        if (targetPhase === "new" && (p <= 0.03 || p >= 0.97)) return d;
    }
    return null;
}

function drawMoon(phase) {
    const r = 90;
    const cx = 100, cy = 100;
    let d;
    const ill = phase <= 0.5 ? phase * 2 : (1 - phase) * 2;
    const sweep = phase <= 0.5 ? 1 : 0;
    const bulge = (ill - 0.5) * 2 * r;

    if (phase < 0.01 || phase > 0.99) {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1a1a2e" stroke="#333" stroke-width="1"/>`;
    }
    if (phase > 0.49 && phase < 0.51) {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#e8e4d4" />
                <circle cx="${cx-25}" cy="${cy-20}" r="12" fill="rgba(200,195,180,0.5)"/>
                <circle cx="${cx+20}" cy="${cy+15}" r="8" fill="rgba(200,195,180,0.4)"/>
                <circle cx="${cx+5}" cy="${cy-35}" r="6" fill="rgba(200,195,180,0.3)"/>`;
    }

    const lightSide = phase <= 0.5 ? "right" : "left";
    const darkFill = "#1a1a2e";
    const lightFill = "#e8e4d4";

    if (lightSide === "right") {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${lightFill}"/>
                <path d="M${cx},${cy-r} A${r},${r} 0 0,0 ${cx},${cy+r} A${Math.abs(bulge)},${r} 0 0,${bulge > 0 ? 0 : 1} ${cx},${cy-r}" fill="${darkFill}"/>`;
    } else {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${lightFill}"/>
                <path d="M${cx},${cy-r} A${r},${r} 0 0,1 ${cx},${cy+r} A${Math.abs(bulge)},${r} 0 0,${bulge > 0 ? 1 : 0} ${cx},${cy-r}" fill="${darkFill}"/>`;
    }
}

const now = new Date();
const phase = getMoonPhase(now.getFullYear(), now.getMonth() + 1, now.getDate());
const info = getPhaseInfo(phase);
const nextFull = findNextPhase("full", now);
const nextNew = findNextPhase("new", now);

const PHASES = [
    {emoji:"🌑",name:"Luna Nueva"},{emoji:"🌒",name:"Creciente"},{emoji:"🌓",name:"Cuarto Creciente"},
    {emoji:"🌔",name:"Gibosa Creciente"},{emoji:"🌕",name:"Luna Llena"},{emoji:"🌖",name:"Gibosa Menguante"},
    {emoji:"🌗",name:"Cuarto Menguante"},{emoji:"🌘",name:"Menguante"}
];

function formatDate(d) {
    if (!d) return "-";
    return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
}

function daysUntil(d) {
    if (!d) return "-";
    const diff = Math.ceil((d - now) / (1000*60*60*24));
    return `en ${diff} dias`;
}

const dayNames = ["Dom","Lun","Mar","Mie","Jue","Vie","Sab"];
const todayStr = `${dayNames[now.getDay()]}, ${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}`;

document.getElementById("moonContent").innerHTML = `
    <div class="moon-display">
        <div class="moon-date">${todayStr}</div>
        <div class="moon-wrapper">
            <div class="moon-glow"></div>
            <svg class="moon-svg" viewBox="0 0 200 200">${drawMoon(phase)}</svg>
        </div>
        <div class="moon-name"><span class="moon-emoji">${info.emoji}</span>${info.name}</div>
        <div class="moon-sub">Dia lunar aprox. ${info.lunarDay}</div>
        <div class="moon-illumination">Iluminacion: ${info.illumination}%</div>
    </div>

    <div class="phase-timeline">
        ${PHASES.map((p, i) => `<div class="phase-item ${i === info.idx ? "active" : ""}">
            <div class="ph-emoji">${p.emoji}</div>
            <div class="ph-name">${p.name}</div>
        </div>`).join("")}
    </div>

    <div class="info-grid">
        <div class="info-card">
            <div class="info-label">Proxima Luna Llena 🌕</div>
            <div class="info-value">${formatDate(nextFull)}</div>
            <div class="info-sub">${daysUntil(nextFull)}</div>
        </div>
        <div class="info-card">
            <div class="info-label">Proxima Luna Nueva 🌑</div>
            <div class="info-value">${formatDate(nextNew)}</div>
            <div class="info-sub">${daysUntil(nextNew)}</div>
        </div>
        <div class="info-card">
            <div class="info-label">Ciclo Lunar</div>
            <div class="info-value">29.5 dias</div>
            <div class="info-sub">Ciclo sinodico</div>
        </div>
        <div class="info-card">
            <div class="info-label">Posicion Actual</div>
            <div class="info-value">${Math.round(phase * 100)}%</div>
            <div class="info-sub">Progreso del ciclo</div>
        </div>
    </div>

    <div class="reading-card">
        <div class="reading-title">🌙 El mensaje de la luna de hoy</div>
        <div class="reading-text">${info.meaning}</div>
    </div>

    <div class="reading-card">
        <div class="reading-title">✅ Actividades favorables vs ❌ Actividades a evitar</div>
        <div class="activity-grid">
            ${info.good.map(g => `<div class="activity-item activity-good">✅ ${g}</div>`).join("")}
            ${info.bad.map(b => `<div class="activity-item activity-bad">❌ ${b}</div>`).join("")}
        </div>
    </div>

    <div class="reading-card">
        <div class="reading-title">📖 Las 8 fases de la luna</div>
        <div class="reading-text">
            <strong>🌑 Luna Nueva</strong> — Nuevos comienzos, establecer intenciones<br>
            <strong>🌒 Creciente</strong> — Las semillas brotan, primeras acciones<br>
            <strong>🌓 Cuarto Creciente</strong> — Decision, desafio, superar obstaculos<br>
            <strong>🌔 Gibosa Creciente</strong> — Refinar, a punto de completar<br>
            <strong>🌕 Luna Llena</strong> — Climax, cosecha, emociones intensas<br>
            <strong>🌖 Gibosa Menguante</strong> — Compartir, gratitud, ordenar<br>
            <strong>🌗 Cuarto Menguante</strong> — Soltar, limpiar, perdonar<br>
            <strong>🌘 Menguante</strong> — Descanso, recarga, introspección
        </div>
    </div>
`;
</script>
