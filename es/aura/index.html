let currentQ = 0;
const scores = {};

function startQuiz() {
    currentQ = 0;
    Object.keys(AURAS).forEach(k => scores[k] = 0);
    showQuestion();
}

function showQuestion() {
    if (currentQ >= QUESTIONS.length) { showResult(); return; }
    const q = QUESTIONS[currentQ];
    const pct = (currentQ / QUESTIONS.length) * 100;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressText").textContent = "Pregunta " + (currentQ + 1) + " / " + QUESTIONS.length;

    document.getElementById("questionCard").innerHTML =
        "<div class=\"question-num\">PREGUNTA " + (currentQ + 1) + "</div>" +
        "<div class=\"question-text\">" + q.q + "</div>" +
        "<div class=\"options\">" +
        q.o.map(function(opt, i) { return "<div class=\"option-btn\" onclick=\"answer(" + i + ")\">" + opt.t + "</div>"; }).join("") +
        "</div>";
}

function answer(idx) {
    const q = QUESTIONS[currentQ];
    q.o[idx].c.forEach(function(c) { scores[c] = (scores[c] || 0) + 1; });
    currentQ++;
    showQuestion();
}

function showResult() {
    document.getElementById("quizSection").style.display = "none";
    document.getElementById("progressFill").style.width = "100%";

            "<div class=\"glow\" style=\"background:" + a.color + ";\"></div>" +
            "<div class=\"inner\" style=\"background:radial-gradient(circle at 40% 40%, " + a.bg + ", rgba(10,10,26,0.9));\">" +
                "<div class=\"color-emoji\">" + a.emoji + "</div>" +
                "<div class=\"color-name\" style=\"color:" + a.color + ";\">" + a.name + "</div>" +
            "</div>" +
        "</div>" +

        "<div class=\"result-title\" style=\"color:" + a.color + ";\">¡Tu aura es " + a.name + "!</div>" +
        "<div class=\"result-subtitle\">" + a.keyword + "</div>" +

        "<div class=\"trait-grid\">" +
            "<div class=\"trait-item\"><div class=\"trait-label\">Elemento</div><div class=\"trait-value\" style=\"color:" + a.color + ";\">" + a.element + "</div></div>" +
            "<div class=\"trait-item\"><div class=\"trait-label\">Chakra</div><div class=\"trait-value\" style=\"color:" + a.color + ";\">" + a.chakra + "</div></div>" +
            "<div class=\"trait-item\"><div class=\"trait-label\">Aura Secundaria</div><div class=\"trait-value\" style=\"color:" + sub.color + ";\">" + sub.emoji + " " + sub.name + "</div></div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">🧿 Análisis de Personalidad</div>" +
            "<div class=\"reading-text\">" + a.personality + "</div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">💪 Fortalezas</div>" +
            "<div class=\"reading-text\"><strong>" + a.strength + "</strong></div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">⚠️ Debilidades</div>" +
            "<div class=\"reading-text\">" + a.weakness + "</div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">💡 Consejo de tu Aura</div>" +
            "<div class=\"reading-text\"><strong>" + a.advice + "</strong></div>" +
        "</div>" +

        "<div class=\"reading-card\">" +
            "<div class=\"reading-title\">💞 Compatibilidad de Auras</div>" +
            "<div class=\"compat-grid\">" +
                a.good.map(function(g) { return "<div class=\"compat-item compat-good\">Aura compatible: " + g + "</div>"; }).join("") +
                a.bad.map(function(b) { return "<div class=\"compat-item compat-bad\">Aura con precaución: " + b + "</div>"; }).join("") +
            "</div>" +
        "</div>" +

        "<button class=\"retry-btn\" onclick=\"location.reload()\">🔄 Repetir Test</button>";

    section.style.display = "block";
    section.scrollIntoView({behavior:"smooth"});
}

startQuiz();
</script>

</body>
</html>
