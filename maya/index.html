// GMT correlation constant (Goodman-Martinez-Thompson)
const GMT_CORRELATION = 584283;

function gregorianToJDN(y, m, d) {
    if (m <= 2) { y--; m += 12; }
    const A = Math.floor(y / 100);
    const B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524;
}

function jdnToMayaLongCount(jdn) {
    let d = jdn - GMT_CORRELATION;
    const baktun = Math.floor(d / 144000); d %= 144000;
    const katun = Math.floor(d / 7200); d %= 7200;
    const tun = Math.floor(d / 360); d %= 360;
    const winal = Math.floor(d / 20); d %= 20;
    const kin = d;
    return { baktun, katun, tun, winal, kin };
}

function jdnToTzolkin(jdn) {
    const num = ((jdn - GMT_CORRELATION + 19) % 13 + 13) % 13 + 1; // 1-13
    const sign = ((jdn - GMT_CORRELATION + 19) % 20 + 20) % 20; // 0-19
    return { num, sign };
}

function jdnToHaab(jdn) {
    const d = (jdn - GMT_CORRELATION + 348) % 365;
    const month = Math.floor(d / 20);
    const day = d % 20;
    return { month: Math.min(month, 18), day };
}

function initForm() {
    const y = document.getElementById('birthYear');
    const m = document.getElementById('birthMonth');
    const d = document.getElementById('birthDay');
    for (let i = 2025; i >= 1940; i--) {
        const o = document.createElement('option');
        o.value = i; o.textContent = i + '년';
        if (i === 1995) o.selected = true;
        y.appendChild(o);
    }
    for (let i = 1; i <= 12; i++) {
        const o = document.createElement('option');
        o.value = i; o.textContent = i + '월';
        if (i === 3) o.selected = true;
        m.appendChild(o);
    }
    for (let i = 1; i <= 31; i++) {
        const o = document.createElement('option');
        o.value = i; o.textContent = i + '일';
        if (i === 15) o.selected = true;
        d.appendChild(o);
    }
}

    const month = parseInt(document.getElementById('birthMonth').value);
    const day = parseInt(document.getElementById('birthDay').value);

    const jdn = gregorianToJDN(year, month, day);
    const longCount = jdnToMayaLongCount(jdn);
    const tzolkin = jdnToTzolkin(jdn);

    const tone = TONES[tzolkin.num - 1];

        </div>
        <div class="interp-card">
            <div class="interp-title">💪 강점</div>
            <div class="interp-text">${sign.strength}</div>
        </div>
        <div class="interp-card">
            <div class="interp-title">⚠️ 도전</div>
            <div class="interp-text">${sign.challenge}</div>
        </div>
        <div class="interp-card">
            <div class="interp-title">💼 적합한 직업</div>
            <div class="interp-text">${sign.career}</div>
        </div>
        <div class="interp-card">
            <div class="interp-title">💕 연애 & 관계</div>
            <div class="interp-text">${sign.love}</div>
        </div>
        ${sign.spiritual ? `<div class="interp-card">
            <div class="interp-title">🔮 영적 메시지</div>
            <div class="interp-text">${sign.spiritual}</div>
        </div>` : ''}
        ${sign.wealth ? `<div class="interp-card">
            <div class="interp-title">💰 재물운</div>
            <div class="interp-text">${sign.wealth}</div>
        </div>` : ''}
        ${sign.health ? `<div class="interp-card">
            <div class="interp-title">🏥 건강</div>
            <div class="interp-text">${sign.health}</div>
        </div>` : ''}
    `;

    // Tone Interpretation
    const toneComboTexts = {
        1: `톤 1 "통합"은 ${sign.ko}의 에너지에 순수한 시작의 불꽃을 부여합니다. 당신은 ${sign.ko}의 특성을 가장 원초적이고 순수한 형태로 경험하며, 새로운 주기를 열어가는 개척자입니다. 독립적으로 자기 길을 개척하는 힘이 있으며, ${sign.ko}의 에너지를 세상에 처음으로 선보이는 역할을 합니다. 리더십이 강하지만 협력을 배워야 합니다.`,
        2: `톤 2 "이중성"은 ${sign.ko}의 에너지에 균형과 선택의 과제를 부여합니다. 당신은 ${sign.ko}의 빛과 그림자 양면을 모두 강하게 경험하며, 내면의 양극성 사이에서 균형을 찾는 것이 인생의 핵심 주제입니다. 파트너십을 통해 ${sign.ko}의 에너지가 완성되며, 관계 속에서 가장 큰 성장을 합니다.`,
        3: `톤 3 "활성화"는 ${sign.ko}의 에너지를 역동적으로 움직이게 합니다. 당신은 ${sign.ko}의 특성을 행동으로 표현하는 활동가이며, 아이디어를 현실로 옮기는 추진력이 뛰어납니다. 창조적 에너지가 넘치며, ${sign.ko}의 잠재력을 세상에 활발하게 드러냅니다. 다만 에너지를 분산시키지 않도록 집중하는 연습이 필요합니다.`,
        4: `톤 4 "안정"은 ${sign.ko}의 에너지에 구조와 기반을 제공합니다. 당신은 ${sign.ko}의 특성을 안정적이고 체계적으로 발현하며, 견고한 토대 위에 차곡차곡 쌓아가는 건축가입니다. 네 방향의 균형이 잡혀 있으며, ${sign.ko}의 에너지가 실용적이고 지속 가능한 형태로 나타납니다. 변화를 두려워하지 않는 유연성을 기르세요.`,
        5: `톤 5 "역능"은 ${sign.ko}의 에너지에 강력한 중심과 권한을 부여합니다. 당신은 ${sign.ko}의 특성을 가장 강력하게 발휘하는 위치에 있으며, 우주적 힘을 부여받은 존재입니다. 결단력이 뛰어나고, ${sign.ko}의 에너지가 주변에 큰 영향력을 미칩니다. 그 힘을 겸손하게 사용하는 것이 영적 과제입니다.`,
        6: `톤 6 "유동"은 ${sign.ko}의 에너지를 유기적이고 유연하게 흐르게 합니다. 당신은 ${sign.ko}의 특성이 물처럼 상황에 따라 자연스럽게 적응하며, 반응과 흐름의 달인입니다. 다른 사람의 필요에 민감하게 반응하며, ${sign.ko}의 에너지를 조화롭게 배분합니다. 자신만의 방향성을 잃지 않는 것이 중요합니다.`,
        7: `톤 7 "공명"은 ${sign.ko}의 에너지를 우주적 주파수와 연결합니다. 당신은 ${sign.ko}의 특성이 가장 영적이고 직관적인 방식으로 발현되며, 눈에 보이지 않는 세계와의 채널이 열려 있습니다. 신비로운 경험이 많고, ${sign.ko}의 에너지가 영감과 예언의 형태로 나타납니다. 현실과의 연결을 유지하는 것이 과제입니다.`,
        8: `톤 8 "조화"는 ${sign.ko}의 에너지를 모든 것과 조화시키는 힘을 줍니다. 당신은 ${sign.ko}의 특성을 통합적이고 균형 잡힌 방식으로 표현하며, 서로 다른 요소를 하나로 묶는 능력이 있습니다. ${sign.ko}의 에너지가 모델이 되어 다른 사람들에게 본보기를 보여줍니다. 완벽한 조화에 집착하지 않는 것이 성장의 열쇠입니다.`,
        9: `톤 9 "태양"은 ${sign.ko}의 에너지에 생명력과 실현의 맥박을 불어넣습니다. 당신은 ${sign.ko}의 특성을 가장 생동감 있고 활력 넘치게 발현하며, 목표를 향한 강한 의지가 있습니다. 태양처럼 에너지가 충만하며, ${sign.ko}의 잠재력을 현실에서 완전히 실현하는 힘을 가지고 있습니다. 과도한 열정으로 타인을 태우지 않도록 주의하세요.`,
        10: `톤 10 "현현"은 ${sign.ko}의 에너지를 구체적 현실로 만드는 힘을 줍니다. 당신은 ${sign.ko}의 특성이 가시적인 결과물로 나타나며, 생산과 완성의 능력이 뛰어납니다. 꿈을 현실로 바꾸는 연금술사이며, ${sign.ko}의 에너지가 물질 세계에서 구체적 형태를 갖춥니다. 내면의 가치도 외면의 성과만큼 중요하다는 것을 기억하세요.`,
        11: `톤 11 "해방"은 ${sign.ko}의 에너지를 해방시키고 자유롭게 풀어놓습니다. 당신은 ${sign.ko}의 특성에서 불필요한 것을 걷어내고 본질만 남기는 능력이 있으며, 변화와 해체를 통한 자유를 경험합니다. ${sign.ko}의 에너지가 관습을 깨고 새로운 가능성을 여는 방식으로 작용합니다. 해체 후 재건하는 것도 잊지 마세요.`,
        12: `톤 12 "협력"은 ${sign.ko}의 에너지를 나눔과 이해의 방식으로 발현합니다. 당신은 ${sign.ko}의 특성을 깊이 이해하고 그것을 다른 사람들과 공유하는 능력이 뛰어납니다. 복잡한 것을 명확하게 설명하며, ${sign.ko}의 에너지를 공동체를 위해 사용합니다. 주는 것과 받는 것의 균형을 유지하세요.`,
        13: `톤 13 "초월"은 ${sign.ko}의 에너지를 가장 높은 차원으로 끌어올립니다. 당신은 ${sign.ko}의 특성이 가장 초월적이고 우주적인 방식으로 발현되며, 모든 주기의 완성과 새로운 시작의 경계에 서 있습니다. ${sign.ko}의 에너지가 인내와 초월을 통해 우주적 지혜로 승화됩니다. 가장 높은 에너지를 가졌으므로, 그만큼의 책임감도 수반됩니다.`
    };

    document.getElementById('toneInterpWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">🔢 톤 ${tzolkin.num}: ${tone.name}</div>
            <div class="interp-text">
                ${tone.meaning}
            </div>
        </div>
        <div class="interp-card">
            <div class="interp-title">🌀 톤 ${tzolkin.num} "${tone.name}" + ${sign.glyph} ${sign.ko} 조합 해석</div>
            <div class="interp-text">
                ${toneComboTexts[tzolkin.num]}
            </div>
        </div>
    `;

    // Haab
    document.getElementById('haabWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">🌞 Haab 위치: ${haab.day} ${HAAB_MONTHS[haab.month]} (${HAAB_MONTHS_KO[haab.month]})</div>
            <div class="interp-text">
                Haab는 마야의 <strong>365일 태양력</strong>입니다. 18개의 월(각 20일) + 5일의 와옙(불길한 날)으로 구성됩니다.<br><br>
                ${haab.month === 18 ? '⚠️ 와옙(Wayeb) 기간에 태어났습니다. 마야인들은 이 5일을 위험하지만 강력한 영적 에너지의 시기로 보았습니다. 특별한 영적 사명을 가지고 태어난 것으로 해석됩니다.' :
                  `${HAAB_MONTHS[haab.month]} 월의 ${haab.day}일. 이 시기는 자연의 순환 속에서 ${haab.month < 6 ? '성장과 시작' : haab.month < 12 ? '수확과 결실' : '성찰과 준비'}의 에너지를 가집니다.`}
            </div>
        </div>
    `;

    // Fortune
    const fortuneTexts = [
        '창조와 시작의 에너지가 강합니다. 새로운 프로젝트를 시작하기에 좋은 시기.',
        '소통과 관계의 에너지. 인연을 넓히고 대화를 통해 문제를 해결하세요.',
        '내면을 돌아보는 시기. 명상과 자기 성찰을 통해 답을 찾으세요.',
        '물질적 풍요의 에너지. 재정적 기회가 다가올 수 있습니다.',
        '변혁의 시기. 낡은 것을 버리고 새로운 나를 만날 준비를 하세요.'
    ];
    const fortuneIdx = (tzolkin.num + tzolkin.sign) % 5;

    document.getElementById('fortuneWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">🌀 ${sign.name} + 톤 ${tzolkin.num}의 운세 에너지</div>
            <div class="interp-text">
                ${fortuneTexts[fortuneIdx]}<br><br>
                <strong>행운의 색상:</strong> ${sign.color}<br>
                <strong>행운의 방향:</strong> ${sign.direction}<br>
                <strong>원소:</strong> ${sign.element}<br>
                <strong>260일 주기 위치:</strong> ${((tzolkin.sign * 13 + tzolkin.num - 1) % 260) + 1}/260
            </div>
        </div>
    `;

    // ═══════════════════════════════════
    // 궁합
    // ═══════════════════════════════════
    const COMPAT_BEST = {
        0:[4,8,12,16], 1:[5,9,13,17], 2:[6,10,14,18], 3:[7,11,15,19],
        4:[0,8,12,16], 5:[1,9,13,17], 6:[2,10,14,18], 7:[3,11,15,19],
        8:[0,4,12,16], 9:[1,5,13,17], 10:[2,6,14,18], 11:[3,7,15,19],
        12:[0,4,8,16], 13:[1,5,9,17], 14:[2,6,10,18], 15:[3,7,11,19],
        16:[0,4,8,12], 17:[1,5,9,13], 18:[2,6,10,14], 19:[3,7,11,15]
    };
    const bestMatch = COMPAT_BEST[tzolkin.sign] || [];
    let compatHtml = `<div class="interp-card">
        <div class="interp-title">💞 ${sign.glyph} ${sign.ko}의 궁합</div>
        <div class="interp-text">
            <strong>최고의 궁합 (같은 원소 "${sign.element}" · 방향 "${sign.direction}"):</strong><br><br>`;
    bestMatch.forEach(idx => {
        const s = DAY_SIGNS[idx];
        compatHtml += `${s.glyph} <strong>${s.ko}</strong> (${s.name}) — ${s.meaning}<br>`;
    });
    const challengeIdx = (tzolkin.sign + 10) % 20;
    const challengeSign = DAY_SIGNS[challengeIdx];
    compatHtml += `<br><strong>도전적 궁합 (성장의 관계):</strong><br>
        ${challengeSign.glyph} <strong>${challengeSign.ko}</strong> (${challengeSign.name}) — 서로 다르기에 배울 점이 많지만 갈등도 있는 관계.`;
    compatHtml += `</div></div>`;
    document.getElementById('compatWrap').innerHTML = compatHtml;

    // ═══════════════════════════════════
    // 오늘의 Tzolkin 에너지
    // ═══════════════════════════════════
    const todayJDN = gregorianToJDN(new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate());
    const todayTz = jdnToTzolkin(todayJDN);
    const todaySign = DAY_SIGNS[todayTz.sign];
    const todayTone = TONES[todayTz.num - 1];
    const isSameSign = todayTz.sign === tzolkin.sign;

    document.getElementById('todayWrap').innerHTML = `
        <div class="interp-card" ${isSameSign ? 'style="border:2px solid #e8a020;"' : ''}>
            <div class="interp-title">${todaySign.glyph} 오늘: ${todayTz.num} ${todaySign.ko} (${todaySign.name})</div>
            <div class="interp-text">
                오늘의 에너지: <strong>톤 ${todayTz.num} "${todayTone.name}"</strong> + <strong>${todaySign.ko} "${todaySign.meaning}"</strong><br><br>
                ${isSameSign ? '🌟 <strong>오늘은 당신의 사인과 같은 날입니다!</strong> 에너지가 극대화되는 특별한 날. 중요한 결정이나 새로운 시작에 좋습니다.' :
                  bestMatch.includes(todayTz.sign) ? '✨ 오늘의 에너지가 당신의 사인과 조화롭습니다. 좋은 흐름을 타는 날.' :
                  '오늘의 에너지를 받아들이고 ' + todaySign.ko + '의 가르침에 주의를 기울여보세요.'}
            </div>
        </div>
    `;

    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
}

initForm();
document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>
