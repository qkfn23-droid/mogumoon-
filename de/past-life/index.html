function reduceNum(n) {
    while (n > 9 && n !== 11 && n !== 22) {
        n = String(n).split("").reduce((s, d) => s + Number(d), 0);
    }
    return n;
}

function seededRand(seed) {
    let s = seed;
    for (let i = 0; i < 10; i++) s = (s * 16807) % 2147483647;
    return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

                <div class="karma-bar"><div class="karma-fill" style="width:${karmaScore}%;background:linear-gradient(90deg,#b8942a,#d4a853);"></div></div>
                <div class="karma-labels"><span>Unveroest</span><span>Vollstaendig geloest</span></div>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">⭐ Talente aus deinem frueheren Leben</div>
            <div class="reading-text"><strong>${pl.talent}</strong><br><br>Diese Talente schlummern auch in deinem aktuellen Leben in dir. Wenn du eine unerklarliche Anziehung spuerst oder etwas beim ersten Mal vertraut wirkt, ist das eine Erinnerung aus deinem frueheren Leben.</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">😨 Trauma aus dem frueheren Leben</div>
            <div class="reading-text"><strong>${pl.fear}</strong><br><br>Wenn es in deinem aktuellen Leben etwas gibt, das dich ohne erkennbaren Grund aengstigt, koennte es aus Erfahrungen deines frueheren Lebens stammen.</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💀 Der Tod in deinem frueheren Leben</div>
            <div class="reading-text">
                In deinem frueheren Leben bist du mit <strong>${deathAge} Jahren</strong> gestorben.<br>
                Todesursache: <strong>${death}</strong>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">📖 Die Lektion deines frueheren Lebens</div>
            <div class="reading-text">Die wichtigste Botschaft, die dein frueheres Ich dir mitteilen moechte:<br><br><strong>"${lesson}"</strong></div>
        </div>

        <button class="retry-btn" onclick="document.getElementById('resultSection').style.display='none';window.scrollTo({top:0,behavior:'smooth'});">🔄 Erneut Testen</button>
    `;
    section.style.display = "block";
    section.scrollIntoView({behavior:"smooth"});
}

// Selektoren initialisieren
(function() {
    const yEl = document.getElementById("birthYear");
    const mEl = document.getElementById("birthMonth");
    const dEl = document.getElementById("birthDay");
    const now = new Date();

    yEl.innerHTML = "<option value=\"\">Jahr</option>";
    for (let y = now.getFullYear(); y >= 1920; y--) yEl.innerHTML += `<option value="${y}">${y}</option>`;

    mEl.innerHTML = "<option value=\"\">Monat</option>";
    for (let m = 1; m <= 12; m++) mEl.innerHTML += `<option value="${m}">${m}</option>`;

    function updateDays() {
        const y = parseInt(yEl.value) || 2000;
        const m = parseInt(mEl.value) || 1;
        const maxD = new Date(y, m, 0).getDate();
        const cur = parseInt(dEl.value);
        dEl.innerHTML = "<option value=\"\">Tag</option>";
        for (let d = 1; d <= maxD; d++) dEl.innerHTML += `<option value="${d}"${d===cur?" selected":""}>${d}</option>`;
    }
    yEl.onchange = updateDays;
    mEl.onchange = updateDays;
    updateDays();
})();
</script>
