<script>
function getMoonPhase(year, month, day) {
    if (month <= 2) { year--; month += 12; }
    const A = Math.floor(year / 100);
    const B = 2 - A + Math.floor(A / 4);
    const JD = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
    const daysSinceNew = JD - 2451550.1;
    const newMoons = daysSinceNew / 29.530588853;
    const phase = newMoons - Math.floor(newMoons);
    return phase;
}

function getPhaseInfo(phase) {
    const illumination = Math.round(Math.abs(Math.cos(phase * 2 * Math.PI) * -0.5 + 0.5) * 100);
    const lunarDay = Math.round(phase * 29.5) + 1;

    if (phase < 0.0625) return {name:"Neumond",emoji:"🌑",idx:0,illumination,lunarDay,
        meaning:"Die Energie eines <strong>neuen Anfangs</strong> erfüllt die Luft. Mit dem vollständig verborgenen Mond ist dies die ideale Zeit, um Samen zu pflanzen, neue Absichten zu setzen und Ziele zu formulieren. Eine Zeit der Introspektion — plane in Stille und lass die Keime von innen wachsen.",
        good:["Neue Projekte starten","Ziele setzen","Meditation und Reflexion","Tagebuch schreiben","Digitale Auszeit"],
        bad:["Grosse oeffentliche Praesentation","Endgueltige Entscheidungen","Uebertriebene soziale Aktivitaet"]};
    if (phase < 0.1875) return {name:"Zunehmende Sichel",emoji:"🌒",idx:1,illumination,lunarDay,
        meaning:"Die gepflanzten Samen beginnen zu <strong>keimen</strong>. Es ist Zeit, von der Absicht zur Tat zu schreiten. Noch klein und zart, doch mit bestaendiger Energie wird es wachsen. Wage den ersten Schritt — er muss nicht perfekt sein.",
        good:["Erste Schritte unternehmen","Persoenlichkeitsentwicklung beginnen","Neue Gewohnheiten aufbauen","Mut fassen"],
        bad:["Voreilige Urteile","Perfektionismus","Grosse Risiken eingehen"]};
    if (phase < 0.3125) return {name:"Erstes Viertel",emoji:"🌓",idx:2,illumination,lunarDay,
        meaning:"Die Zeit der <strong>Entscheidung und Tat</strong>. Der Halbmond symbolisiert das Gleichgewicht zwischen Licht und Schatten — ein Augenblick der Wahl. Hindernisse koennen auftauchen, doch sie sind eine Pruefung. Entscheide mutig und schreite voran. Weiche der Herausforderung nicht aus.",
        good:["Wichtige Entscheidungen treffen","Herausforderungen annehmen","Probleme angehen","Aktiv handeln"],
        bad:["Unentschlossenheit","Aufgeben","Verantwortung meiden"]};
    if (phase < 0.4375) return {name:"Zunehmender Mond",emoji:"🌔",idx:3,illumination,lunarDay,
        meaning:"Die Zeit des <strong>Verfeinerns und Vollendets</strong>. Wie der fast volle Mond naherst du dich deinem Ziel. Pruefe die Details und schliesse ab, was du begonnen hast. Mit Geduld und Einsatz bis zum Ende wirst du beim Vollmond Fruechte ernten.",
        good:["Letzte Anpassungen","Abschlussarbeiten","Geduld bewahren","Feedback einarbeiten"],
        bad:["Etwas Neues beginnen","Richtung aendern","Ueberstuerzt handeln"]};
    if (phase < 0.5625) return {name:"Vollmond",emoji:"🌕",idx:4,illumination,lunarDay,
        meaning:"Die Energie des Mondes erreicht ihren <strong>Hoehepunkt</strong>! Emotionen verstaerken sich, die Intuition schaerft sich, und Verborgenes tritt ans Licht. Es ist Erntezeit — deine Bemuehungen tragen Fruechte. Feiere und sei dankbar. Wuensche unter dem Vollmond haben eine besondere Kraft.",
        good:["Feiern und danken","Wuensche aeussern","Der Intuition folgen","Ergebnisse ernten","Liebe gestehen"],
        bad:["Emotionale Entscheidungen","Impulsive Handlungen","Grosse Streitigkeiten"]};
    if (phase < 0.6875) return {name:"Abnehmender Mond",emoji:"🌖",idx:5,illumination,lunarDay,
        meaning:"Eine Zeit des <strong>Teilens und der Dankbarkeit</strong>. So wie das Licht des Vollmondes allmahlich abnimmt, gib das Empfangene zurueck und teile es. Ordne und vermittle das Gelernte. Die innere Weisheit vertieft sich in dieser Phase.",
        good:["Teilen und helfen","Lehren und mentorieren","Dankbarkeit ausdruecken","Ordnen und nachdenken"],
        bad:["Neue Anfaenge","Gierig sein"]};
    if (phase < 0.8125) return {name:"Letztes Viertel",emoji:"🌗",idx:6,illumination,lunarDay,
        meaning:"Zeit des <strong>Loslassens und Aufraeumens</strong>. Trenne dich von dem, was du nicht mehr brauchst — schlechte Gewohnheiten, toxische Beziehungen, alte Lasten. Damit Neues eintreten kann, muss Platz geschaffen werden. Vergib und lass los.",
        good:["Ordnen und aufraeumen","Schlechte Gewohnheiten ablegen","Vergeben und versoeehnen","Unnoeiges weggeben"],
        bad:["Neue Projekte","Festhalten","In der Vergangenheit leben"]};
    if (phase < 0.9375) return {name:"Abnehmende Sichel",emoji:"🌘",idx:7,illumination,lunarDay,
        meaning:"Der Mond ist kurz vor dem Verschwinden — eine Zeit der <strong>Ruhe und Erholung</strong>. Dass die Energie nachlasst ist ein natuerlicher Teil des Zyklus. Ueberfordere dich nicht; ruh dich genuegend aus. Achte auf Meditation, Traeume und Intuition. Bald kommt der neue Mond.",
        good:["Genuegend ruhen","Meditation und Gebet","Traumtagebuch","Energie aufladen"],
        bad:["Uebertriebene Aktivitaet","Wichtige Anfaenge","Uebertriebene Arbeit"]};
    return {name:"Neumond",emoji:"🌑",idx:0,illumination:0,lunarDay:1,
        meaning:"Die Energie eines <strong>neuen Anfangs</strong> umgibt dich. Plane in Stille.",
        good:["Neue Projekte starten","Ziele setzen","Meditation"],
        bad:["Grosse Praesentationen","Endgueltige Entscheidungen"]};
}

function findNextPhase(targetPhase, startDate) {
    const d = new Date(startDate);
    for (let i = 1; i <= 35; i++) {
        d.setDate(d.getDate() + 1);
        const p = getMoonPhase(d.getFullYear(), d.getMonth() + 1, d.getDate());
        if (targetPhase === "full" && p >= 0.47 && p <= 0.53) return d;
        if (targetPhase === "new" && (p <= 0.03 || p >= 0.97)) return d;
    }
    return null;
}

function drawMoon(phase) {
    const r = 90;
    const cx = 100, cy = 100;
    let d;
    const ill = phase <= 0.5 ? phase * 2 : (1 - phase) * 2;
    const sweep = phase <= 0.5 ? 1 : 0;
    const bulge = (ill - 0.5) * 2 * r;

    if (phase < 0.01 || phase > 0.99) {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1a1a2e" stroke="#333" stroke-width="1"/>`;
    }
    if (phase > 0.49 && phase < 0.51) {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#e8e4d4" />
                <circle cx="${cx-25}" cy="${cy-20}" r="12" fill="rgba(200,195,180,0.5)"/>
                <circle cx="${cx+20}" cy="${cy+15}" r="8" fill="rgba(200,195,180,0.4)"/>
                <circle cx="${cx+5}" cy="${cy-35}" r="6" fill="rgba(200,195,180,0.3)"/>`;
    }

    const lightSide = phase <= 0.5 ? "right" : "left";
    const darkFill = "#1a1a2e";
    const lightFill = "#e8e4d4";

    if (lightSide === "right") {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${lightFill}"/>
                <path d="M${cx},${cy-r} A${r},${r} 0 0,0 ${cx},${cy+r} A${Math.abs(bulge)},${r} 0 0,${bulge > 0 ? 0 : 1} ${cx},${cy-r}" fill="${darkFill}"/>`;
    } else {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${lightFill}"/>
                <path d="M${cx},${cy-r} A${r},${r} 0 0,1 ${cx},${cy+r} A${Math.abs(bulge)},${r} 0 0,${bulge > 0 ? 1 : 0} ${cx},${cy-r}" fill="${darkFill}"/>`;
    }
}

const now = new Date();
const phase = getMoonPhase(now.getFullYear(), now.getMonth() + 1, now.getDate());
const info = getPhaseInfo(phase);
const nextFull = findNextPhase("full", now);
const nextNew = findNextPhase("new", now);

const PHASES = [
    {emoji:"🌑",name:"Neumond"},{emoji:"🌒",name:"Zunehmende Sichel"},{emoji:"🌓",name:"Erstes Viertel"},
    {emoji:"🌔",name:"Zunehmender Mond"},{emoji:"🌕",name:"Vollmond"},{emoji:"🌖",name:"Abnehmender Mond"},
    {emoji:"🌗",name:"Letztes Viertel"},{emoji:"🌘",name:"Abnehmende Sichel"}
];

function formatDate(d) {
    if (!d) return "-";
    return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`;
}

function daysUntil(d) {
    if (!d) return "-";
    const diff = Math.ceil((d - now) / (1000*60*60*24));
    return `in ${diff} Tagen`;
}

const dayNames = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const todayStr = `${dayNames[now.getDay()]}, ${now.getDate()}.${now.getMonth()+1}.${now.getFullYear()}`;

document.getElementById("moonContent").innerHTML = `
    <div class="moon-display">
        <div class="moon-date">${todayStr}</div>
        <div class="moon-wrapper">
            <div class="moon-glow"></div>
            <svg class="moon-svg" viewBox="0 0 200 200">${drawMoon(phase)}</svg>
        </div>
        <div class="moon-name"><span class="moon-emoji">${info.emoji}</span>${info.name}</div>
        <div class="moon-sub">Ca. Mondtag ${info.lunarDay}</div>
        <div class="moon-illumination">Beleuchtung: ${info.illumination}%</div>
    </div>

    <div class="phase-timeline">
        ${PHASES.map((p, i) => `<div class="phase-item ${i === info.idx ? "active" : ""}">
            <div class="ph-emoji">${p.emoji}</div>
            <div class="ph-name">${p.name}</div>
        </div>`).join("")}
    </div>

    <div class="info-grid">
        <div class="info-card">
            <div class="info-label">Naechster Vollmond 🌕</div>
            <div class="info-value">${formatDate(nextFull)}</div>
            <div class="info-sub">${daysUntil(nextFull)}</div>
        </div>
        <div class="info-card">
            <div class="info-label">Naechster Neumond 🌑</div>
            <div class="info-value">${formatDate(nextNew)}</div>
            <div class="info-sub">${daysUntil(nextNew)}</div>
        </div>
        <div class="info-card">
            <div class="info-label">Mondzyklus</div>
            <div class="info-value">29,5 Tage</div>
            <div class="info-sub">Synodischer Zyklus</div>
        </div>
        <div class="info-card">
            <div class="info-label">Aktuelle Position</div>
            <div class="info-value">${Math.round(phase * 100)}%</div>
            <div class="info-sub">Zyklusfortschritt</div>
        </div>
    </div>

    <div class="reading-card">
        <div class="reading-title">🌙 Die Botschaft des heutigen Mondes</div>
        <div class="reading-text">${info.meaning}</div>
    </div>

    <div class="reading-card">
        <div class="reading-title">✅ Gueinstige Aktivitaeten vs ❌ Zu vermeidende Aktivitaeten</div>
        <div class="activity-grid">
            ${info.good.map(g => `<div class="activity-item activity-good">✅ ${g}</div>`).join("")}
            ${info.bad.map(b => `<div class="activity-item activity-bad">❌ ${b}</div>`).join("")}
        </div>
    </div>

    <div class="reading-card">
        <div class="reading-title">📖 Die 8 Mondphasen</div>
        <div class="reading-text">
            <strong>🌑 Neumond</strong> — Neue Anfaenge, Absichten setzen<br>
            <strong>🌒 Zunehmende Sichel</strong> — Samen keimen, erste Schritte<br>
            <strong>🌓 Erstes Viertel</strong> — Entscheidung, Herausforderung, Hindernisse ueberwinden<br>
            <strong>🌔 Zunehmender Mond</strong> — Verfeinern, kurz vor der Vollendung<br>
            <strong>🌕 Vollmond</strong> — Hoehepunkt, Ernte, intensive Emotionen<br>
            <strong>🌖 Abnehmender Mond</strong> — Teilen, Dankbarkeit, Ordnen<br>
            <strong>🌗 Letztes Viertel</strong> — Loslassen, bereinigen, vergeben<br>
            <strong>🌘 Abnehmende Sichel</strong> — Ruhe, Erholung, Introspektion
        </div>
    </div>
`;
</script>
