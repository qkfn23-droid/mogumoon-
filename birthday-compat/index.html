<script>
function reduceNum(n) {
    while (n > 9 && n !== 11 && n !== 22 && n !== 33) {
        n = String(n).split('').reduce((s, d) => s + Number(d), 0);
    }
    return n;
}

function lifePathNumber(y, m, d) {
    return reduceNum(reduceNum(y) + reduceNum(m) + reduceNum(d));
}

const NUM_TRAITS = {
    1: {name:"리더·개척자", element:"불", keyword:"독립, 야망, 창의성"},
    2: {name:"조화·외교관", element:"물", keyword:"협력, 감수성, 직감"},
    3: {name:"표현·창작자", element:"불", keyword:"사교성, 낙관, 예술"},
    4: {name:"건설·실용가", element:"흙", keyword:"성실, 안정, 체계"},
    5: {name:"자유·모험가", element:"바람", keyword:"변화, 호기심, 적응력"},
    6: {name:"책임·보호자", element:"흙", keyword:"가족, 돌봄, 정의"},
    7: {name:"탐구·분석가", element:"바람", keyword:"지혜, 영성, 고독"},
    8: {name:"권력·성취자", element:"흙", keyword:"야망, 비즈니스, 리더십"},
    9: {name:"이상·인도주의자", element:"물", keyword:"봉사, 공감, 예술"},
    11: {name:"영감·직관 마스터", element:"에테르", keyword:"직관, 영성, 카리스마"},
    22: {name:"건설·비전 마스터", element:"에테르", keyword:"비전, 현실화, 대규모"},
    33: {name:"치유·사랑 마스터", element:"에테르", keyword:"무조건적 사랑, 치유, 헌신"}
};

// 운명수 조합별 궁합 데이터
const COMPAT_DATA = {
    same: {
        score: 78,
        love: "같은 운명수끼리는 서로를 거울처럼 이해합니다. 장점도 단점도 똑같기에 최고의 이해자이면서 동시에 가장 날카로운 비평가가 됩니다.",
        friend: "영혼의 쌍둥이 같은 우정. 말하지 않아도 통하지만, 같은 고집이 부딪힐 때 타협이 어렵습니다.",
        tip: "서로의 거울이라는 것을 인정하세요. 상대에게서 불편한 점은 사실 자기 자신의 모습입니다."
    },
    complementary: {
        score: 88,
        love: "서로에게 부족한 부분을 완벽하게 채워주는 환상의 조합! 함께 있으면 완전체가 됩니다. 다름이 매력이 되는 관계.",
        friend: "각자의 강점이 다르기에 팀으로서 무적. 서로의 세계를 넓혀주는 친구.",
        tip: "다름을 비판하지 말고 감사하세요. 당신에게 없는 것을 상대가 가져다줍니다."
    },
    challenging: {
        score: 52,
        love: "쉽지 않지만 성장을 주는 관계. 마찰이 있을 수 있지만, 그 마찰이 둘 다 더 나은 사람으로 만듭니다.",
        friend: "관점이 완전히 달라서 이해하기 어렵지만, 노력하면 가장 많이 배우는 관계.",
        tip: "인내심이 핵심입니다. 이 관계는 쉬운 길이 아니라 성장의 길입니다."
    },
    harmonious: {
        score: 82,
        love: "자연스럽게 조화를 이루는 관계. 편안하고 안정적이며, 함께 있으면 마음이 평화로워집니다.",
        friend: "부담 없이 오래 가는 우정. 서로에게 안식처가 되어줍니다.",
        tip: "안정 속에서도 성장을 추구하세요. 너무 편안하면 정체될 수 있습니다."
    },
    passionate: {
        score: 75,
        love: "불꽃 튀는 열정적 관계! 끌어당기는 힘이 강하지만, 가끔 폭풍 같은 싸움도. 지루할 틈이 없는 사랑.",
        friend: "함께하면 에너지가 폭발. 모험과 도전을 같이 하면 최고.",
        tip: "열정을 건강하게 유지하세요. 불꽃이 모든 것을 태우지 않도록 한 박자 쉬어가세요."
    }
};

function getCompatType(n1, n2) {
    if (n1 === n2) return 'same';
    const sum = n1 + n2;
    const diff = Math.abs(n1 - n2);
    // 보완적 조합
    if ((n1===1&&n2===2)||(n1===2&&n2===1)||(n1===3&&n2===6)||(n1===6&&n2===3)||
        (n1===4&&n2===5)||(n1===5&&n2===4)||(n1===7&&n2===9)||(n1===9&&n2===7)||
        (n1===1&&n2===9)||(n1===9&&n2===1)) return 'complementary';
    // 조화로운 조합
    if (diff <= 2 || sum === 10 || (n1===2&&n2===6)||(n1===6&&n2===2)||
        (n1===3&&n2===9)||(n1===9&&n2===3)) return 'harmonious';
    // 열정적 조합
    if ((n1===1&&n2===5)||(n1===5&&n2===1)||(n1===3&&n2===5)||(n1===5&&n2===3)||
        (n1===1&&n2===8)||(n1===8&&n2===1)) return 'passionate';
    // 도전적 조합
    if (diff >= 5 || (n1===4&&n2===7)||(n1===7&&n2===4)||
        (n1===8&&n2===2)||(n1===2&&n2===8)) return 'challenging';
    return 'harmonious';
}

function seededRand(seed) {
    let s = seed;
    for (let i = 0; i < 10; i++) s = (s * 16807) % 2147483647;
    return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function checkCompat() {
    const y1=parseInt(document.getElementById('y1').value), m1=parseInt(document.getElementById('m1').value), d1=parseInt(document.getElementById('d1').value);
    const y2=parseInt(document.getElementById('y2').value), m2=parseInt(document.getElementById('m2').value), d2=parseInt(document.getElementById('d2').value);
    if (!y1||!m1||!d1||!y2||!m2||!d2) return alert('두 사람의 생년월일을 모두 선택해주세요!');

    const name1 = document.getElementById('name1').value.trim() || '나';
    const name2 = document.getElementById('name2').value.trim() || '상대';

    const lp1 = lifePathNumber(y1, m1, d1);
    const lp2 = lifePathNumber(y2, m2, d2);
    const t1 = NUM_TRAITS[lp1] || NUM_TRAITS[lp1 > 9 ? reduceNum(lp1) : lp1];
    const t2 = NUM_TRAITS[lp2] || NUM_TRAITS[lp2 > 9 ? reduceNum(lp2) : lp2];

    const compatType = getCompatType(lp1 > 9 ? reduceNum(lp1) : lp1, lp2 > 9 ? reduceNum(lp2) : lp2);
    const data = COMPAT_DATA[compatType];

    const seed = y1*10000+m1*100+d1 + y2*10000+m2*100+d2;
    const rand = seededRand(seed);

    const total = Math.min(99, Math.max(25, data.score + Math.floor(rand()*16) - 8));
    const love = Math.min(99, Math.max(20, total + Math.floor(rand()*20) - 10));
    const friend = Math.min(99, Math.max(20, total + Math.floor(rand()*20) - 10));
    const comm = Math.min(99, Math.max(20, total + Math.floor(rand()*16) - 8));
    const destiny = Math.min(99, Math.max(20, total + Math.floor(rand()*24) - 12));

    const scoreColor = total >= 80 ? '#e84393' : total >= 60 ? '#f39c12' : total >= 40 ? '#3498db' : '#e74c3c';
    const scoreText = total >= 90 ? '운명적 궁합!' : total >= 80 ? '환상의 궁합!' : total >= 70 ? '아주 좋은 궁합' : total >= 60 ? '좋은 궁합' : total >= 50 ? '보통 궁합' : total >= 40 ? '노력이 필요한 궁합' : '도전적인 궁합';

    // 운명수 조합 해석
    const numAnalysis = lp1 === lp2
        ? `두 사람 모두 운명수 <strong>${lp1}</strong>(${t1.name})입니다. 같은 영혼의 주파수를 가진 두 사람 — 서로를 완벽히 이해하지만, 같은 약점도 증폭됩니다.`
        : `<strong>${name1}</strong>의 운명수는 <strong>${lp1}</strong>(${t1.name})이고, <strong>${name2}</strong>의 운명수는 <strong>${lp2}</strong>(${t2.name})입니다. ${t1.element}의 에너지와 ${t2.element}의 에너지가 만나 ${compatType === 'complementary' ? '서로를 완벽히 보완합니다' : compatType === 'harmonious' ? '자연스러운 조화를 이룹니다' : compatType === 'passionate' ? '강렬한 끌림을 만듭니다' : compatType === 'challenging' ? '성장의 기회를 줍니다' : '독특한 역학을 만듭니다'}.`;

    const section = document.getElementById('resultSection');
    section.innerHTML = `
        <div class="compat-header">
            <div class="compat-names">${name1} 💕 ${name2}</div>
            <div class="compat-nums">운명수 ${lp1} (${t1.name}) × 운명수 ${lp2} (${t2.name})</div>
        </div>

        <div class="score-display">
            <div class="score-circle" style="border-color:${scoreColor};background:rgba(232,67,147,0.06);">
                <div class="score-num" style="color:${scoreColor};">${total}%</div>
                <div class="score-label">${scoreText}</div>
            </div>
        </div>

        <div class="score-bars">
            <div class="score-bar-item">
                <div class="sb-label">💕 연애 궁합</div>
                <div class="sb-bar"><div class="sb-fill" style="width:${love}%;background:#e84393;"></div></div>
                <div class="sb-value" style="color:#e84393;">${love}%</div>
            </div>
            <div class="score-bar-item">
                <div class="sb-label">👫 우정 궁합</div>
                <div class="sb-bar"><div class="sb-fill" style="width:${friend}%;background:#3498db;"></div></div>
                <div class="sb-value" style="color:#3498db;">${friend}%</div>
            </div>
            <div class="score-bar-item">
                <div class="sb-label">💬 소통 궁합</div>
                <div class="sb-bar"><div class="sb-fill" style="width:${comm}%;background:#2ecc71;"></div></div>
                <div class="sb-value" style="color:#2ecc71;">${comm}%</div>
            </div>
            <div class="score-bar-item">
                <div class="sb-label">🔮 운명 궁합</div>
                <div class="sb-bar"><div class="sb-fill" style="width:${destiny}%;background:#9b59b6;"></div></div>
                <div class="sb-value" style="color:#9b59b6;">${destiny}%</div>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">🔢 운명수 분석</div>
            <div class="reading-text">${numAnalysis}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💕 연애 궁합</div>
            <div class="reading-text">${data.love}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">👫 우정 궁합</div>
            <div class="reading-text">${data.friend}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💡 관계 조언</div>
            <div class="reading-text"><strong>${data.tip}</strong></div>
        </div>

        <div class="reading-card">
            <div class="reading-title">📊 두 사람의 프로필</div>
            <div class="reading-text">
                <strong>${name1}</strong> (${y1}.${m1}.${d1})<br>
                운명수: <strong>${lp1}</strong> · ${t1.name} · ${t1.element} · ${t1.keyword}<br><br>
                <strong>${name2}</strong> (${y2}.${m2}.${d2})<br>
                운명수: <strong>${lp2}</strong> · ${t2.name} · ${t2.element} · ${t2.keyword}

        </div>

        <button class="retry-btn" onclick="document.getElementById('resultSection').style.display='none';window.scrollTo({top:0,behavior:'smooth'});">🔄 다른 궁합 보기</button>
    `;
    section.style.display = 'block';
    section.scrollIntoView({behavior:'smooth'});
}

// select 초기화
(function() {
    const now = new Date();
    ['1','2'].forEach(n => {
        const yEl = document.getElementById('y'+n);
        const mEl = document.getElementById('m'+n);
        const dEl = document.getElementById('d'+n);

        yEl.innerHTML = '<option value="">년</option>';
        for (let y = now.getFullYear(); y >= 1920; y--) yEl.innerHTML += `<option value="${y}">${y}년</option>`;

        mEl.innerHTML = '<option value="">월</option>';
        for (let m = 1; m <= 12; m++) mEl.innerHTML += `<option value="${m}">${m}월</option>`;

        function updateDays() {
            const y = parseInt(yEl.value) || 2000;
            const m = parseInt(mEl.value) || 1;
            const maxD = new Date(y, m, 0).getDate();
            const cur = parseInt(dEl.value);
            dEl.innerHTML = '<option value="">일</option>';
            for (let d = 1; d <= maxD; d++) dEl.innerHTML += `<option value="${d}"${d===cur?' selected':''}>${d}일</option>`;
        }
        yEl.onchange = updateDays;
        mEl.onchange = updateDays;
        updateDays();
    });
})();
</script>
