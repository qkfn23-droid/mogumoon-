        health: '피부, 호흡기에 주의. 외모 관리에 신경 쓰는 것이 건강에도 도움.' },
    '천량': { glyph: '🛡️', element: '토', yin: false, rank: '음성',
        personality: '천량성은 그림자 보호의 별입니다. 장수와 복덕의 별이며, 나이 든 귀인의 도움을 많이 받습니다. 보수적이고 전통적이며, 의리를 중시합니다. 공직이나 의료 분야에 적합.',

        wealth: '안정적이지만 느린 재물 축적. 나이 들수록 풍요로워집니다.',
        health: '장수의 별! 기본 체력이 좋으며 나이 들어도 건강합니다. 위장 관리만 주의.' },
    '칠살': { glyph: '⚔️', element: '금화', yin: false, rank: '장성',
        personality: '칠살성은 장군의 별입니다. 강한 의지와 결단력, 그리고 파괴와 재건의 힘을 가졌습니다. 인생의 굴곡이 크지만 위기에서 더 강해집니다. 독립적이고 반항적이며 권위에 도전합니다.',

    '파군': { glyph: '💥', element: '수', yin: false, rank: '파괴',
        personality: '파군성은 파괴와 혁신의 별입니다. 기존 질서를 깨뜨리고 새로운 것을 만드는 혁명가. 소비가 크고 변동이 많지만, 파괴 후 반드시 재건합니다. 자유롭고 반항적.',

        health: '사고, 부상에 주의. 신장, 생식기에 주의. 격렬한 운동으로 에너지를 소모하세요.' }

const STAR_NAMES = ['자미','천기','태양','무곡','천동','염정','천부','태음','탐랑','거문','천상','천량','칠살','파군'];

// 12궁 이름
const PALACES = ['명궁','형제궁','부처궁','자녀궁','재백궁','질액궁','천이궁','교우궁','관록궁','전택궁','복덕궁','부모궁'];
const PALACE_DESC = ['나 자신','형제자매','배우자','자녀','재물','건강','이동/해외','친구/인맥','직업/명성','부동산/가정','복과 덕','부모/윗사람'];

// 남인도 스타일 그리드 매핑
const GRID_MAP = [
    [11,0,1,2],
    [10,-1,-1,3],
    [9,-1,-1,4],
    [8,7,6,5]
];

function initForm() {
    const y = document.getElementById('birthYear'), m = document.getElementById('birthMonth'), d = document.getElementById('birthDay');
    const h = document.getElementById('birthHour');
    for (let i = 2025; i >= 1940; i--) { const o = document.createElement('option'); o.value = i; o.textContent = i + '년'; if (i === 1993) o.selected = true; y.appendChild(o); }
    for (let i = 1; i <= 12; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i + '월'; if (i === 7) o.selected = true; m.appendChild(o); }
    for (let i = 1; i <= 31; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i + '일'; if (i === 25) o.selected = true; d.appendChild(o); }
    for (let i = 0; i < 12; i++) {
        const labels = ['자시(23~1)','축시(1~3)','인시(3~5)','묘시(5~7)','진시(7~9)','사시(9~11)','오시(11~13)','미시(13~15)','신시(15~17)','유시(17~19)','술시(19~21)','해시(21~23)'];
        const o = document.createElement('option'); o.value = i; o.textContent = labels[i]; if (i === 5) o.selected = true; h.appendChild(o);
    }
}

function toggleTime() {
    const disabled = document.getElementById('birthTimeUnknown').value === 'unknown';
    ['birthAmpm','birthHour'].forEach(id => {
        document.getElementById(id).disabled = disabled;
        document.getElementById(id).style.opacity = disabled ? '0.4' : '1';
    });
}

// 간략화된 자미두수 계산 (명궁 주성 배치)
function calculate() {
    const year = parseInt(document.getElementById('birthYear').value);
    const month = parseInt(document.getElementById('birthMonth').value);
    const day = parseInt(document.getElementById('birthDay').value);
    const hourIdx = document.getElementById('birthTimeUnknown').value === 'unknown' ? 6 : parseInt(document.getElementById('birthHour').value);
    const gender = document.getElementById('gender').value;

    // 명궁 위치 계산 (간략화)
    const mingIdx = (14 - month + hourIdx) % 12;

    // 주성 배치 (간략화 — 자미성 위치 기반)
    const ziWeiPos = (day + 2) % 12; // 간략화된 자미성 위치

    // 각 궁에 별 배치
    const palaceStars = [];
    for (let i = 0; i < 12; i++) palaceStars.push([]);

    // 14주성 배치 (간략화)
    const starPositions = [];
    STAR_NAMES.forEach((name, idx) => {
        const pos = (ziWeiPos + idx * 2 + Math.floor(idx / 3)) % 12;
        starPositions.push({ name, pos });
        palaceStars[pos].push(name);
    });

    // 명궁의 주성 찾기
    const mingStars = palaceStars[mingIdx];
    const mainStar = mingStars.length > 0 ? mingStars[0] : STAR_NAMES[(mingIdx + day) % 14];
    const starData = MAIN_STARS[mainStar];

    // 오행
    const WUXING = ['금','수','목','화','토'];
    const wuxing = WUXING[(year + month) % 5];

    // 명궁 천간
    const TIANGAN = ['갑','을','병','정','무','기','경','신','임','계'];
    const tiangan = TIANGAN[(year - 4) % 10];

    // 명궁 지지
    const DIZHI = ['자','축','인','묘','진','사','오','미','신','유','술','해'];
    const mingDizhi = DIZHI[mingIdx];

    // Main Star Card
    document.getElementById('mainStarWrap').innerHTML = `
        <div class="main-star-card">
            <span class="main-star-glyph">${starData.glyph}</span>
            <div class="main-star-name">${mainStar}성 (${starData.rank})</div>
            <div class="main-star-sub">오행: ${starData.element} | 명궁: ${DIZHI[mingIdx]}궁</div>
        </div>
    `;

    // Palace Grid
    const grid = document.getElementById('palaceGrid');
    grid.innerHTML = '';
    for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 4; col++) {
            const cell = document.createElement('div');
            const pIdx = GRID_MAP[row][col];
            if (pIdx === -1) {
                cell.className = 'palace-cell empty';
                cell.innerHTML = row === 1 && col === 1 ? '<div style="color:#e84393;font-size:10px;">紫微<br>斗數</div>' : '';
            } else {
                cell.className = 'palace-cell' + (pIdx === mingIdx ? ' ming' : '');
                cell.innerHTML = `<div class="palace-name">${PALACES[pIdx]}</div><div style="color:#666;font-size:9px;">${PALACE_DESC[pIdx]}</div>`;
                if (palaceStars[pIdx].length > 0) {
                    cell.innerHTML += `<div class="palace-star">${palaceStars[pIdx].join(' ')}</div>`;
                }
            }
            grid.appendChild(cell);
        }
    }

    // Info Grid
    document.getElementById('infoGrid').innerHTML = `
        <div class="info-item"><div class="info-label">명궁 주성</div><div class="info-value">${starData.glyph} ${mainStar}성</div><div class="info-desc">${starData.rank}</div></div>
        <div class="info-item"><div class="info-label">명궁 위치</div><div class="info-value">${DIZHI[mingIdx]}궁 (${tiangan}${mingDizhi})</div></div>
        <div class="info-item"><div class="info-label">오행</div><div class="info-value">${wuxing}명</div></div>
        <div class="info-item"><div class="info-label">성별/음양</div><div class="info-value">${gender === 'm' ? '남성 (양)' : '여성 (음)'}</div></div>
    `;

    // Main Interpretation
    document.getElementById('mainInterpWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">${starData.glyph} ${mainStar}성 — "${starData.rank}"</div>
            <div class="interp-text">${starData.personality}</div>
        </div>
    `;

    // Spouse (부처궁 = 명궁 + 2)
    const spouseIdx = (mingIdx + 2) % 12;
    const spouseStars = palaceStars[spouseIdx];
    const spouseStar = spouseStars.length > 0 ? spouseStars[0] : null;
    document.getElementById('spouseWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">💕 부처궁: ${DIZHI[spouseIdx]}궁 ${spouseStar ? '— ' + spouseStar + '성' : ''}</div>
            <div class="interp-text">${spouseStar && MAIN_STARS[spouseStar] ? MAIN_STARS[spouseStar].love : '부처궁에 주성이 없어 배우자는 평범하고 안정적인 성격입니다. 큰 파란 없이 조용한 결혼 생활.'}<br><br><strong>명궁 ${mainStar}성의 결혼관:</strong> ${starData.love}</div>
        </div>
    `;

    // Wealth (재백궁 = 명궁 + 4)
    const wealthIdx = (mingIdx + 4) % 12;
    const wealthStars = palaceStars[wealthIdx];
    const wealthStar = wealthStars.length > 0 ? wealthStars[0] : null;
    document.getElementById('wealthWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">💰 재백궁: ${DIZHI[wealthIdx]}궁 ${wealthStar ? '— ' + wealthStar + '성' : ''}</div>
            <div class="interp-text">${wealthStar && MAIN_STARS[wealthStar] ? MAIN_STARS[wealthStar].wealth : '재백궁에 주성이 없어 재물은 안정적이지만 특별한 변동 없이 꾸준합니다.'}<br><br><strong>명궁 ${mainStar}성의 재물관:</strong> ${starData.wealth}</div>
        </div>
    `;

    // Career (관록궁 = 명궁 + 8)
    const careerIdx = (mingIdx + 8) % 12;
    const careerStars = palaceStars[careerIdx];
    const careerStar = careerStars.length > 0 ? careerStars[0] : null;
    document.getElementById('careerWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">💼 관록궁: ${DIZHI[careerIdx]}궁 ${careerStar ? '— ' + careerStar + '성' : ''}</div>
            <div class="interp-text">${careerStar && MAIN_STARS[careerStar] ? MAIN_STARS[careerStar].career : '관록궁에 주성이 없어 직업은 안정적이고 평범합니다. 조직 내에서 꾸준히 성장.'}<br><br><strong>명궁 ${mainStar}성의 직업관:</strong> ${starData.career}</div>
        </div>
    `;

    // Health (질액궁 = 명궁 + 5)
    const healthIdx = (mingIdx + 5) % 12;
    document.getElementById('healthWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">🏥 질액궁: ${DIZHI[healthIdx]}궁</div>
            <div class="interp-text"><strong>명궁 ${mainStar}성의 건강:</strong> ${starData.health}</div>
        </div>
    `;

    // 대운 (10년 주기)
    let dashaHtml = '<div style="background:#0d0515;border:1px solid #3a2540;border-radius:12px;overflow:hidden;">';
    const now = new Date();
    const currentAge = now.getFullYear() - year;
    for (let i = 0; i < 8; i++) {
        const startAge = 2 + i * 10;
        const endAge = 11 + i * 10;
        const palIdx = (mingIdx + i) % 12;
        const stars = palaceStars[palIdx];
        const isCurrent = currentAge >= startAge && currentAge <= endAge;

        dashaHtml += `<div style="display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #1a0d1e;font-size:13px;${isCurrent ? 'background:#1a0d2a;border-left:3px solid #e84393;' : ''}">
            <span style="min-width:60px;font-weight:700;color:#e84393;">${startAge}~${endAge}세</span>
            <span style="flex:1;color:#999;">${DIZHI[palIdx]}궁 ${stars.length > 0 ? '— ' + stars.join(', ') : ''}</span>
            ${isCurrent ? '<span style="font-size:10px;background:#e84393;color:#fff;padding:2px 8px;border-radius:10px;font-weight:700;">현재</span>' : ''}
        </div>`;
    }
    dashaHtml += '</div>';
    document.getElementById('dashaWrap').innerHTML = dashaHtml;

    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
}

initForm();
document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>

</body>
</html>
