function castHexagram() {
    // 6효를 랜덤으로 생성 (0=음, 1=양)
    const lines = [];
    for (let i = 0; i < 6; i++) {
        lines.push(Math.random() < 0.5 ? 1 : 0);
    }

    // 하괘(아래 3효)와 상괘(위 3효)로 팔괘 인덱스 찾기
    const lowerLines = lines.slice(0, 3);
    const upperLines = lines.slice(3, 6);

    function findTrigram(l) {
        return TRIGRAMS.findIndex(t => t.lines[0]===l[0] && t.lines[1]===l[1] && t.lines[2]===l[2]);
    }

    const lowerIdx = findTrigram(lowerLines);
    const upperIdx = findTrigram(upperLines);

    // 64괘에서 해당 괘 찾기
    const hex = HEXAGRAMS.find(h => h.upper === upperIdx && h.lower === lowerIdx);
    if (!hex) return;

    const upper = TRIGRAMS[hex.upper];
    const lower = TRIGRAMS[hex.lower];

    // 효 그리기 (아래부터 위로)
    let linesHtml = '';
    for (let i = 5; i >= 0; i--) {
        const isYang = lines[i] === 1;
        const delay = (5 - i) * 0.15;
        if (isYang) {
            linesHtml += `<div class="hex-line animate" style="animation-delay:${delay}s"><div class="bar yang"></div></div>`;
        } else {
            linesHtml += `<div class="hex-line animate" style="animation-delay:${delay}s"><div class="bar yin"></div><div class="bar yin"></div></div>`;
        }
    }

    const question = '';

    const section = document.getElementById('resultSection');
    section.innerHTML = `
        ${question ? `<div style="text-align:center;margin-bottom:20px;padding:12px;background:rgba(212,168,83,0.06);border:1px solid #3a2a15;border-radius:10px;"><span style="color:#888;font-size:13px;">질문:</span> <span style="color:#d4a853;font-size:15px;font-weight:600;">${question}</span></div>` : ''}

        <div class="hexagram-display">
            <div class="hex-number">제${hex.num}괘</div>
            <div class="hex-chinese">${hex.hanja}</div>
            <div class="hex-name">${hex.name}</div>
            <div class="hex-subtitle">${hex.keyword}</div>
            <div class="hex-lines">${linesHtml}</div>
        </div>

        <div class="trigram-row">
            <div class="trigram-box">
                <div class="trigram-label">상괘 (위)</div>
                <div class="trigram-symbol">${upper.symbol}</div>
                <div class="trigram-name">${upper.name}</div>
                <div style="font-size:12px;color:#888;">${upper.element} · ${upper.nature}</div>
            </div>
            <div class="trigram-box">
                <div class="trigram-label">하괘 (아래)</div>
                <div class="trigram-symbol">${lower.symbol}</div>
                <div class="trigram-name">${lower.name}</div>
                <div style="font-size:12px;color:#888;">${lower.element} · ${lower.nature}</div>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">📜 괘사 (卦辭)</div>
            <div class="reading-text">${hex.judge}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">🏔️ 상전 (象傳)</div>
            <div class="reading-text">${hex.image}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💡 조언</div>
            <div class="reading-text"><strong>${hex.advice}</strong></div>
        </div>
    `;

    section.style.display = 'block';
    section.scrollIntoView({behavior:'smooth'});
}
