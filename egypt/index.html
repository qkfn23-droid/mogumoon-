    { name: '나일의 신', deity: '하피 (Hapi)', glyph: '🌊', element: '물', dates: '1/1~1/10',

      love: '깊은 감정적 연결을 원합니다. 파트너를 풍요롭게 만들어주는 헌신적인 사랑. 질투심이 있을 수 있지만 한번 사랑하면 나일강처럼 끊임없이 흘러갑니다.',
      career: '농업, 환경, 의료, 요리, 상담 분야에 재능. 다른 사람을 키우고 돌보는 직업이 적합. 재물은 꾸준히 흘러들어옵니다.',

      lucky: { color: '파란색, 청록색', stone: '아쿠아마린', number: '3, 7', animal: '악어' },
      compat: [3,7,11,17,23,29] },

    { name: '아문의 아들', deity: '아문-라 (Amun-Ra)', glyph: '☀️', element: '불', dates: '1/11~1/20',
      startM:1, startD:11, endM:1, endD:20,
      personality: '태양신의 에너지를 가진 강력한 리더입니다. 카리스마가 넘치고 주변을 밝히는 존재. 야망이 크고 자존심이 강하며, 정의를 중시합니다. 창조적이고 낙관적인 성격으로 어둠 속에서도 빛을 찾습니다.',
      love: '열정적이고 드라마틱한 사랑. 파트너를 왕/왕비처럼 대합니다. 존경받고 싶은 욕구가 강하며, 무시당하면 깊이 상처받습니다.',
      career: '정치, 경영, 예술, 엔터테인먼트, 종교 지도자. 리더십 포지션에서 빛남. 금과 관련된 분야에서 재물.',
      health: '심장, 등, 눈에 주의. 태양 아래 활동이 치유가 되지만 과도한 열에 주의.',
      lucky: { color: '금색, 주황색', stone: '호박(Amber)', number: '1, 9', animal: '매' },

    { name: '무트의 딸', deity: '무트 (Mut)', glyph: '🦅', element: '바람', dates: '1/21~1/31',

      personality: '어머니 신 무트의 보호 에너지. 양육하고 보호하는 본능이 강합니다. 인내심이 깊고 실용적이며, 가족과 공동체를 최우선으로 생각합니다. 독수리의 눈으로 멀리 내다보는 통찰력.',

      compat: [5,9,14,20,26,32] },

    { name: '게브의 땅', deity: '게브 (Geb)', glyph: '🌍', element: '흙', dates: '2/1~2/10',

      love: '안정적이고 충실한 사랑. 물질적 안정을 제공하며 오래가는 관계를 만듭니다. 변화를 싫어하므로 파트너에게 일관성을 기대합니다.',

    { name: '오시리스의 심판', deity: '오시리스 (Osiris)', glyph: '⚖️', element: '물', dates: '2/11~2/20',
      startM:2, startD:11, endM:2, endD:20,
      personality: '죽음과 부활의 신 오시리스의 변혁 에너지. 삶의 순환을 이해하는 깊은 영혼입니다. 정의감이 강하고 진실을 추구하며, 어떤 시련도 부활로 바꾸는 힘이 있습니다.',
      love: '깊고 변혁적인 사랑. 영혼의 동반자를 찾습니다. 배신을 용서하기 어렵지만 진정한 사랑 앞에서는 새로운 시작을 받아들입니다.',
      career: '법률, 심리학, 의학, 장례, 보험, 고고학. 변혁과 재생 관련 분야. 유산이나 상속을 통한 재물.',
      health: '생식기, 배설기계에 주의. 감정적 정화가 신체 건강에 직결. 명상과 수행이 중요.',
      lucky: { color: '검정, 초록', stone: '흑요석', number: '5, 13', animal: '자칼' },
      compat: [1,7,11,19,25,31] },

    { name: '이시스의 마법', deity: '이시스 (Isis)', glyph: '✨', element: '바람', dates: '2/21~3/1',
      startM:2, startD:21, endM:3, endD:1,
      personality: '마법의 여신 이시스의 신비로운 에너지. 직관이 극도로 강하고 치유 능력이 있습니다. 지혜롭고 다재다능하며, 어떤 문제든 해결할 방법을 찾아냅니다. 사랑의 힘을 믿는 낭만적 영혼.',
      love: '마법같은 사랑을 꿈꿉니다. 파트너를 위해 하늘 끝까지 갈 수 있는 헌신. 이시스가 오시리스를 부활시킨 것처럼, 사랑의 기적을 만들어냅니다.',
      career: '의학, 약학, 대체의학, 심리학, 영적 치유, 연구. 치유와 마법(기술) 관련 분야. 지혜로 재물을 모읍니다.',
      health: '면역, 림프에 주의. 약초와 자연 치유에 관심. 달의 주기에 따라 건강이 변할 수 있습니다.',

    { name: '토트의 지혜', deity: '토트 (Thoth)', glyph: '📚', element: '바람', dates: '3/2~3/11',

      personality: '지식과 달의 신 토트의 지적 에너지. 학습과 소통에 뛰어난 재능이 있습니다. 글쓰기, 계산, 과학에 천부적 소질. 진실을 기록하고 전달하는 사명을 가지고 태어났습니다.',

      health: '신경계, 호흡기에 주의. 과도한 정신 활동으로 인한 스트레스. 명상과 수면이 중요.',
      lucky: { color: '은색, 보라', stone: '문스톤', number: '3, 9', animal: '따오기(ibis)' },

    { name: '호루스의 눈', deity: '호루스 (Horus)', glyph: '👁️', element: '불', dates: '3/12~3/21',

    { name: '아누비스의 안내', deity: '아누비스 (Anubis)', glyph: '🐺', element: '흙', dates: '3/22~3/31',

    { name: '소카르의 대지', deity: '소카르 (Sokar)', glyph: '🪶', element: '흙', dates: '8/11~8/20', startM:8, startD:11, endM:8, endD:20,

    { name: '테프누트의 비', deity: '테프누트 (Tefnut)', glyph: '🌧️', element: '물', dates: '10/11~10/20', startM:10, startD:11, endM:10, endD:20,

    { name: '앙크의 생명', deity: '앙크 (Ankh)', glyph: '☥', element: '바람', dates: '11/1~11/10', startM:11, startD:1, endM:11, endD:10,

function getDecanIndex(month, day) {
    for (let i = 0; i < DECANS.length; i++) {
        const d = DECANS[i];
        const start = d.startM * 100 + d.startD;
        const end = d.endM * 100 + d.endD;
        const target = month * 100 + day;
        if (target >= start && target <= end) return i;
    }
    return 0;
}

function initForm() {
    const y = document.getElementById('birthYear');
    const m = document.getElementById('birthMonth');
    const d = document.getElementById('birthDay');
    for (let i = 2025; i >= 1940; i--) { const o = document.createElement('option'); o.value = i; o.textContent = i + '년'; if (i === 1995) o.selected = true; y.appendChild(o); }
    for (let i = 1; i <= 12; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i + '월'; if (i === 3) o.selected = true; m.appendChild(o); }
    for (let i = 1; i <= 31; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i + '일'; if (i === 15) o.selected = true; d.appendChild(o); }
}

function calculate() {
    const month = parseInt(document.getElementById('birthMonth').value);
    const day = parseInt(document.getElementById('birthDay').value);
    const idx = getDecanIndex(month, day);
    const decan = DECANS[idx];

    // Decan Card
    document.getElementById('decanCard').innerHTML = `
        <div class="decan-card">
            <span class="decan-glyph">${decan.glyph}</span>
            <div class="decan-name">${decan.name}</div>
            <div class="decan-deity">수호신: ${decan.deity}</div>
            <div class="decan-dates">${decan.dates}</div>
        </div>
    `;

    // Info Grid
    document.getElementById('infoGrid').innerHTML = `
        <div class="info-item">
            <div class="info-label">수호신</div>
            <div class="info-value">${decan.glyph} ${decan.deity}</div>
        </div>
        <div class="info-item">
            <div class="info-label">원소</div>
            <div class="info-value">${decan.element}</div>
        </div>
        <div class="info-item">
            <div class="info-label">데칸 번호</div>
            <div class="info-value">${idx + 1} / 36</div>
        </div>
        <div class="info-item">
            <div class="info-label">기간</div>
            <div class="info-value">${decan.dates}</div>
        </div>
    `;

    // Personality
    document.getElementById('personalityWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">${decan.glyph} ${decan.name} — ${decan.deity}</div>
            <div class="interp-text">${decan.personality}</div>
        </div>
    `;

    // Love
    document.getElementById('loveWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">💕 ${decan.deity}의 사랑 방식</div>
            <div class="interp-text">${decan.love}</div>
        </div>
    `;

    // Career
    document.getElementById('careerWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">💼 직업 & 재물</div>
            <div class="interp-text">${decan.career}</div>
        </div>
    `;

    // Health
    document.getElementById('healthWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">🏥 건강 주의사항</div>
            <div class="interp-text">${decan.health}</div>
        </div>
    `;

    // Compatibility
    let compatHtml = '<div class="interp-card"><div class="interp-title">💞 잘 맞는 수호신</div><div class="interp-text">';
    decan.compat.forEach(ci => {
        if (ci < DECANS.length) {
            const c = DECANS[ci];
            compatHtml += `${c.glyph} <strong>${c.name}</strong> (${c.deity}) — ${c.dates}<br>`;
        }
    });
    compatHtml += '</div></div>';
    document.getElementById('compatWrap').innerHTML = compatHtml;

    // Lucky
    document.getElementById('luckyWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-text">
                <strong>🎨 행운의 색상:</strong> ${decan.lucky.color}<br>
                <strong>💎 행운의 보석:</strong> ${decan.lucky.stone}<br>
                <strong>🔢 행운의 숫자:</strong> ${decan.lucky.number}<br>
                <strong>🐾 수호 동물:</strong> ${decan.lucky.animal}
            </div>
        </div>
    `;

    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
}

initForm();
document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
