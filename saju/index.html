<script>
// ═══════════════════════════════════════
// 사주팔자 계산 엔진 (만세력 기반)
// ═══════════════════════════════════════
const STEMS = ['갑','을','병','정','무','기','경','신','임','계'];
const BRANCHES = ['자','축','인','묘','진','사','오','미','신','유','술','해'];
const ELEMENTS = ['목','목','화','화','토','토','금','금','수','수'];
const BR_ELEMENTS = ['수','토','목','목','토','화','화','토','금','금','토','수'];
const ANIMALS = ['🐀','🐂','🐅','🐇','🐉','🐍','🐴','🐑','🐵','🐔','🐶','🐷'];
const ANIMAL_NAMES = ['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
const EL_NAMES = ['목(木)','화(火)','토(土)','금(金)','수(水)'];
const EL_COLORS = ['#27ae60','#e74c3c','#d4a853','#bdc3c7','#3498db'];
const EL_CLASSES = ['el-wood','el-fire','el-earth','el-metal','el-water'];

// 절기 기준 월 경계 (양력 근사값)
const MONTH_BOUNDARIES = [
    [2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7],[1,5]
];

function getSolarMonth(month, day) {
    for (let i = 0; i < 12; i++) {
        const [m, d] = MONTH_BOUNDARIES[i];
        const [nm, nd] = MONTH_BOUNDARIES[(i+1) % 12];
        if (i < 11) {
            if ((month === m && day >= d) || (month === nm && day < nd)) return i + 1;
        } else {
            if ((month === 1 && day >= 5) || (month === 2 && day < 4)) return 12;
            if (month === 12 && day >= 7) return 11; // handled in loop
        }
    }
    // fallback by approximate mapping
    if (month === 1 && day < 5) return 12;
    if (month === 1 && day >= 5) return 12;
    if (month === 2 && day < 4) return 12;
    for (let i = 0; i < 12; i++) {
        const [m, d] = MONTH_BOUNDARIES[i];
        if (month === m && day >= d) return i + 1;
        if (month === m && day < d) return i === 0 ? 12 : i;
    }
    return 1;
}

function getAdjustedYear(year, month, day) {
    // 입춘(~2/4) 기준으로 년 전환
    if (month < 2 || (month === 2 && day < 4)) return year - 1;
    return year;
}

function getYearPillar(year, month, day) {
    const y = getAdjustedYear(year, month, day);
    return { stem: ((y - 4) % 10 + 10) % 10, branch: ((y - 4) % 12 + 12) % 12 };
}

function getMonthPillar(year, month, day) {
    const y = getAdjustedYear(year, month, day);
    const yearStem = ((y - 4) % 10 + 10) % 10;
    const solarM = getSolarMonth(month, day);
    const monthBranch = (solarM + 1) % 12; // 인월=2 from solarM=1
    // 오호둔법: 년간에 따라 인월(1월)의 천간 결정
    const baseStems = [2,4,6,8,0]; // 갑→병, 을→무, 병→경, 정→임, 무→갑
    const monthStem = (baseStems[yearStem % 5] + (solarM - 1)) % 10;
    return { stem: monthStem, branch: monthBranch };
}

function getDayPillar(year, month, day) {
    // 검증된 기준점: 2023년 1월 4일 = 갑자일 (stem 0, branch 0)
    const target = new Date(Date.UTC(year, month - 1, day));
    const ref = new Date(Date.UTC(2023, 0, 4));
    const daysDiff = Math.round((target - ref) / 86400000);
    const stem = ((daysDiff % 10) + 10) % 10;
    const branch = ((daysDiff % 12) + 12) % 12;
    return { stem, branch };
}

function getHourPillar(dayStem, hourIdx) {
    // 오서둔법: 일간에 따라 자시의 천간 결정
    const baseStems = [0,2,4,6,8]; // 갑→갑, 을→병, 병→무, 정→경, 무→임
    const hourStem = (baseStems[dayStem % 5] + hourIdx) % 10;
    return { stem: hourStem, branch: hourIdx };
}

// 오행 인덱스 (0=목, 1=화, 2=토, 3=금, 4=수)
function getElIdx(el) {
    return ['목','화','토','금','수'].indexOf(el);
}

// 십신 계산
function getTenGod(dayStem, targetStem) {
    const dayEl = getElIdx(ELEMENTS[dayStem]);
    const tarEl = getElIdx(ELEMENTS[targetStem]);
    const dayYin = dayStem % 2; // 0=양, 1=음
    const tarYin = targetStem % 2;
    const sameYY = dayYin === tarYin;

    const cycle = [
        [0,1,2,3,4], // 생: 목→화→토→금→수
    ];
    // 나와 같은 오행
    if (dayEl === tarEl) return sameYY ? '비견' : '겁재';
    // 내가 생하는 (목→화, 화→토, 토→금, 금→수, 수→목)
    if ((dayEl + 1) % 5 === tarEl) return sameYY ? '식신' : '상관';
    // 나를 생하는
    if ((tarEl + 1) % 5 === dayEl) return sameYY ? '편인' : '정인';
    // 내가 극하는 (목→토, 화→금, 토→수, 금→목, 수→화)
    if ((dayEl + 2) % 5 === tarEl) return sameYY ? '편재' : '정재';
    // 나를 극하는

    return '';
}

function toggleTime() {
    const disabled = document.getElementById('birthTimeUnknown').value === 'unknown';
    document.getElementById('birthHour').disabled = disabled;
    document.getElementById('birthHour').style.opacity = disabled ? '0.4' : '1';
}

function calculate() {
    const year = parseInt(document.getElementById('birthYear').value);
    const month = parseInt(document.getElementById('birthMonth').value);
    const day = parseInt(document.getElementById('birthDay').value);
    const hourIdx = document.getElementById('birthTimeUnknown').value === 'unknown' ? -1 : parseInt(document.getElementById('birthHour').value);
    const gender = document.getElementById('gender').value;

    const yp = getYearPillar(year, month, day);
    const mp = getMonthPillar(year, month, day);
    const dp = getDayPillar(year, month, day);
    const hp = hourIdx >= 0 ? getHourPillar(dp.stem, hourIdx) : null;

    const dayStem = dp.stem;
    const dayMaster = STEMS[dayStem];
    const dm = DAY_MASTERS[dayMaster];

    // 사주 기둥 표시
    const pillars = [
        { label: '시주(時)', data: hp },
        { label: '일주(日)', data: dp, isDay: true },
        { label: '월주(月)', data: mp },
        { label: '년주(年)', data: yp }
    ];

    let pillarsHTML = '';
    pillars.forEach(p => {
        if (!p.data) {
            pillarsHTML += `<div class="pillar"><div class="pillar-label">${p.label}</div><div class="pillar-stem" style="color:#666">?</div><div class="pillar-branch" style="color:#666">?</div><div class="pillar-element">시간 미입력</div></div>`;
            return;
        }
        const sEl = ELEMENTS[p.data.stem];
        const bEl = BR_ELEMENTS[p.data.branch];
        const sClass = EL_CLASSES[getElIdx(sEl)];
        const bClass = EL_CLASSES[getElIdx(bEl)];
        const tenGod = p.isDay ? '일간' : getTenGod(dayStem, p.data.stem);
        pillarsHTML += `<div class="pillar${p.isDay ? ' day-pillar' : ''}">
            <div class="pillar-label">${p.label}</div>
            <div class="pillar-stem ${sClass}">${STEMS[p.data.stem]}</div>
            <div class="pillar-branch ${bClass}">${BRANCHES[p.data.branch]}</div>
            <div class="pillar-element">${sEl}/${bEl}</div>
            <div class="pillar-animal">${ANIMALS[p.data.branch]}</div>
            <div style="font-size:10px;color:#888;margin-top:4px;">${tenGod}</div>
        </div>`;
    });
    document.getElementById('pillarsGrid').innerHTML = pillarsHTML;

    // 일간 카드
    document.getElementById('daymasterWrap').innerHTML = `
        <div class="daymaster-card">
            <span class="daymaster-glyph">${dm.glyph}</span>
            <div class="daymaster-name">${dayMaster}일간 — ${dm.nature}</div>
            <div class="daymaster-sub">${dm.element} | ${ANIMAL_NAMES[yp.branch]}띠</div>
        </div>`;

    // 오행 분포
    const elCount = [0,0,0,0,0];
    [yp, mp, dp].forEach(p => {
        elCount[getElIdx(ELEMENTS[p.stem])]++;
        elCount[getElIdx(BR_ELEMENTS[p.branch])]++;
    });
    if (hp) {
        elCount[getElIdx(ELEMENTS[hp.stem])]++;
        elCount[getElIdx(BR_ELEMENTS[hp.branch])]++;
    }
    const total = elCount.reduce((a,b) => a+b, 0);
    let barHTML = '<div class="five-el-bar">';
    EL_NAMES.forEach((name, i) => {
        if (elCount[i] > 0) {
            const pct = (elCount[i] / total * 100).toFixed(0);
            barHTML += `<div style="width:${pct}%;background:${EL_COLORS[i]}">${name.split('(')[0]} ${elCount[i]}</div>`;
        }
    });
    barHTML += '</div>';

    const weakEl = EL_NAMES[elCount.indexOf(Math.min(...elCount))];
    const strongEl = EL_NAMES[elCount.indexOf(Math.max(...elCount))];
    document.getElementById('fiveElWrap').innerHTML = barHTML + `
        <div style="font-size:12px;color:#999;margin-top:8px;">
            <strong style="color:#d4a853;">가장 강한 오행:</strong> ${strongEl} (${Math.max(...elCount)}개) &nbsp;|&nbsp;
            <strong style="color:#d4a853;">가장 약한 오행:</strong> ${weakEl} (${Math.min(...elCount)}개)
        </div>`;

    // 정보 그리드
    document.getElementById('infoGrid').innerHTML = `
        <div class="info-item"><div class="info-label">일간 (Day Master)</div><div class="info-value">${dm.glyph} ${dayMaster} — ${dm.nature}</div></div>
        <div class="info-item"><div class="info-label">띠</div><div class="info-value">${ANIMALS[yp.branch]} ${ANIMAL_NAMES[yp.branch]}띠 (${STEMS[yp.stem]}${BRANCHES[yp.branch]}년)</div></div>
        <div class="info-item"><div class="info-label">일주</div><div class="info-value">${STEMS[dp.stem]}${BRANCHES[dp.branch]}일</div></div>
        <div class="info-item"><div class="info-label">성별/음양</div><div class="info-value">${gender === 'm' ? '남성 (양)' : '여성 (음)'}</div></div>
    `;

    // 성격 해석
    document.getElementById('interpWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">${dm.glyph} ${dayMaster}일간 — "${dm.nature}"</div>
            <div class="interp-text">${dm.personality}</div>
        </div>
        <div class="interp-card">
            <div class="interp-title">💡 인생 조언</div>
            <div class="interp-text">${dm.advice}</div>
        </div>`;

    // 배우자
    const spouseBranch = BRANCHES[dp.branch];
    const spouseApp = SPOUSE_APPEARANCE[spouseBranch] || '';
    document.getElementById('spouseWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">💕 배우자궁 (일지: ${spouseBranch})</div>
            <div class="interp-text">
                <strong>📐 배우자 외모 & 첫인상:</strong><br>${spouseApp}<br><br>
                <strong>💑 연애 & 결혼:</strong><br>${dm.love}
            </div>
        </div>`;

    // 재물 & 직업
    document.getElementById('wealthWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">💼 직업 적성</div>
            <div class="interp-text">${dm.career}</div>
        </div>
        <div class="interp-card">
            <div class="interp-title">💰 재물운</div>
            <div class="interp-text">${dm.wealth}</div>
        </div>`;

    // 건강
    document.getElementById('healthWrap').innerHTML = `
        <div class="interp-card">
            <div class="interp-title">🏥 ${dayMaster}일간의 건강</div>
            <div class="interp-text">${dm.health}</div>
        </div>`;

    // 대운 (간이)
    const yearStem = yp.stem;
    const yearBranch = yp.branch;
    const isYangMale = (yearStem % 2 === 0 && gender === 'm') || (yearStem % 2 === 1 && gender === 'f');
    const mpStem = mp.stem;
    const mpBranch = mp.branch;

    let dashaHtml = '<div style="background:#0d0a05;border:1px solid #3a2a15;border-radius:12px;overflow:hidden;">';
    const now = new Date();
    const currentAge = now.getFullYear() - year;

    for (let i = 0; i < 8; i++) {
        const startAge = 2 + i * 10;
        const endAge = 11 + i * 10;
        let dStem, dBranch;
        if (isYangMale) {
            dStem = (mpStem + i + 1) % 10;
            dBranch = (mpBranch + i + 1) % 12;
        } else {
            dStem = ((mpStem - i - 1) % 10 + 10) % 10;
            dBranch = ((mpBranch - i - 1) % 12 + 12) % 12;
        }
        const isCurrent = currentAge >= startAge && currentAge <= endAge;
        const tenGod = getTenGod(dayStem, dStem);
        const sClass = EL_CLASSES[getElIdx(ELEMENTS[dStem])];
        const bClass = EL_CLASSES[getElIdx(BR_ELEMENTS[dBranch])];

        dashaHtml += `<div style="display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #1a1008;font-size:13px;${isCurrent ? 'background:#1a1510;border-left:3px solid #d4a853;' : ''}">
            <span style="min-width:65px;font-weight:700;color:#d4a853;">${startAge}~${endAge}세</span>
            <span class="${sClass}" style="font-weight:700;margin-right:2px;">${STEMS[dStem]}</span><span class="${bClass}" style="font-weight:700;">${BRANCHES[dBranch]}</span>
            <span style="flex:1;color:#888;margin-left:8px;font-size:11px;">${tenGod} · ${ELEMENTS[dStem]}/${BR_ELEMENTS[dBranch]}</span>
            ${isCurrent ? '<span style="font-size:10px;background:#d4a853;color:#1a1008;padding:2px 8px;border-radius:10px;font-weight:700;">현재</span>' : ''}
        </div>`;
    }
    dashaHtml += '</div>';
    document.getElementById('dashaWrap').innerHTML = dashaHtml;

    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
}

function initForm() {
    const y = document.getElementById('birthYear');
    const m = document.getElementById('birthMonth');
    const d = document.getElementById('birthDay');
    const h = document.getElementById('birthHour');
    for (let i = 2025; i >= 1940; i--) { const o = document.createElement('option'); o.value = i; o.textContent = i + '년'; if (i === 1995) o.selected = true; y.appendChild(o); }
    for (let i = 1; i <= 12; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i + '월'; if (i === 3) o.selected = true; m.appendChild(o); }
    for (let i = 1; i <= 31; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i + '일'; if (i === 15) o.selected = true; d.appendChild(o); }
    const hourLabels = ['자시(23~1)','축시(1~3)','인시(3~5)','묘시(5~7)','진시(7~9)','사시(9~11)','오시(11~13)','미시(13~15)','신시(15~17)','유시(17~19)','술시(19~21)','해시(21~23)'];
    for (let i = 0; i < 12; i++) { const o = document.createElement('option'); o.value = i; o.textContent = hourLabels[i]; if (i === 5) o.selected = true; h.appendChild(o); }
}

initForm();
document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>

</body>
</html>
