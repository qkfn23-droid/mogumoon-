<script>
const ANSWERS = [
    // 긍정 (positive)
    {text:"그렇습니다. 확실합니다.", type:"positive"},
    {text:"의심할 여지 없이 그렇습니다.", type:"positive"},
    {text:"절대적으로 그렇습니다.", type:"positive"},
    {text:"네, 분명히 그렇습니다.", type:"positive"},
    {text:"당신이 믿는 대로 될 것입니다.", type:"positive"},
    {text:"별들이 당신 편입니다.", type:"positive"},
    {text:"운명이 미소짓고 있습니다.", type:"positive"},
    {text:"좋은 기운이 느껴집니다... 그렇습니다!", type:"positive"},
    {text:"수정구가 밝게 빛납니다. 긍정의 신호입니다.", type:"positive"},
    {text:"우주가 '예'라고 속삭입니다.", type:"positive"},
    {text:"길이 열려 있습니다. 나아가세요.", type:"positive"},
    {text:"당신의 소원은 이루어질 것입니다.", type:"positive"},
    {text:"희망을 품으세요. 좋은 일이 다가옵니다.", type:"positive"},
    {text:"지금이 행동할 때입니다. 성공이 기다립니다.", type:"positive"},
    {text:"수정구 속에 빛이 보입니다. 행운의 징조!", type:"positive"},

    // 중립 (neutral)
    {text:"안개가 자욱합니다... 아직 확실하지 않습니다.", type:"neutral"},
    {text:"나중에 다시 물어보세요.", type:"neutral"},
    {text:"지금은 답을 줄 수 없습니다.", type:"neutral"},
    {text:"집중해서 다시 물어보세요.", type:"neutral"},
    {text:"수정구가 흔들립니다... 결과가 불확실합니다.", type:"neutral"},
    {text:"시간이 답을 줄 것입니다. 기다리세요.", type:"neutral"},
    {text:"양면이 있습니다. 신중하게 판단하세요.", type:"neutral"},
    {text:"운명은 아직 결정되지 않았습니다.", type:"neutral"},
    {text:"답은 당신 안에 있습니다. 더 깊이 들여다보세요.", type:"neutral"},
    {text:"수정구가 두 가지 빛을 보여줍니다... 선택은 당신의 몫.", type:"neutral"},

    // 부정 (negative)
    {text:"그럴 가능성은 낮습니다.", type:"negative"},
    {text:"아닙니다.", type:"negative"},
    {text:"별들이 반대합니다.", type:"negative"},
    {text:"수정구가 어두워집니다... 좋지 않은 신호입니다.", type:"negative"},
    {text:"지금은 때가 아닙니다.", type:"negative"},
    {text:"다른 길을 찾아보세요.", type:"negative"},
    {text:"기대하지 않는 것이 좋겠습니다.", type:"negative"},
    {text:"수정구가 경고합니다. 신중하세요.", type:"negative"},
    {text:"지금 방향을 바꾸는 것이 현명합니다.", type:"negative"},
    {text:"그 선택은 후회를 부를 수 있습니다.", type:"negative"},

    // 신비 (mystical)
    {text:"달이 차오를 때 답이 드러날 것입니다.", type:"mystical"},
    {text:"꿈에서 힌트를 찾으세요.", type:"mystical"},
    {text:"세 번째 기회에 주목하세요.", type:"mystical"},
    {text:"예상치 못한 곳에서 답이 올 것입니다.", type:"mystical"},
    {text:"수정구가 나비를 보여줍니다... 변화가 옵니다.", type:"mystical"},
    {text:"과거를 놓아야 미래가 열립니다.", type:"mystical"},
    {text:"가까운 사람의 말에 답이 숨어 있습니다.", type:"mystical"},
    {text:"물 가까이에서 영감을 얻을 것입니다.", type:"mystical"},
    {text:"수정구 속에 문이 보입니다... 열쇠는 용기입니다.", type:"mystical"},
    {text:"별자리가 정렬되고 있습니다. 곧 알게 될 것입니다.", type:"mystical"},
    {text:"지금 느끼는 직감을 믿으세요. 그것이 답입니다.", type:"mystical"},
    {text:"우연이라고 생각한 것... 그것은 운명이었습니다.", type:"mystical"},
];

const TYPE_LABELS = {positive:"긍정",neutral:"중립",negative:"부정",mystical:"신비"};
const TYPE_CLASS = {positive:"type-positive",neutral:"type-neutral",negative:"type-negative",mystical:"type-mystical"};

let isAsking = false;
const history = [];

function askCrystal() {
    if (isAsking) return;
    isAsking = true;

    const btn = document.getElementById('askBtn');
    const ball = document.getElementById('crystalBall');
    const textEl = document.getElementById('crystalText');
    const mist = document.getElementById('mist');
    const question = '';

    btn.disabled = true;
    textEl.className = 'crystal-text';
    textEl.innerHTML = '...';
    ball.classList.add('shaking');
    mist.classList.remove('active');
    void mist.offsetWidth;
    mist.classList.add('active');

    setTimeout(() => {
        ball.classList.remove('shaking');
        const answer = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];

        textEl.innerHTML = answer.text;
        textEl.className = 'crystal-text active';

        // 히스토리 추가
        history.unshift({q: question || '(마음속 질문)', a: answer.text, type: answer.type});
        updateHistory();

        btn.disabled = false;
        isAsking = false;
    }, 1500);
}

function updateHistory() {
    if (history.length === 0) return;
    document.getElementById('historySection').style.display = 'block';
    document.getElementById('historyList').innerHTML = history.slice(0, 10).map(h => `
        <div class="history-item" style="animation:fadeIn 0.3s ease-out;">
            <div class="history-q">Q: ${h.q} <span class="history-type ${TYPE_CLASS[h.type]}">${TYPE_LABELS[h.type]}</span></div>
            <div class="history-a">"${h.a}"</div>
        </div>
    `).join('');
}

</script>
