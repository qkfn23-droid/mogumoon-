<script>
// Moon phase calculation (based on John Conway's algorithm)
function getMoonPhase(year, month, day) {
    if (month <= 2) { year--; month += 12; }
    const A = Math.floor(year / 100);
    const B = 2 - A + Math.floor(A / 4);
    const JD = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
    const daysSinceNew = JD - 2451550.1;
    const newMoons = daysSinceNew / 29.530588853;
    const phase = newMoons - Math.floor(newMoons);
    return phase; // 0~1 (0=new moon, 0.5=full moon)
}

function getPhaseInfo(phase) {
    const illumination = Math.round(Math.abs(Math.cos(phase * 2 * Math.PI) * -0.5 + 0.5) * 100);
    const lunarDay = Math.round(phase * 29.5) + 1;

    if (phase < 0.0625) return {name:"New Moon",emoji:"🌑",idx:0,illumination,lunarDay,
        meaning:"<strong>New beginnings</strong> fill the air. With the moon completely hidden, this is the perfect time to plant seeds — set new intentions and goals. Turn inward, plan quietly. This is a time to sprout from within rather than show outwardly.",
        good:["Start new projects","Set goals","Meditation & reflection","Journaling","Digital detox"],
        bad:["Big announcements","Drawing conclusions","Excessive socializing"]};
    if (phase < 0.1875) return {name:"Waxing Crescent",emoji:"🌒",idx:1,illumination,lunarDay,
        meaning:"The seeds you planted are <strong>beginning to sprout</strong>. Start turning your intentions into action. Still small and tender, but steady effort will help them grow. Gather your courage and take that first step. Perfection is not required.",
        good:["Take first actions","Begin self-improvement","Build new habits","Embrace courage"],
        bad:["Hasty judgments","Perfectionism","High-risk moves"]};
    if (phase < 0.3125) return {name:"First Quarter",emoji:"🌓",idx:2,illumination,lunarDay,
        meaning:"A time of <strong>decision and action</strong>. The half-moon balances light and dark — this is the moment of choice. Obstacles may appear, but they are testing you. Make bold decisions and move forward. Do not avoid challenges.",
        good:["Important decisions","Face challenges","Confront problems","Active effort"],
        bad:["Indecision","Giving up","Avoidance"]};
    if (phase < 0.4375) return {name:"Waxing Gibbous",emoji:"🌔",idx:3,illumination,lunarDay,
        meaning:"A time to <strong>refine and complete</strong>. Like the nearly-full moon, you are close to your goal. Check the details and finish strong. Stay patient and give your best until the end — the full moon brings results.",
        good:["Fine-tuning","Finishing touches","Maintaining patience","Incorporating feedback"],
        bad:["Starting new things","Changing direction","Rushing"]};
    if (phase < 0.5625) return {name:"Full Moon",emoji:"🌕",idx:4,illumination,lunarDay,
        meaning:"The moon's energy reaches its <strong>peak</strong>! Emotions run high, intuition sharpens, and hidden things come to light. It is harvest time — the efforts you have made bear fruit. Give thanks and celebrate. Wishes made under the full moon carry special power.",
        good:["Celebration & gratitude","Make a wish","Follow your intuition","Harvest results","Confess feelings"],
        bad:["Emotional decisions","Impulsive actions","Major conflicts"]};
    if (phase < 0.6875) return {name:"Waning Gibbous",emoji:"🌖",idx:5,illumination,lunarDay,
        meaning:"A time of <strong>sharing and gratitude</strong>. As the full moon's light gradually fades, give back what you have received. Reflect on lessons learned and pass them on. Inner wisdom deepens during this phase.",
        good:["Sharing & service","Teaching & mentoring","Expressing gratitude","Reflection & review"],
        bad:["New beginnings","Greediness"]};
    if (phase < 0.8125) return {name:"Last Quarter",emoji:"🌗",idx:6,illumination,lunarDay,
        meaning:"A time to <strong>release and clear out</strong>. Let go of what no longer serves you — bad habits, toxic relationships, old baggage. Space must be made for new things to enter. Forgive and release.",
        good:["Decluttering","Breaking bad habits","Forgiveness & reconciliation","Releasing what no longer serves"],
        bad:["New projects","Clinging on","Dwelling on the past"]};
    if (phase < 0.9375) return {name:"Waning Crescent",emoji:"🌘",idx:7,illumination,lunarDay,
        meaning:"Just before the moon disappears — a time for <strong>rest and recharging</strong>. Low energy is a natural part of the cycle. Rest well without pushing yourself. Pay attention to meditation, dreams, and intuition. A new moon is coming soon.",
        good:["Ample rest","Meditation & prayer","Dream journaling","Recharging energy"],
        bad:["Overexertion","Important beginnings","Overworking"]};
    return {name:"New Moon",emoji:"🌑",idx:0,illumination:0,lunarDay:1,
        meaning:"<strong>New beginnings</strong> fill the air. Plan quietly.",
        good:["Start new projects","Set goals","Meditation"],
        bad:["Big announcements","Drawing conclusions"]};
}

// Find next full/new moon
function findNextPhase(targetPhase, startDate) {
    const d = new Date(startDate);
    for (let i = 1; i <= 35; i++) {
        d.setDate(d.getDate() + 1);
        const p = getMoonPhase(d.getFullYear(), d.getMonth() + 1, d.getDate());
        if (targetPhase === "full" && p >= 0.47 && p <= 0.53) return d;
        if (targetPhase === "new" && (p <= 0.03 || p >= 0.97)) return d;
    }
    return null;
}

// Draw moon SVG
function drawMoon(phase) {
    const r = 90;
    const cx = 100, cy = 100;
    let d;
    const ill = phase <= 0.5 ? phase * 2 : (1 - phase) * 2;
    const sweep = phase <= 0.5 ? 1 : 0;
    const bulge = (ill - 0.5) * 2 * r;

    if (phase < 0.01 || phase > 0.99) {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1a1a2e" stroke="#333" stroke-width="1"/>`;
    }
    if (phase > 0.49 && phase < 0.51) {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#e8e4d4" />
                <circle cx="${cx-25}" cy="${cy-20}" r="12" fill="rgba(200,195,180,0.5)"/>
                <circle cx="${cx+20}" cy="${cy+15}" r="8" fill="rgba(200,195,180,0.4)"/>
                <circle cx="${cx+5}" cy="${cy-35}" r="6" fill="rgba(200,195,180,0.3)"/>`;
    }

    const lightSide = phase <= 0.5 ? "right" : "left";
    const darkFill = "#1a1a2e";
    const lightFill = "#e8e4d4";

    if (lightSide === "right") {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${lightFill}"/>
                <path d="M${cx},${cy-r} A${r},${r} 0 0,0 ${cx},${cy+r} A${Math.abs(bulge)},${r} 0 0,${bulge > 0 ? 0 : 1} ${cx},${cy-r}" fill="${darkFill}"/>`;
    } else {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${lightFill}"/>
                <path d="M${cx},${cy-r} A${r},${r} 0 0,1 ${cx},${cy+r} A${Math.abs(bulge)},${r} 0 0,${bulge > 0 ? 1 : 0} ${cx},${cy-r}" fill="${darkFill}"/>`;
    }
}

// Main
const now = new Date();
const phase = getMoonPhase(now.getFullYear(), now.getMonth() + 1, now.getDate());
const info = getPhaseInfo(phase);
const nextFull = findNextPhase("full", now);
const nextNew = findNextPhase("new", now);

const PHASES = [
    {emoji:"🌑",name:"New Moon"},{emoji:"🌒",name:"Waxing Crescent"},{emoji:"🌓",name:"First Quarter"},
    {emoji:"🌔",name:"Waxing Gibbous"},{emoji:"🌕",name:"Full Moon"},{emoji:"🌖",name:"Waning Gibbous"},
    {emoji:"🌗",name:"Last Quarter"},{emoji:"🌘",name:"Waning Crescent"}
];

function formatDate(d) {
    if (!d) return "-";
    return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
}

function daysUntil(d) {
    if (!d) return "-";
    const diff = Math.ceil((d - now) / (1000*60*60*24));
    return `in ${diff} days`;
}

const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const todayStr = `${dayNames[now.getDay()]}, ${now.toLocaleString("en-US",{month:"long"})} ${now.getDate()}, ${now.getFullYear()}`;

document.getElementById("moonContent").innerHTML = `

        <div class="moon-date">${todayStr}</div>
        <div class="moon-wrapper">
            <div class="moon-glow"></div>
            <svg class="moon-svg" viewBox="0 0 200 200">${drawMoon(phase)}</svg>
        </div>
        <div class="moon-name"><span class="moon-emoji">${info.emoji}</span>${info.name}</div>
        <div class="moon-sub">Lunar day ~${info.lunarDay}</div>
        <div class="moon-illumination">Illumination: ${info.illumination}%</div>
    </div>

    <div class="phase-timeline">
        ${PHASES.map((p, i) => `<div class="phase-item ${i === info.idx ? "active" : ""}">
            <div class="ph-emoji">${p.emoji}</div>
            <div class="ph-name">${p.name}</div>
        </div>`).join("")}
    </div>

    <div class="info-grid">
        <div class="info-card">
            <div class="info-label">Next Full Moon 🌕</div>
            <div class="info-value">${formatDate(nextFull)}</div>
            <div class="info-sub">${daysUntil(nextFull)}</div>
        </div>
        <div class="info-card">
            <div class="info-label">Next New Moon 🌑</div>
            <div class="info-value">${formatDate(nextNew)}</div>
            <div class="info-sub">${daysUntil(nextNew)}</div>
        </div>
        <div class="info-card">
            <div class="info-label">Lunar Cycle</div>
            <div class="info-value">29.5 days</div>
            <div class="info-sub">synodic cycle</div>
        </div>
        <div class="info-card">
            <div class="info-label">Current Position</div>
            <div class="info-value">${Math.round(phase * 100)}%</div>
            <div class="info-sub">cycle progress</div>
        </div>
    </div>

    <div class="reading-card">
        <div class="reading-title">🌙 Today's Lunar Message</div>
        <div class="reading-text">${info.meaning}</div>
    </div>

    <div class="reading-card">
        <div class="reading-title">✅ Good Activities vs ❌ Avoid</div>
        <div class="activity-grid">
            ${info.good.map(g => `<div class="activity-item activity-good">✅ ${g}</div>`).join("")}
            ${info.bad.map(b => `<div class="activity-item activity-bad">❌ ${b}</div>`).join("")}
        </div>
    </div>

    <div class="reading-card">
        <div class="reading-title">📖 The 8 Lunar Phases</div>
        <div class="reading-text">
            <strong>🌑 New Moon</strong> — New beginnings, setting intentions<br>
            <strong>🌒 Waxing Crescent</strong> — Seeds sprout, take first action<br>
            <strong>🌓 First Quarter</strong> — Decision, challenge, overcoming obstacles<br>
            <strong>🌔 Waxing Gibbous</strong> — Refine, just before completion<br>
            <strong>🌕 Full Moon</strong> — Peak energy, harvest, heightened emotions<br>
            <strong>🌖 Waning Gibbous</strong> — Sharing, gratitude, reflection<br>
            <strong>🌗 Last Quarter</strong> — Release, clear out, forgive<br>
            <strong>🌘 Waning Crescent</strong> — Rest, recharge, turn inward
        </div>
    </div>
`;
</script>
