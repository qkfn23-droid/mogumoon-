function reduceNum(n) {
    while (n > 9 && n !== 11 && n !== 22) {
        n = String(n).split("").reduce((s, d) => s + Number(d), 0);
    }
    return n;
}

function seededRand(seed) {
    let s = seed;
    for (let i = 0; i < 10; i++) s = (s * 16807) % 2147483647;
    return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function discover() {
    const y = parseInt(document.getElementById("birthYear").value);
    const m = parseInt(document.getElementById("birthMonth").value);
    const d = parseInt(document.getElementById("birthDay").value);
    if (!y || !m || !d) return alert("Please select your birthdate!");

    const lifeNum = reduceNum(reduceNum(y) + reduceNum(m) + reduceNum(d));
    const seed = y * 10000 + m * 100 + d;
    const rand = seededRand(seed);

    const eraIdx = (lifeNum + Math.floor(rand() * 5)) % PAST_LIVES.length;
    const pl = PAST_LIVES[eraIdx];
    const jobIdx = Math.floor(rand() * pl.jobs.length);
    const job = pl.jobs[jobIdx];

    const karmaScore = Math.floor(rand() * 40) + 50;
    const wisdomScore = Math.floor(rand() * 40) + 45;
    const adventureScore = Math.floor(rand() * 40) + 40;

    const deathAge = Math.floor(rand() * 50) + 25;
    const deathCauses = ["Natural causes (a peaceful death)", "An honorable death in battle", "An early death from illness", "An accident during an adventure", "A calm death from old age", "Unknown causes (a mystery)"];
    const death = deathCauses[Math.floor(rand() * deathCauses.length)];

    const lessons = [
        "The importance of acting with courage",
        "The devotion of protecting those you love",
        "The value of spiritual richness over material wealth",
        "The flexibility to embrace change without fear",
        "A true understanding of who you really are",
        "The wisdom to forgive others and let go",
        "The true strength hidden within humility",
        "The courage to trust and follow your instincts"
    ];
    const lesson = lessons[Math.floor(rand() * lessons.length)];

    const section = document.getElementById("resultSection");
    section.innerHTML = `
        <div class="past-life-header">
            <div class="pl-era-emoji">${pl.emoji}</div>
            <div class="pl-era">${pl.era}</div>
            <div class="pl-job">${job}</div>

            <div class="trait-item">
                <div class="trait-label">Life Path Number</div>
                <div class="trait-value">${lifeNum}</div>
            </div>
            <div class="trait-item">
                <div class="trait-label">Past Life Age</div>
                <div class="trait-value">${deathAge} yrs</div>
            </div>
            <div class="trait-item">
                <div class="trait-label">Karma Score</div>
                <div class="trait-value">${karmaScore}/100</div>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">🏛️ Your Past Self</div>
            <div class="reading-text">
                You lived in <strong>${pl.region}</strong> during <strong>${pl.era}</strong> as a <strong>${job}</strong>.<br><br>
                ${pl.personality}
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">🔄 Karma (How Your Past Life Influences Your Present)</div>
            <div class="reading-text">${pl.karma}</div>
            <div class="karma-meter">

                <div class="karma-bar"><div class="karma-fill" style="width:${karmaScore}%;background:linear-gradient(90deg,#b8942a,#d4a853);"></div></div>
                <div class="karma-labels"><span>Unresolved</span><span>Resolved</span></div>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">⭐ Talents from Past Life</div>
            <div class="reading-text"><strong>${pl.talent}</strong><br><br>These talents lie dormant within you in your present life. If you feel an unexplainable pull toward something, or a sense of familiarity with something you've never tried, that is the memory of your past life.</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">😨 Past Life Trauma</div>
            <div class="reading-text"><strong>${pl.fear}</strong><br><br>If there is something you fear for no apparent reason in this life, it may stem from an experience in your past life.</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💀 Past Life Death</div>
            <div class="reading-text">
                In your past life, you passed away at the age of <strong>${deathAge}</strong>.<br>
                Cause of death: <strong>${death}</strong>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">📖 Lesson from Past Life</div>
            <div class="reading-text">The most important message your past self wants to send to your present self:<br><br><strong>"${lesson}"</strong></div>
        </div>

        <button class="retry-btn" onclick="document.getElementById('resultSection').style.display='none';window.scrollTo({top:0,behavior:'smooth'});">🔄 Try Again</button>
    `;
    section.style.display = "block";
    section.scrollIntoView({behavior:"smooth"});
}

(function() {
    const yEl = document.getElementById("birthYear");
    const mEl = document.getElementById("birthMonth");
    const dEl = document.getElementById("birthDay");
    const now = new Date();

    yEl.innerHTML = "<option value=\"\">Year</option>";
    for (let y = now.getFullYear(); y >= 1920; y--) yEl.innerHTML += `<option value="${y}">${y}</option>`;

    mEl.innerHTML = "<option value=\"\">Month</option>";
    for (let m = 1; m <= 12; m++) mEl.innerHTML += `<option value="${m}">${m}</option>`;

    function updateDays() {
        const y = parseInt(yEl.value) || 2000;
        const m = parseInt(mEl.value) || 1;
        const maxD = new Date(y, m, 0).getDate();
        const cur = parseInt(dEl.value);
        dEl.innerHTML = "<option value=\"\">Day</option>";
        for (let d = 1; d <= maxD; d++) dEl.innerHTML += `<option value="${d}"${d===cur?" selected":""}>${d}</option>`;
    }
    yEl.onchange = updateDays;
    mEl.onchange = updateDays;
    updateDays();
})();
</script>
