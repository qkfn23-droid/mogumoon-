<script>
function reduceNum(n) {
    while (n > 9 && n !== 11 && n !== 22 && n !== 33) {
        n = String(n).split("").reduce((s, d) => s + Number(d), 0);
    }
    return n;
}

function lifePathNumber(y, m, d) {
    return reduceNum(reduceNum(y) + reduceNum(m) + reduceNum(d));
}

const NUM_TRAITS = {
    1: {name:"Leader & Pioneer", element:"Fire", keyword:"Independence, Ambition, Creativity"},
    2: {name:"Harmonizer & Diplomat", element:"Water", keyword:"Cooperation, Sensitivity, Intuition"},
    3: {name:"Expressive Creator", element:"Fire", keyword:"Sociability, Optimism, Art"},
    4: {name:"Builder & Pragmatist", element:"Earth", keyword:"Diligence, Stability, Structure"},
    5: {name:"Freedom Seeker", element:"Air", keyword:"Change, Curiosity, Adaptability"},
    6: {name:"Nurturer & Protector", element:"Earth", keyword:"Family, Care, Justice"},
    7: {name:"Seeker & Analyst", element:"Air", keyword:"Wisdom, Spirituality, Solitude"},
    8: {name:"Power & Achiever", element:"Earth", keyword:"Ambition, Business, Leadership"},
    9: {name:"Idealist & Humanitarian", element:"Water", keyword:"Service, Empathy, Art"},
    11: {name:"Inspiration & Intuition Master", element:"Ether", keyword:"Intuition, Spirituality, Charisma"},
    22: {name:"Builder & Vision Master", element:"Ether", keyword:"Vision, Manifestation, Large Scale"},
    33: {name:"Healer & Love Master", element:"Ether", keyword:"Unconditional Love, Healing, Devotion"}
};

const COMPAT_DATA = {
    same: {
        score: 78,
        love: "Two people with the same life path number understand each other like mirrors. You share the same strengths and weaknesses — you are each other's greatest supporter and sharpest critic at the same time.",
        friend: "A friendship like twin souls. You connect without words, but compromise can be hard when the same stubbornness collides.",
        tip: "Acknowledge that you are each other's mirror. The things that bother you about the other person are often reflections of yourself."
    },
    complementary: {
        score: 88,
        love: "A perfect combination that fills each other's gaps! Together you become whole. Your differences are your greatest attraction.",
        friend: "With different strengths, you are unbeatable as a team. A friendship that broadens each other's world.",
        tip: "Don't criticize the differences — be grateful for them. Your partner brings what you lack."
    },
    challenging: {
        score: 52,
        love: "Not easy, but a relationship that brings growth. There may be friction, but that friction makes both of you better people.",
        friend: "Your perspectives are so different that understanding each other is difficult, but if you try, this is the relationship you learn the most from.",
        tip: "Patience is key. This relationship is not the easy path — it is the path of growth."
    },
    harmonious: {
        score: 82,
        love: "A relationship that naturally flows in harmony. Comfortable, stable, and peaceful when you are together.",
        friend: "A lasting friendship without pressure. You become each other's safe haven.",
        tip: "Pursue growth even within stability. Too much comfort can lead to stagnation."
    },
    passionate: {
        score: 75,
        love: "A fiery and passionate connection! The pull is strong, but occasional stormy arguments come with it. Never a dull moment in this love.",
        friend: "Energy explodes when you are together. Best when you share adventures and challenges.",
        tip: "Keep the passion healthy. Make sure the flames don't burn everything — take a breath occasionally."
    }
};

function getCompatType(n1, n2) {
    if (n1 === n2) return "same";
    const sum = n1 + n2;
    const diff = Math.abs(n1 - n2);
    if ((n1===1&&n2===2)||(n1===2&&n2===1)||(n1===3&&n2===6)||(n1===6&&n2===3)||
        (n1===4&&n2===5)||(n1===5&&n2===4)||(n1===7&&n2===9)||(n1===9&&n2===7)||
        (n1===1&&n2===9)||(n1===9&&n2===1)) return "complementary";
    if (diff <= 2 || sum === 10 || (n1===2&&n2===6)||(n1===6&&n2===2)||
        (n1===3&&n2===9)||(n1===9&&n2===3)) return "harmonious";
    if ((n1===1&&n2===5)||(n1===5&&n2===1)||(n1===3&&n2===5)||(n1===5&&n2===3)||
        (n1===1&&n2===8)||(n1===8&&n2===1)) return "passionate";
    if (diff >= 5 || (n1===4&&n2===7)||(n1===7&&n2===4)||
        (n1===8&&n2===2)||(n1===2&&n2===8)) return "challenging";
    return "harmonious";
}

function seededRand(seed) {
    let s = seed;
    for (let i = 0; i < 10; i++) s = (s * 16807) % 2147483647;
    return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function checkCompat() {
    const y1=parseInt(document.getElementById("y1").value), m1=parseInt(document.getElementById("m1").value), d1=parseInt(document.getElementById("d1").value);
    const y2=parseInt(document.getElementById("y2").value), m2=parseInt(document.getElementById("m2").value), d2=parseInt(document.getElementById("d2").value);
    if (!y1||!m1||!d1||!y2||!m2||!d2) return alert("Please select both birthdates!");

    const name1 = document.getElementById("name1").value.trim() || "Me";
    const name2 = document.getElementById("name2").value.trim() || "Partner";

    const lp1 = lifePathNumber(y1, m1, d1);
    const lp2 = lifePathNumber(y2, m2, d2);
    const t1 = NUM_TRAITS[lp1] || NUM_TRAITS[lp1 > 9 ? reduceNum(lp1) : lp1];
    const t2 = NUM_TRAITS[lp2] || NUM_TRAITS[lp2 > 9 ? reduceNum(lp2) : lp2];

    const compatType = getCompatType(lp1 > 9 ? reduceNum(lp1) : lp1, lp2 > 9 ? reduceNum(lp2) : lp2);
    const data = COMPAT_DATA[compatType];

    const seed = y1*10000+m1*100+d1 + y2*10000+m2*100+d2;
    const rand = seededRand(seed);

    const total = Math.min(99, Math.max(25, data.score + Math.floor(rand()*16) - 8));
    const love = Math.min(99, Math.max(20, total + Math.floor(rand()*20) - 10));
    const friend = Math.min(99, Math.max(20, total + Math.floor(rand()*20) - 10));
    const comm = Math.min(99, Math.max(20, total + Math.floor(rand()*16) - 8));
    const destiny = Math.min(99, Math.max(20, total + Math.floor(rand()*24) - 12));

    const scoreColor = total >= 80 ? "#e84393" : total >= 60 ? "#f39c12" : total >= 40 ? "#3498db" : "#e74c3c";
    const scoreText = total >= 90 ? "Destined match!" : total >= 80 ? "Perfect match!" : total >= 70 ? "Great match" : total >= 60 ? "Good match" : total >= 50 ? "Average" : total >= 40 ? "Needs effort" : "Challenging";

    const numAnalysis = lp1 === lp2
        ? `Both share Life Path <strong>${lp1}</strong> (${t1.name}). Two souls on the same frequency — perfectly understanding each other, yet amplifying the same weaknesses.`
        : `<strong>${name1}</strong>'s Life Path is <strong>${lp1}</strong> (${t1.name}), and <strong>${name2}</strong>'s is <strong>${lp2}</strong> (${t2.name}). The energy of ${t1.element} meets ${t2.element}, ${compatType === "complementary" ? "perfectly complementing each other" : compatType === "harmonious" ? "creating a natural harmony" : compatType === "passionate" ? "sparking intense attraction" : compatType === "challenging" ? "offering opportunities for growth" : "creating a unique dynamic"}.`;

    const section = document.getElementById("resultSection");
    section.innerHTML = `
        <div class="compat-header">
            <div class="compat-names">${name1} 💕 ${name2}</div>
            <div class="compat-nums">Life Path ${lp1} (${t1.name}) × Life Path ${lp2} (${t2.name})</div>
        </div>

        <div class="score-display">
            <div class="score-circle" style="border-color:${scoreColor};background:rgba(232,67,147,0.06);">
                <div class="score-num" style="color:${scoreColor};">${total}%</div>
                <div class="score-label">${scoreText}</div>
            </div>
        </div>

        <div class="score-bars">
            <div class="score-bar-item">
                <div class="sb-label">💕 Love</div>
                <div class="sb-bar"><div class="sb-fill" style="width:${love}%;background:#e84393;"></div></div>
                <div class="sb-value" style="color:#e84393;">${love}%</div>
            </div>
            <div class="score-bar-item">
                <div class="sb-label">👫 Friendship</div>
                <div class="sb-bar"><div class="sb-fill" style="width:${friend}%;background:#3498db;"></div></div>
                <div class="sb-value" style="color:#3498db;">${friend}%</div>
            </div>
            <div class="score-bar-item">
                <div class="sb-label">💬 Communication</div>
                <div class="sb-bar"><div class="sb-fill" style="width:${comm}%;background:#2ecc71;"></div></div>
                <div class="sb-value" style="color:#2ecc71;">${comm}%</div>
            </div>
            <div class="score-bar-item">
                <div class="sb-label">🔮 Destiny</div>
                <div class="sb-bar"><div class="sb-fill" style="width:${destiny}%;background:#9b59b6;"></div></div>
                <div class="sb-value" style="color:#9b59b6;">${destiny}%</div>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">🔢 Life Path Analysis</div>
            <div class="reading-text">${numAnalysis}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💕 Love</div>
            <div class="reading-text">${data.love}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">👫 Friendship</div>
            <div class="reading-text">${data.friend}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💡 Relationship Advice</div>
            <div class="reading-text"><strong>${data.tip}</strong></div>
        </div>

        <div class="reading-card">
            <div class="reading-title">📊 Profiles</div>
            <div class="reading-text">
                <strong>${name1}</strong> (${y1}.${m1}.${d1})<br>
                Life Path: <strong>${lp1}</strong> · ${t1.name} · ${t1.element} · ${t1.keyword}<br><br>
                <strong>${name2}</strong> (${y2}.${m2}.${d2})<br>
                Life Path: <strong>${lp2}</strong> · ${t2.name} · ${t2.element} · ${t2.keyword}
            </div>
        </div>

        <button class="retry-btn" onclick="document.getElementById('resultSection').style.display='none';window.scrollTo({top:0,behavior:'smooth'});">🔄 Try Another Match</button>
    `;
    section.style.display = "block";
    section.scrollIntoView({behavior:"smooth"});
}

(function() {
    const now = new Date();
    ["1","2"].forEach(n => {
        const yEl = document.getElementById("y"+n);
        const mEl = document.getElementById("m"+n);
        const dEl = document.getElementById("d"+n);

        yEl.innerHTML = "<option value=\"\">Year</option>";
        for (let y = now.getFullYear(); y >= 1920; y--) yEl.innerHTML += `<option value="${y}">${y}</option>`;

        mEl.innerHTML = "<option value=\"\">Month</option>";
        for (let m = 1; m <= 12; m++) mEl.innerHTML += `<option value="${m}">${m}</option>`;

        function updateDays() {
            const y = parseInt(yEl.value) || 2000;
            const m = parseInt(mEl.value) || 1;
            const maxD = new Date(y, m, 0).getDate();
            const cur = parseInt(dEl.value);
            dEl.innerHTML = "<option value=\"\">Day</option>";
            for (let d = 1; d <= maxD; d++) dEl.innerHTML += `<option value="${d}"${d===cur?" selected":""}>${d}</option>`;
        }
        yEl.onchange = updateDays;
        mEl.onchange = updateDays;
        updateDays();
    });
})();
</script>
