<script>
// 피타고라스 수비학 — 알파벳-숫자 매핑
const LETTER_MAP = {
    A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,
    J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,
    S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8
};
const VOWELS = new Set('AEIOU');

// 마스터 넘버를 유지하며 합산
function reduceNum(n) {
    while (n > 9 && n !== 11 && n !== 22 && n !== 33) {
        n = String(n).split('').reduce((s, d) => s + Number(d), 0);
    }
    return n;
}

// 운명수 (Life Path) — 년/월/일 각각 환원 후 합산
function lifePathNumber(y, m, d) {
    const ry = reduceNum(y);
    const rm = reduceNum(m);
    const rd = reduceNum(d);
    return reduceNum(ry + rm + rd);
}

// 생일수 (Birthday Number)
function birthdayNumber(d) {
    return reduceNum(d);
}

// 표현수 (Expression/Destiny) — 이름 전체 알파벳 합
function expressionNumber(name) {
    const letters = name.toUpperCase().replace(/[^A-Z]/g, '');
    if (!letters) return null;
    const sum = letters.split('').reduce((s, c) => s + (LETTER_MAP[c] || 0), 0);
    return reduceNum(sum);
}

// 영혼수 (Soul Urge/Heart's Desire) — 모음만
function soulUrgeNumber(name) {
    const letters = name.toUpperCase().replace(/[^A-Z]/g, '');
    if (!letters) return null;
    const sum = letters.split('').filter(c => VOWELS.has(c)).reduce((s, c) => s + (LETTER_MAP[c] || 0), 0);
    return reduceNum(sum);
}

// 성격수 (Personality) — 자음만
function personalityNumber(name) {
    const letters = name.toUpperCase().replace(/[^A-Z]/g, '');
    if (!letters) return null;
    const sum = letters.split('').filter(c => !VOWELS.has(c)).reduce((s, c) => s + (LETTER_MAP[c] || 0), 0);
    return reduceNum(sum);
}

// 성숙수 (Maturity) — 운명수 + 표현수
function maturityNumber(lp, expr) {
    if (expr === null) return null;
    return reduceNum(lp + expr);
}

function calculate() {
    const y = parseInt(document.getElementById('birthYear').value);
    const m = parseInt(document.getElementById('birthMonth').value);
    const d = parseInt(document.getElementById('birthDay').value);
    const nameVal = document.getElementById('fullName').value.trim();
    if (!y) return alert('생년월일을 선택하세요.');

    const lp = lifePathNumber(y, m, d);
    const bd = birthdayNumber(d);
    const expr = expressionNumber(nameVal);
    const soul = soulUrgeNumber(nameVal);
    const pers = personalityNumber(nameVal);
    const matu = maturityNumber(lp, expr);

    // 숫자 그리드
    const gridItems = [
        {num: lp, label: '운명수'},
        {num: bd, label: '생일수'},
    ];
    if (expr !== null) gridItems.push({num: expr, label: '표현수'});
    if (soul !== null) gridItems.push({num: soul, label: '영혼수'});
    if (pers !== null) gridItems.push({num: pers, label: '성격수'});
    if (matu !== null) gridItems.push({num: matu, label: '성숙수'});

    const gridEl = document.getElementById('numberGrid');
    gridEl.innerHTML = gridItems.map(i => `
        <div class="number-cell">
            <div class="num">${i.num}${MASTER[i.num] ? '<span class="master-badge">MASTER</span>' : ''}</div>
            <div class="label">${i.label}</div>
        </div>
    `).join('');

    // 결과 카드
    let html = '';

    // 운명수
    const lpData = LIFE_PATH[lp];
    html += makeCard('운명수 (Life Path)', lp, `${y} → ${reduceNum(y)} + ${m} → ${reduceNum(m)} + ${d} → ${reduceNum(d)} = ${lp}`, lpData.title, lpData.text);

    // 생일수
    html += makeCard('생일수 (Birthday)', bd, `${d}일생`, BIRTHDAY[bd] ? '생일의 에너지' : '', BIRTHDAY[bd] || '');

    // 이름 기반 수
    if (expr !== null) {
        const eData = EXPRESSION[expr];
        html += makeCard('표현수 (Expression)', expr, `이름 전체 알파벳 합산`, eData.title, eData.text);
    }
    if (soul !== null) {
        html += makeCard('영혼수 (Soul Urge)', soul, `이름의 모음(A,E,I,O,U) 합산`, '내면의 갈망', SOUL_URGE[soul]);
    }
    if (pers !== null) {
        html += makeCard('성격수 (Personality)', pers, `이름의 자음 합산`, '외면의 인상', PERSONALITY[pers]);
    }
    if (matu !== null) {
        html += makeCard('성숙수 (Maturity)', matu, `운명수(${lp}) + 표현수(${expr}) = ${lp + expr} → ${matu}`, '인생 후반의 테마', `성숙수는 인생 후반(40대 이후)에 강하게 나타나는 에너지입니다. ${LIFE_PATH[matu] ? LIFE_PATH[matu].text.split('.')[0] + '.' : ''}`);
    }

    // 이름 미입력시 안내
    if (!nameVal) {
        html += `<div class="result-card" style="text-align:center;color:#666;">
            <p>영문 이름을 입력하면 <strong style="color:#c9a84c;">표현수·영혼수·성격수·성숙수</strong>도 볼 수 있습니다.</p>
        </div>`;
    }

    document.getElementById('resultCards').innerHTML = html;
    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('shareBar').style.display = 'block';
    document.getElementById('resultSection').scrollIntoView({behavior: 'smooth'});
}

function makeCard(label, num, calc, subtitle, text) {
    return `
        <div class="result-card">
            <div class="result-header">
                <div class="result-number">${num}${MASTER[num] ? '<span class="master-badge">MASTER</span>' : ''}</div>
                <div>
                    <div class="result-label">${label}</div>
                    ${subtitle ? `<div class="result-sublabel">${subtitle}</div>` : ''}
                </div>
            </div>
            <div class="result-calc">${calc}</div>
            <div class="result-text">${text}</div>
        </div>
    `;
}

// select 초기화
(function() {
    const yEl = document.getElementById('birthYear');
    const mEl = document.getElementById('birthMonth');
    const dEl = document.getElementById('birthDay');
    const now = new Date();

    yEl.innerHTML = '<option value="">년</option>';
    for (let y = now.getFullYear(); y >= 1920; y--) yEl.innerHTML += `<option value="${y}">${y}년</option>`;

    mEl.innerHTML = '<option value="">월</option>';
    for (let m = 1; m <= 12; m++) mEl.innerHTML += `<option value="${m}">${m}월</option>`;

    function updateDays() {
        const y = parseInt(yEl.value) || 2000;
        const m = parseInt(mEl.value) || 1;
        const maxD = new Date(y, m, 0).getDate();
        const cur = parseInt(dEl.value);
        dEl.innerHTML = '<option value="">일</option>';
        for (let d = 1; d <= maxD; d++) dEl.innerHTML += `<option value="${d}"${d === cur ? ' selected' : ''}>${d}일</option>`;
    }
    yEl.onchange = updateDays;
    mEl.onchange = updateDays;
    updateDays();
})();
</script>
