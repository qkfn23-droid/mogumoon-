let currentQ = 0;
const scores = {};

function startQuiz() {
    currentQ = 0;
    Object.keys(ANIMALS).forEach(k => scores[k] = 0);
    showQuestion();
}

function showQuestion() {
    if (currentQ >= QUESTIONS.length) { showResult(); return; }
    const q = QUESTIONS[currentQ];
    const pct = (currentQ / QUESTIONS.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `질문 ${currentQ + 1} / ${QUESTIONS.length}`;

    document.getElementById('questionCard').innerHTML = `
        <div class="question-num">QUESTION ${currentQ + 1}</div>
        <div class="question-text">${q.q}</div>
        <div class="options">
            ${q.o.map((opt, i) => `<div class="option-btn" onclick="answer(${i})">${opt.t}</div>`).join('')}
        </div>
    `;
}

function answer(idx) {
    QUESTIONS[currentQ].o[idx].c.forEach(c => { scores[c] = (scores[c] || 0) + 1; });
    currentQ++;
    showQuestion();
}

function showResult() {
    document.getElementById('quizSection').style.display = 'none';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = '완료!';
    document.getElementById('shareBar').style.display = 'block';

    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const topKey = sorted[0][0];
    const subKey = sorted[1] ? sorted[1][0] : topKey;
    const a = ANIMALS[topKey];
    const sub = ANIMALS[subKey];

    const section = document.getElementById('resultSection');
    section.innerHTML = `
        <div class="animal-display">
            <span class="animal-emoji">${a.emoji}</span>
            <div class="animal-name">${a.name}</div>
            <div class="animal-title">${a.title}</div>
            <div class="animal-element">원소: ${a.element}</div>
        </div>

        <div class="trait-grid">
            <div class="trait-item">
                <div class="trait-label">주 동물</div>
                <div class="trait-value">${a.emoji} ${a.name}</div>
            </div>
            <div class="trait-item">
                <div class="trait-label">보조 동물</div>
                <div class="trait-value">${sub.emoji} ${sub.name}</div>
            </div>
            <div class="trait-item">
                <div class="trait-label">원소</div>
                <div class="trait-value">${a.element}</div>
            </div>
        </div>

        <div class="reading-card">
            <div class="reading-title">🐾 당신의 영혼 동물</div>
            <div class="reading-text">${a.personality}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💪 강점</div>
            <div class="reading-text"><strong>${a.strength}</strong></div>
        </div>

        <div class="reading-card">
            <div class="reading-title">⚠️ 약점</div>
            <div class="reading-text">${a.weakness}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">💌 영혼 동물의 메시지</div>
            <div class="reading-text"><strong>"${a.message}"</strong></div>
        </div>

        <div class="reading-card">
            <div class="reading-title">🤝 동물 궁합</div>
            <div class="compat-row">
                <div class="compat-item compat-good">잘 맞는 동물: ${a.good}</div>
                <div class="compat-item compat-bad">주의할 동물: ${a.bad}</div>
            </div>
        </div>

        <button class="retry-btn" onclick="location.reload()">🔄 다시 테스트하기</button>
    `;
    section.style.display = 'block';
    section.scrollIntoView({behavior:'smooth'});
}

startQuiz();
</script>
