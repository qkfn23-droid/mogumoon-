<div class="container">

        <h2>📊 Biorritmo</h2>
        <p>Insira sua data de nascimento para ver seus ritmos Fisico, Emocional e Intelectual</p>

    <div class="form-box">
        <div class="form-row">
            <label>Data de nascimento</label>
            <div class="date-row">
                <select id="birthYear"></select>
                <select id="birthMonth"></select>
                <select id="birthDay"></select>
            </div>
        </div>
    </div>

    <button class="calc-btn" onclick="calculate()">📊 Ver Biorritmo</button>

    <div id="resultSection" class="result-section"></div>

    <div class="disclaimer">📊 O biorritmo e uma ferramenta de referencia para diversao e autogestao. Nao e uma teoria cientificamente comprovada.</div>
</div>

<script>
const CYCLES = {physical:23, emotional:28, intellectual:33};
const COLORS = {physical:"#e74c3c", emotional:"#2ecc71", intellectual:"#3498db"};
const NAMES = {physical:"Fisico", emotional:"Emocional", intellectual:"Intelectual"};
const EMOJIS = {physical:"💪", emotional:"💚", intellectual:"🧠"};

let offsetDays = 0;
let birthDate = null;

function daysBetween(d1, d2) {
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
}

function bioValue(totalDays, cycle) {
    return Math.sin((2 * Math.PI * totalDays) / cycle);
}

function getStatus(val) {
    if (val > 0.8) return {text:"No auge 🔥", color:"#2ecc71"};
    if (val > 0.3) return {text:"Bom ↑", color:"#4fc3f7"};
    if (val > -0.3) return {text:"Normal →", color:"#f39c12"};
    if (val > -0.8) return {text:"Fraco ↓", color:"#e67e22"};
    return {text:"No minimo ⚠️", color:"#e74c3c"};
}

function getAdvice(p, e, i) {
    let advice = "";
    if (p > 0.5) advice += "<strong>Fisico:</strong> Voce esta cheio de energia! Ideal para exercicios e atividades fisicas.<br>";
    else if (p < -0.5) advice += "<strong>Fisico:</strong> Sua energia esta baixa. Nao se esforce demais e descanse o suficiente.<br>";
    else advice += "<strong>Fisico:</strong> Nivel normal. Atividade moderada e recomendada.<br>";

    if (e > 0.5) advice += "<strong>Emocional:</strong> Suas emocoes estao ricas e estaveis. Encontre pessoas e expresse seu afeto.<br>";
    else if (e < -0.5) advice += "<strong>Emocional:</strong> Suas emocoes estao a flor da pele. Evite conflitos e reserve um tempo para si mesmo.<br>";
    else advice += "<strong>Emocional:</strong> Equilibrio emocional normal. Continue como de costume.<br>";

    if (i > 0.5) advice += "<strong>Intelectual:</strong> Sua mente esta clara e sua concentracao esta no maximo. Perfeito para estudar ou tomar decisoes importantes!";
    else if (i < -0.5) advice += "<strong>Intelectual:</strong> Seu julgamento esta enfraquecido. Adie decisoes importantes.";
    else advice += "<strong>Intelectual:</strong> Concentracao normal. Adequado para tarefas cotidianas.";

    return advice;
}

function calculate() {
    const y = parseInt(document.getElementById("birthYear").value);
    const m = parseInt(document.getElementById("birthMonth").value);
    const d = parseInt(document.getElementById("birthDay").value);
    if (!y || !m || !d) return alert("Por favor, selecione sua data de nascimento!");

    birthDate = new Date(y, m - 1, d);
    offsetDays = 0;
    render();
}

function render() {
    const today = new Date();
    today.setDate(today.getDate() + offsetDays);
    const totalDays = daysBetween(birthDate, today);

    const p = bioValue(totalDays, CYCLES.physical);
    const e = bioValue(totalDays, CYCLES.emotional);
    const i = bioValue(totalDays, CYCLES.intellectual);

    const pSt = getStatus(p), eSt = getStatus(e), iSt = getStatus(i);

    const dayNames = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sab"];
    const dateStr = `${dayNames[today.getDay()]} ${today.getDate()}/${today.getMonth()+1}/${today.getFullYear()}`;
    const livedDays = totalDays;

    const section = document.getElementById("resultSection");
    section.innerHTML = `
        <div class="nav-btns">
            <div class="nav-btn" onclick="offsetDays-=7;render();">◀ 1 Semana</div>
            <div class="nav-btn" onclick="offsetDays--;render();">◀ Ontem</div>
            <div class="nav-btn" onclick="offsetDays=0;render();" style="background:rgba(79,195,247,0.2);">Hoje</div>
            <div class="nav-btn" onclick="offsetDays++;render();">Amanha ▶</div>
            <div class="nav-btn" onclick="offsetDays+=7;render();">1 Semana ▶</div>
        </div>

        <div style="text-align:center;margin-bottom:16px;">
            <div style="font-size:16px;color:#4fc3f7;font-weight:700;">${dateStr}</div>
            <div style="font-size:12px;color:#666;">Dia ${livedDays.toLocaleString()} desde o nascimento</div>
        </div>

        <div class="today-scores">
            <div class="score-card" style="background:rgba(231,76,60,0.06);">
                <div class="sc-emoji">💪</div>
                <div class="sc-label">Fisico</div>
                <div class="sc-value" style="color:${COLORS.physical};">${Math.round(p * 100)}%</div>
                <div class="sc-status" style="color:${pSt.color};">${pSt.text}</div>
                <div class="sc-cycle">Ciclo: 23 dias</div>
            </div>
            <div class="score-card" style="background:rgba(46,204,113,0.06);">
                <div class="sc-emoji">💚</div>
                <div class="sc-label">Emocional</div>
                <div class="sc-value" style="color:${COLORS.emotional};">${Math.round(e * 100)}%</div>
                <div class="sc-status" style="color:${eSt.color};">${eSt.text}</div>
                <div class="sc-cycle">Ciclo: 28 dias</div>
            </div>
            <div class="score-card" style="background:rgba(52,152,219,0.06);">
                <div class="sc-emoji">🧠</div>
                <div class="sc-label">Intelectual</div>
                <div class="sc-value" style="color:${COLORS.intellectual};">${Math.round(i * 100)}%</div>
                <div class="sc-status" style="color:${iSt.color};">${iSt.text}</div>
                <div class="sc-cycle">Ciclo: 33 dias</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Grafico de biorritmo de 30 dias</div>
            <div class="legend">
                <div class="legend-item"><div class="legend-dot" style="background:${COLORS.physical};"></div>Fisico (23d)</div>
                <div class="legend-item"><div class="legend-dot" style="background:${COLORS.emotional};"></div>Emocional (28d)</div>
                <div class="legend-item"><div class="legend-dot" style="background:${COLORS.intellectual};"></div>Intelectual (33d)</div>
            </div>
            <canvas id="bioChart" width="660" height="300"></canvas>
        </div>

        <div class="reading-card">
            <div class="reading-title">💡 Dicas de hoje</div>
            <div class="reading-text">${getAdvice(p, e, i)}</div>
        </div>

        <div class="reading-card">
            <div class="reading-title">📖 O que e biorritmo ?</div>
            <div class="reading-text">
                O biorritmo e uma teoria proposta no inicio dos anos 1900 pelo Dr. Wilhelm Fliess.<br><br>
                <strong>💪 Ritmo Fisico (ciclo de 23 dias)</strong> — Influencia a forca fisica, resistencia, imunidade e capacidades esportivas<br>
                <strong>💚 Ritmo Emocional (ciclo de 28 dias)</strong> — Influencia as emocoes, o humor, a criatividade e os relacionamentos sociais<br>
                <strong>🧠 Ritmo Intelectual (ciclo de 33 dias)</strong> — Influencia a concentracao, o julgamento, a memoria e a capacidade de aprendizagem<br><br>
                Quanto mais proximo de +100%, melhor; quanto mais proximo de -100%, mais baixo voce esta. O dia em que o ritmo passa por 0% e chamado de <strong>dia critico</strong>.
            </div>
        </div>
    `;
    section.style.display = "block";

    drawChart(totalDays);
}

function drawChart(centerDay) {
    const canvas = document.getElementById("bioChart");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const midY = H / 2;
    const amp = H * 0.4;
    const days = 30;
    const startDay = centerDay - 15;

    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;
    for (let y of [0.25, 0.5, 0.75]) {
        ctx.beginPath(); ctx.moveTo(0, H * y); ctx.lineTo(W, H * y); ctx.stroke();
    }
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();

    const todayX = (15 / days) * W;
    ctx.fillStyle = "rgba(79,195,247,0.1)";
    ctx.fillRect(todayX - 1, 0, 3, H);
    ctx.fillStyle = "rgba(79,195,247,0.5)";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Hoje", todayX, 14);

    Object.keys(CYCLES).forEach(key => {
        ctx.strokeStyle = COLORS[key];
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let d = 0; d <= days; d++) {
            const x = (d / days) * W;
            const val = bioValue(startDay + d, CYCLES[key]);
            const y = midY - val * amp;
            if (d === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        const todayVal = bioValue(centerDay, CYCLES[key]);
        const ty = midY - todayVal * amp;
        ctx.fillStyle = COLORS[key];
        ctx.beginPath();
        ctx.arc(todayX, ty, 5, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.fillStyle = "#555";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "center";
    for (let d = 0; d <= days; d += 5) {
        const date = new Date(birthDate);
        date.setDate(date.getDate() + startDay + d);
        const x = (d / days) * W;
        ctx.fillText(`${date.getMonth()+1}/${date.getDate()}`, x, H - 4);
    }

    ctx.fillStyle = "#444";
    ctx.textAlign = "left";
    ctx.fillText("+100%", 4, 16);
    ctx.fillText("0%", 4, midY - 4);
    ctx.fillText("-100%", 4, H - 16);
}

(function() {
    const yEl = document.getElementById("birthYear");
    const mEl = document.getElementById("birthMonth");
    const dEl = document.getElementById("birthDay");
    const now = new Date();

    yEl.innerHTML = "<option value=\"\">Ano</option>";
    for (let y = now.getFullYear(); y >= 1920; y--) yEl.innerHTML += `<option value="${y}">${y}</option>`;

    mEl.innerHTML = "<option value=\"\">Mes</option>";
    for (let m = 1; m <= 12; m++) mEl.innerHTML += `<option value="${m}">${m}</option>`;

    function updateDays() {
        const y = parseInt(yEl.value) || 2000;
        const m = parseInt(mEl.value) || 1;
        const maxD = new Date(y, m, 0).getDate();
        const cur = parseInt(dEl.value);
        dEl.innerHTML = "<option value=\"\">Dia</option>";
        for (let d = 1; d <= maxD; d++) dEl.innerHTML += `<option value="${d}"${d===cur?" selected":""}>${d}</option>`;
    }
    yEl.onchange = updateDays;
    mEl.onchange = updateDays;
    updateDays();
})();
</script>
