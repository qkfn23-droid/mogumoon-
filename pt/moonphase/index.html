<script>
// Calculo da fase lunar (baseado no algoritmo de John Conway)
function getMoonPhase(year, month, day) {
    if (month <= 2) { year--; month += 12; }
    const A = Math.floor(year / 100);
    const B = 2 - A + Math.floor(A / 4);
    const JD = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
    const daysSinceNew = JD - 2451550.1;
    const newMoons = daysSinceNew / 29.530588853;
    const phase = newMoons - Math.floor(newMoons);
    return phase;
}

function getPhaseInfo(phase) {
    const illumination = Math.round(Math.abs(Math.cos(phase * 2 * Math.PI) * -0.5 + 0.5) * 100);
    const lunarDay = Math.round(phase * 29.5) + 1;

    if (phase < 0.0625) return {name:"Lua Nova",emoji:"🌑",idx:0,illumination,lunarDay,
        meaning:"A energia de um <strong>novo começo</strong> está em pleno florescimento. Quando a lua se esconde completamente, é o momento ideal para plantar sementes — definir novas intenções e objetivos. É uma época de introspecção; planeje em silêncio e deixe as ideias germinar por dentro antes de revelá-las ao mundo.",
        good:["Iniciar um novo projeto","Definir metas","Meditação e introspecção","Escrever um diário","Detox digital"],
        bad:["Grandes anúncios públicos","Tomar decisões definitivas","Atividades sociais excessivas"]};
    if (phase < 0.1875) return {name:"Crescente",emoji:"🌒",idx:1,illumination,lunarDay,
        meaning:"As sementes que você plantou começam a <strong>germinar</strong>. É hora de colocar suas intenções em ação. Ainda são frágeis, mas com energia constante, elas crescerão. Tenha coragem para dar o primeiro passo — a perfeição não é necessária.",
        good:["Colocar em prática","Iniciar desenvolvimento pessoal","Criar novos hábitos","Ter coragem"],
        bad:["Julgamentos precipitados","Perfeccionismo","Grandes riscos"]};
    if (phase < 0.3125) return {name:"Quarto Crescente",emoji:"🌓",idx:2,illumination,lunarDay,
        meaning:"É o momento da <strong>decisão e da ação</strong>. A meia-lua simboliza o equilíbrio entre luz e sombra — um momento de escolha. Obstáculos podem surgir, mas eles existem para testá-lo. Decida com ousadia e avance. Não evite os desafios.",
        good:["Tomar decisões importantes","Enfrentar desafios","Confrontar problemas","Agir ativamente"],
        bad:["Indecisão","Desistir","Fugir das responsabilidades"]};
    if (phase < 0.4375) return {name:"Gibosa Crescente",emoji:"🌔",idx:3,illumination,lunarDay,
        meaning:"É o tempo de <strong>refinar e concluir</strong>. Como a lua quase cheia, você está se aproximando do seu objetivo. Verifique os detalhes e finalize seu trabalho. Com paciência e perseverança até o fim, você colherá os frutos na lua cheia.",
        good:["Ajustes de detalhe","Trabalhos de finalização","Manter a paciência","Integrar feedbacks"],
        bad:["Começar algo novo","Mudar de direção","Impaciência"]};
    if (phase < 0.5625) return {name:"Lua Cheia",emoji:"🌕",idx:4,illumination,lunarDay,
        meaning:"A energia da lua atinge seu <strong>auge</strong>! As emoções se intensificam, a intuição se aguça e o que estava escondido vem à tona. É a época da colheita — os esforços feitos até agora dão frutos. Seja grato e celebre. Os desejos feitos sob a lua cheia têm um poder especial.",
        good:["Celebração e gratidão","Fazer pedidos","Seguir a intuição","Colher os frutos","Declarações de amor"],
        bad:["Decisões emocionais","Ações impulsivas","Grandes conflitos"]};
    if (phase < 0.6875) return {name:"Gibosa Minguante",emoji:"🌖",idx:5,illumination,lunarDay,
        meaning:"É o tempo do <strong>compartilhamento e da gratidão</strong>. Assim como a luz da lua cheia diminui gradualmente, devolva e compartilhe o que recebeu. Organize o que aprendeu e transmita-o. A sabedoria interior se aprofunda neste período.",
        good:["Compartilhar e servir","Ensinar e mentorear","Expressar gratidão","Reflexão e balanço"],
        bad:["Novos começos","Ceder à ganância"]};
    if (phase < 0.8125) return {name:"Quarto Minguante",emoji:"🌗",idx:6,illumination,lunarDay,
        meaning:"É o momento de <strong>soltar e organizar</strong>. Abandone o que não é mais necessário — maus hábitos, relacionamentos tóxicos, velhos fardos. Para receber o novo, é preciso fazer espaço. Perdoe e deixe ir.",
        good:["Organizar e arrumar","Romper com maus hábitos","Perdoar e reconciliar","Descartar o supérfluo"],
        bad:["Novos projetos","Apegar-se","Remoer o passado"]};
    if (phase < 0.9375) return {name:"Minguante",emoji:"🌘",idx:7,illumination,lunarDay,
        meaning:"A lua está prestes a desaparecer — é o tempo do <strong>descanso e da recarga</strong>. A queda de energia faz parte do ciclo natural. Não se force; descanse o suficiente. Preste atenção à meditação, aos sonhos e à sua intuição. A lua nova está chegando.",
        good:["Descanso suficiente","Meditação e oração","Diário dos sonhos","Recarga de energia"],
        bad:["Atividades excessivas","Começos importantes","Excesso de trabalho"]};
    return {name:"Lua Nova",emoji:"🌑",idx:0,illumination:0,lunarDay:1,
        meaning:"A energia de um <strong>novo começo</strong> está em pleno florescimento. Planeje tranquilamente.",
        good:["Iniciar um novo projeto","Definir metas","Meditacao"],
        bad:["Grandes anuncios","Tomar decisoes definitivas"]};
}

// Encontrar a proxima lua cheia / lua nova
function findNextPhase(targetPhase, startDate) {
    const d = new Date(startDate);
    for (let i = 1; i <= 35; i++) {
        d.setDate(d.getDate() + 1);
        const p = getMoonPhase(d.getFullYear(), d.getMonth() + 1, d.getDate());
        if (targetPhase === "full" && p >= 0.47 && p <= 0.53) return d;
        if (targetPhase === "new" && (p <= 0.03 || p >= 0.97)) return d;
    }
    return null;
}

// Desenho SVG da lua
function drawMoon(phase) {
    const r = 90;
    const cx = 100, cy = 100;
    let d;
    const ill = phase <= 0.5 ? phase * 2 : (1 - phase) * 2;
    const sweep = phase <= 0.5 ? 1 : 0;
    const bulge = (ill - 0.5) * 2 * r;

    if (phase < 0.01 || phase > 0.99) {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1a1a2e" stroke="#333" stroke-width="1"/>`;
    }
    if (phase > 0.49 && phase < 0.51) {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#e8e4d4" />
                <circle cx="${cx-25}" cy="${cy-20}" r="12" fill="rgba(200,195,180,0.5)"/>
                <circle cx="${cx+20}" cy="${cy+15}" r="8" fill="rgba(200,195,180,0.4)"/>
                <circle cx="${cx+5}" cy="${cy-35}" r="6" fill="rgba(200,195,180,0.3)"/>`;
    }

    const lightSide = phase <= 0.5 ? "right" : "left";
    const darkFill = "#1a1a2e";
    const lightFill = "#e8e4d4";

    if (lightSide === "right") {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${lightFill}"/>
                <path d="M${cx},${cy-r} A${r},${r} 0 0,0 ${cx},${cy+r} A${Math.abs(bulge)},${r} 0 0,${bulge > 0 ? 0 : 1} ${cx},${cy-r}" fill="${darkFill}"/>`;
    } else {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${lightFill}"/>
                <path d="M${cx},${cy-r} A${r},${r} 0 0,1 ${cx},${cy+r} A${Math.abs(bulge)},${r} 0 0,${bulge > 0 ? 1 : 0} ${cx},${cy-r}" fill="${darkFill}"/>`;
    }
}

// Principal
const now = new Date();
const phase = getMoonPhase(now.getFullYear(), now.getMonth() + 1, now.getDate());
const info = getPhaseInfo(phase);
const nextFull = findNextPhase("full", now);
const nextNew = findNextPhase("new", now);

const PHASES = [
    {emoji:"🌑",name:"Lua Nova"},{emoji:"🌒",name:"Crescente"},{emoji:"🌓",name:"Quarto Crescente"},
    {emoji:"🌔",name:"Gibosa Crescente"},{emoji:"🌕",name:"Lua Cheia"},{emoji:"🌖",name:"Gibosa Minguante"},
    {emoji:"🌗",name:"Quarto Minguante"},{emoji:"🌘",name:"Minguante"}
];

function formatDate(d) {
    if (!d) return "-";
    const dayNames = ["Dom","Seg","Ter","Qua","Qui","Sex","Sab"];
    return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} (${dayNames[d.getDay()]})`;
}

function daysUntil(d) {
    if (!d) return "-";
    const diff = Math.ceil((d - now) / (1000*60*60*24));
    return `em ${diff} dias`;
}

const dayNames = ["Dom","Seg","Ter","Qua","Qui","Sex","Sab"];
const months = ["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const todayStr = `${dayNames[now.getDay()]}, ${now.getDate()} de ${months[now.getMonth()]} de ${now.getFullYear()}`;

document.getElementById("moonContent").innerHTML = `
    <div class="moon-display">
        <div class="moon-date">${todayStr}</div>
        <div class="moon-wrapper">
            <div class="moon-glow"></div>
            <svg class="moon-svg" viewBox="0 0 200 200">${drawMoon(phase)}</svg>
        </div>
        <div class="moon-name"><span class="moon-emoji">${info.emoji}</span>${info.name}</div>
        <div class="moon-sub">Aproximadamente dia ${info.lunarDay} do ciclo lunar</div>
        <div class="moon-illumination">Iluminacao: ${info.illumination}%</div>
    </div>

    <div class="phase-timeline">
        ${PHASES.map((p, i) => `<div class="phase-item ${i === info.idx ? "active" : ""}">
            <div class="ph-emoji">${p.emoji}</div>
            <div class="ph-name">${p.name}</div>
        </div>`).join("")}
    </div>

    <div class="info-grid">
        <div class="info-card">
            <div class="info-label">Proxima Lua Cheia 🌕</div>
            <div class="info-value">${formatDate(nextFull)}</div>
            <div class="info-sub">${daysUntil(nextFull)}</div>
        </div>
        <div class="info-card">
            <div class="info-label">Proxima Lua Nova 🌑</div>
            <div class="info-value">${formatDate(nextNew)}</div>
            <div class="info-sub">${daysUntil(nextNew)}</div>
        </div>
        <div class="info-card">
            <div class="info-label">Ciclo Lunar</div>
            <div class="info-value">29,5 dias</div>
            <div class="info-sub">Ciclo sinodico</div>
        </div>
        <div class="info-card">
            <div class="info-label">Posicao Atual</div>
            <div class="info-value">${Math.round(phase * 100)}%</div>
            <div class="info-sub">Progressao do ciclo</div>
        </div>
    </div>

    <div class="reading-card">
        <div class="reading-title">🌙 A mensagem da lua hoje</div>
        <div class="reading-text">${info.meaning}</div>
    </div>

    <div class="reading-card">
        <div class="reading-title">✅ Atividades favoraveis neste periodo vs ❌ A evitar</div>
        <div class="activity-grid">
            ${info.good.map(g => `<div class="activity-item activity-good">✅ ${g}</div>`).join("")}
            ${info.bad.map(b => `<div class="activity-item activity-bad">❌ ${b}</div>`).join("")}
        </div>
    </div>

    <div class="reading-card">
        <div class="reading-title">📖 As 8 fases da lua</div>
        <div class="reading-text">
            <strong>🌑 Lua Nova</strong> — Novo comeco, definir intencoes<br>
            <strong>🌒 Crescente</strong> — As sementes germinam, primeiras acoes<br>
            <strong>🌓 Quarto Crescente</strong> — Decisao, desafio, superar obstaculos<br>
            <strong>🌔 Gibosa Crescente</strong> — Refinar, quase concluido<br>
            <strong>🌕 Lua Cheia</strong> — Apogeu, colheita, emocoes intensas<br>
            <strong>🌖 Gibosa Minguante</strong> — Compartilhamento, gratidao, balanco<br>
            <strong>🌗 Quarto Minguante</strong> — Soltar, organizar, perdoar<br>
            <strong>🌘 Minguante</strong> — Descanso, recarga, retorno a si mesmo
        </div>
    </div>
`;
</script>
