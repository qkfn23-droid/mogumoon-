<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타로 카드 - MOGU Moon</title>
    <meta name="description" content="무료 온라인 타로 카드 리딩. 1장, 3장, 5장 스프레드. 메이저 아르카나 22장 + 마이너 아르카나 56장.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a1a; color: #e0d8cc; min-height: 100vh; }
        header { background: linear-gradient(135deg, #1a0d2e, #2a1540); border-bottom: 1px solid #3a2550; padding: 16px 20px; text-align: center; }
        header a { text-decoration: none; font-size: 20px; color: #9b59b6; letter-spacing: 2px; font-weight: 700; }
        .container { max-width: 700px; margin: 20px auto 40px; padding: 0 20px; }
        .page-title { text-align: center; margin-bottom: 30px; }
        .page-title h2 { font-size: 28px; color: #9b59b6; margin-bottom: 8px; }
        .page-title p { color: #8888aa; font-size: 14px; }

        .spread-selector { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
        .spread-btn { padding: 10px 20px; border: 2px solid #3a2550; border-radius: 10px; background: transparent; color: #9b59b6; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .spread-btn.active { background: #9b59b6; color: #fff; border-color: #9b59b6; }
        .spread-btn:hover { border-color: #9b59b6; }

        .question-box { background: linear-gradient(135deg, #1a0d2e, #2a1540); border: 1px solid #3a2550; border-radius: 12px; padding: 20px; margin-bottom: 24px; text-align: center; }
        .question-box input { width: 100%; padding: 12px; background: #0a0a1a; border: 1px solid #3a2550; border-radius: 8px; color: #e0d8cc; font-size: 15px; outline: none; text-align: center; }
        .question-box input:focus { border-color: #9b59b6; }
        .question-box input::placeholder { color: #555; }

        .draw-btn { display: block; width: 100%; padding: 16px; background: linear-gradient(135deg, #8e44ad, #9b59b6); color: #fff; border: none; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; letter-spacing: 2px; transition: all 0.2s; margin-bottom: 30px; }
        .draw-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(155,89,182,0.3); }

        .cards-area { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 30px; }

        .tarot-card { width: 120px; height: 180px; cursor: pointer; perspective: 800px; }
        .tarot-card .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
        .tarot-card.flipped .card-inner { transform: rotateY(180deg); }

        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .card-back { background: linear-gradient(135deg, #2a1540, #1a0d2e); border: 2px solid #9b59b6; overflow: hidden; }
        .card-back::before { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(155,89,182,0.3); border-radius: 6px; }
        .card-back::after { content: '✦'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 24px; color: rgba(155,89,182,0.5); }
        .card-back .stars { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(155,89,182,0.2) 1px, transparent 1px); background-size: 16px 16px; }
        .card-back .label { font-size: 8px; color: rgba(155,89,182,0.4); letter-spacing: 3px; position: absolute; bottom: 8px; }

        .card-front { background: linear-gradient(135deg, #1a0d2e, #0d0520); border: 2px solid #c39bd3; transform: rotateY(180deg); padding: 10px; }
        .card-front .card-emoji { font-size: 36px; margin-bottom: 6px; }
        .card-front .card-name { font-size: 11px; color: #c39bd3; font-weight: 700; text-align: center; }
        .card-front .card-number { font-size: 9px; color: #777; }
        .card-front .card-direction { font-size: 9px; color: #e74c3c; margin-top: 3px; }

        .tarot-card.dimmed { opacity: 0.15; pointer-events: none; }
        @media (max-width: 500px) { .tarot-card { width: 90px; height: 135px; } .card-front .card-emoji { font-size: 24px; } .card-front .card-name { font-size: 8px; } }

        .reading-section { display: none; }
        .reading-card { background: linear-gradient(135deg, #1a0d2e, #2a1540); border: 1px solid #3a2550; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .reading-title { font-size: 16px; color: #9b59b6; font-weight: 600; margin-bottom: 10px; }
        .reading-text { font-size: 14px; color: #999; line-height: 1.7; }
        .reading-text strong { color: #c39bd3; }

        .position-label { font-size: 12px; color: #9b59b6; text-align: center; margin-top: 6px; font-weight: 600; }

        footer { text-align: center; padding: 30px; color: #888; font-size: 12px; }
        .disclaimer { text-align: center; font-size: 11px; color: #555; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <a href="../index.html" style="text-decoration:none;font-size:20px;color:#9b59b6;letter-spacing:2px;font-weight:700;">MOGU <span style="color:#8e44ad;">Moon</span></a>
</header>

<div class="container">
    <div class="page-title">
        <h2>🃏 타로 카드</h2>
        <p>카드를 뽑아 당신의 운명을 읽어보세요</p>
    </div>

    <div class="mode-selector" style="display:flex;gap:0;margin-bottom:20px;border:2px solid #3a2550;border-radius:10px;overflow:hidden;">
        <button class="mode-btn" style="flex:1;padding:12px;border:none;background:#9b59b6;color:#fff;font-size:14px;font-weight:600;cursor:pointer;" onclick="setMode('normal')">🃏 일반 타로</button>
        <button class="mode-btn" style="flex:1;padding:12px;border:none;background:transparent;color:#9b59b6;font-size:14px;font-weight:600;cursor:pointer;" onclick="setMode('oshi')">💜 최애 타로</button>
    </div>

    <div id="oshiBox" style="display:none;background:linear-gradient(135deg,#1a0d2e,#2a1540);border:1px solid #3a2550;border-radius:12px;padding:24px;margin-bottom:16px;text-align:center;">
        <div style="font-size:14px;color:#9b59b6;margin-bottom:12px;font-weight:600;">💜 최애의 이름을 입력하세요</div>
        <input type="text" id="oshiName" placeholder="예: 고조 사토루, 레비, 카미나..." style="width:100%;padding:12px;background:#0a0a1a;border:1px solid #3a2550;border-radius:8px;color:#e0d8cc;font-size:15px;outline:none;text-align:center;">
        <div style="font-size:11px;color:#666;margin-top:8px;margin-bottom:16px;">애니/만화/게임/아이돌 누구든 OK!</div>
        <div style="font-size:14px;color:#c39bd3;line-height:1.8;font-style:italic;border-top:1px solid #3a2550;padding-top:14px;">
            ✨ 그 사람의 마음을 떠올리며<br>카드를 선택하세요 ✨<br>
            <span style="font-size:12px;color:#666;">카드가 최애의 숨겨진 감정을 보여줍니다</span>
        </div>
    </div>

    <div class="spread-selector" style="flex-direction:column;gap:10px;" id="spreadNormal">
        <button class="spread-btn active" onclick="setSpread(1)" style="padding:14px 20px;text-align:left;">💫 <strong>원카드</strong> <span style="font-size:12px;color:#888;margin-left:8px;">빠른 답변 · 1장</span></button>
        <button class="spread-btn" onclick="setSpread(3)" style="padding:14px 20px;text-align:left;">⏳ <strong>과거 · 현재 · 미래</strong> <span style="font-size:12px;color:#888;margin-left:8px;">시간의 흐름 · 3장</span></button>
        <button class="spread-btn" onclick="setSpread(5)" style="padding:14px 20px;text-align:left;">⭐ <strong>심층 리딩</strong> <span style="font-size:12px;color:#888;margin-left:8px;">자세한 분석 · 5장</span></button>
    </div>

    <div class="question-box" id="questionBox" style="border:none;background:transparent;padding:10px;">
        <div style="font-size:14px;color:#c39bd3;line-height:1.8;text-align:center;font-style:italic;">
            ✨ 마음속에 궁금한 것을 떠올리며<br>카드를 선택하세요 ✨<br>
            <span style="font-size:12px;color:#666;">카드는 당신의 무의식이 선택합니다</span>
        </div>
    </div>

    <button class="draw-btn" id="drawBtn" onclick="startDraw()">🃏 카드 섞기</button>

    <div id="pickInstruction" style="display:none;text-align:center;margin-bottom:16px;">
        <span style="font-size:15px;color:#c39bd3;" id="pickText">카드를 <strong>1장</strong> 선택하세요</span>
    </div>

    <div class="cards-area" id="cardsArea" style="flex-wrap:wrap;"></div>

    <div class="reading-section" id="readingSection"></div>

    <div class="disclaimer">🃏 타로는 재미와 자기 성찰을 위한 도구입니다. 중요한 결정은 전문가와 상담하세요.</div>
</div>

<div style="text-align:center;padding:20px 0;border-top:1px solid #3a2550;margin-top:30px;"><span style="font-size:13px;color:#888;margin-right:8px;">공유:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#666;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">URL 복사</a></div>

<footer>&copy; 2025 MOGU Moon</footer>

<style>.light-mode{background:#f5f5f5 !important;color:#333 !important}.light-mode header{background:#fff !important;border-color:#eee !important}.light-mode .form-box,.light-mode .calc-box,.light-mode .interp-card,.light-mode .info-item,.light-mode .reading-card,.light-mode .question-box{background:#fff !important;border-color:#ddd !important;color:#333 !important}.light-mode .reading-text{color:#555 !important}.light-mode footer{color:#999 !important}.light-mode .card-back{background:linear-gradient(135deg,#ddd,#eee) !important}.light-mode .card-front{background:#fff !important;border-color:#9b59b6 !important}</style>
<button onclick="document.body.classList.toggle('light-mode');localStorage.setItem('moguMoonLight',document.body.classList.contains('light-mode'))" style="position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;border:none;font-size:20px;cursor:pointer;background:#2a1530;color:#9b59b6;box-shadow:0 2px 8px rgba(0,0,0,0.3);z-index:999;">☀️</button>
<script>if(localStorage.getItem('moguMoonLight')==='true')document.body.classList.add('light-mode');</script>

<script src="cards.js"></script>
<script>
const MAJOR = TAROT_CARDS.filter(c => c.suit === 'major');
const ALL_CARDS = TAROT_CARDS;
let spreadCount = 1;
let drawnCards = [];
let mode = 'normal';

function setMode(m) {
    mode = m;
    const btns = document.querySelectorAll('.mode-btn');
    btns[0].style.background = m === 'normal' ? '#9b59b6' : 'transparent';
    btns[0].style.color = m === 'normal' ? '#fff' : '#9b59b6';
    btns[1].style.background = m === 'oshi' ? '#9b59b6' : 'transparent';
    btns[1].style.color = m === 'oshi' ? '#fff' : '#9b59b6';
    document.getElementById('oshiBox').style.display = m === 'oshi' ? 'block' : 'none';
    document.getElementById('questionBox').style.display = m === 'oshi' ? 'none' : 'block';
    document.getElementById('spreadNormal').style.display = m === 'normal' ? 'flex' : 'none';
    if (m === 'oshi') { spreadCount = 3; } // 최애 모드는 3장 고정
    document.getElementById('drawBtn').innerHTML = m === 'oshi' ? '💜 카드 섞기' : '🃏 카드 섞기';
    // 모드 전환 시 초기화
    document.getElementById('cardsArea').innerHTML = '';
    document.getElementById('readingSection').innerHTML = '';
    document.getElementById('readingSection').style.display = 'none';
    document.getElementById('pickInstruction').style.display = 'none';
    drawnCards = [];
    pickedCount = 0;
}

function setSpread(n) {
    spreadCount = n;
    document.querySelectorAll('.spread-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('cardsArea').innerHTML = '';
    document.getElementById('readingSection').innerHTML = '';
    document.getElementById('readingSection').style.display = 'none';
}

let shuffledDeck = [];
let pickedCount = 0;

function startDraw() {
    const area = document.getElementById('cardsArea');
    area.innerHTML = '';
    document.getElementById('readingSection').innerHTML = '';
    document.getElementById('readingSection').style.display = 'none';
    drawnCards = [];
    pickedCount = 0;

    // Shuffle full 78-card deck
    shuffledDeck = [...ALL_CARDS].sort(() => Math.random() - 0.5);

    // Display cards based on spread count
    const displayCount = spreadCount === 1 ? 7 : spreadCount === 3 ? 12 : 15;
    for (let i = 0; i < displayCount; i++) {
        const cardEl = document.createElement('div');
        cardEl.className = 'tarot-card';
        cardEl.dataset.index = i;
        cardEl.innerHTML = `
            <div class="card-inner">
                <div class="card-face card-back">
                    <div class="stars"></div>
                    <div class="label">TAROT</div>
                </div>
                <div class="card-face card-front" id="front-${i}">
                </div>
            </div>
        `;
        cardEl.onclick = () => pickCard(i, cardEl);
        area.appendChild(cardEl);
    }

    // Show instruction
    document.getElementById('pickInstruction').style.display = 'block';
    document.getElementById('pickText').innerHTML = `카드를 <strong>${spreadCount}장</strong> 선택하세요`;

    // Hide draw button, show reset
    document.getElementById('drawBtn').innerHTML = '🔄 다시 섞기';
}

function pickCard(index, cardEl) {
    if (cardEl.classList.contains('flipped') || pickedCount >= spreadCount) return;

    // Assign a card from shuffled deck
    const card = shuffledDeck[index];
    card.reversed = Math.random() < 0.3;

    // Set card front content
    const front = document.getElementById('front-' + index);
    const suitLabels = {major:'메이저',wands:'완드',cups:'컵',swords:'소드',pentacles:'펜타클'};
    front.className = 'card-face card-front';
    front.innerHTML = `
        <div class="card-number" style="font-size:10px;color:#666;">${suitLabels[card.suit] || ''}</div>
        <div class="card-emoji">${card.emoji}</div>
        <div class="card-name">${card.name}</div>
        ${card.reversed ? '<div class="card-direction">역방향 ↓</div>' : ''}
    `;

    // Flip animation
    cardEl.classList.add('flipped');
    // selected removed - card stays in place
    drawnCards.push(card);
    pickedCount++;

    // Update instruction
    const remaining = spreadCount - pickedCount;
    if (remaining > 0) {
        document.getElementById('pickText').innerHTML = `<strong>${remaining}장</strong> 더 선택하세요`;
    } else {
        document.getElementById('pickText').innerHTML = '✨ 모든 카드를 선택했습니다!';

        // Dim unselected cards
        document.querySelectorAll('.tarot-card:not(.flipped)').forEach(c => c.classList.add('dimmed'));

        // Show reading after delay
        setTimeout(showReading, 1000);
    }
}

function showReading() {
    const section = document.getElementById('readingSection');
    const oshiName = document.getElementById('oshiName')?.value?.trim() || '그 사람';
    const isOshi = mode === 'oshi';

    let positions;
    if (isOshi) {
        positions = spreadCount === 3 ? OSHI_TAROT_UI.positions3 : spreadCount === 5 ? OSHI_TAROT_UI.positions5 : [oshiName + '의 한마디'];
    } else {
        positions = spreadCount === 3 ? TAROT_UI.positions3 : spreadCount === 5 ? TAROT_UI.positions5 : ['오늘의 카드'];
    }
    let html = '';

    drawnCards.forEach((card, i) => {
        const posName = positions[i] || '';
        let reading;
        if (isOshi) {
            if (card.suit === 'major' && OSHI_READINGS[card.num]) {
                const oshi = OSHI_READINGS[card.num];
                reading = (card.reversed ? oshi.down : oshi.up).replace(/\{name\}/g, oshiName);
            } else {
                // 마이너 아르카나 최애 변환
                reading = convertToOshi(card, oshiName);
            }
        } else {
            reading = card.reversed ? card.down : card.up;
        }
        const dir = card.reversed ? '(역방향 ↓)' : '(정방향 ↑)';
        const titlePrefix = isOshi ? `💜 ${oshiName} — ` : '';

        html += `
            <div class="reading-card">
                <div class="reading-title">${card.emoji} ${titlePrefix}${posName ? posName + ': ' : ''}${card.name} ${dir}</div>
                <div class="reading-text">
                    <strong>${card.en} — ${card.num}번</strong><br><br>
                    ${reading}
                </div>
            </div>
        `;
    });

    // 종합 해석 (3장 이상)
    if (spreadCount >= 3) {
        const mainTheme = drawnCards[Math.floor(drawnCards.length / 2)];
        const upCount = drawnCards.filter(c => !c.reversed).length;
        const downCount = drawnCards.filter(c => c.reversed).length;

        if (isOshi) {
            html += `
                <div class="reading-card">
                    <div class="reading-title">💜 ${oshiName}의 종합적인 마음</div>
                    <div class="reading-text">
                        핵심 카드는 <strong>${mainTheme.emoji} ${mainTheme.name}</strong>입니다.<br><br>
                        정방향 ${upCount}장, 역방향 ${downCount}장.<br>
                        ${upCount > downCount ? `<strong>${oshiName}은(는) 전체적으로 당신에게 긍정적인 감정을 가지고 있다고 합니다.</strong> 마음을 열고 다가가도 좋을 것 같다고 합니다.` : `<strong>${oshiName}은(는) 복잡한 감정 속에 있다고 합니다.</strong> 하지만 마음 깊은 곳에서는 당신을 소중하게 여기고 있다고 합니다. 시간이 필요할 뿐이라고 합니다.`}
                    </div>
                </div>
            `;
        } else {
            html += `
                <div class="reading-card">
                    <div class="reading-title">🃏 종합 해석</div>
                    <div class="reading-text">
                        이 리딩의 핵심 카드는 <strong>${mainTheme.emoji} ${mainTheme.name}</strong>입니다.
                        ${mainTheme.reversed ? '역방향으로 나왔으므로, ' + mainTheme.down.split('.')[0] + '에 주의하세요.' : mainTheme.up.split('.')[0] + '의 에너지가 강합니다.'}
                        <br><br>
                        전체적으로 ${upCount}장이 정방향, ${downCount}장이 역방향입니다.
                        ${downCount > spreadCount / 2 ? '도전적인 시기이지만, 역방향 카드는 내면의 성장을 의미하기도 합니다.' : '긍정적인 에너지가 우세합니다. 자신감을 가지세요.'}
                    </div>
                </div>
            `;
        }
    }

    section.innerHTML = html;
    section.style.display = 'block';
    section.scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
