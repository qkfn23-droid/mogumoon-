<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Flip Test</title>
<style>
body { background: #111; display: flex; flex-wrap: wrap; gap: 10px; padding: 20px; justify-content: center; }

.card {
    width: 120px;
    height: 180px;
    cursor: pointer;
    perspective: 800px;
}

.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s;
}

.card.flipped .card-inner {
    transform: rotateY(180deg);
}

.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.card-back {
    background: linear-gradient(135deg, #2a1540, #1a0d2e);
    border: 2px solid #9b59b6;
    color: #9b59b6;
    font-size: 12px;
    letter-spacing: 2px;
}

.card-front {
    background: linear-gradient(135deg, #1a0d2e, #0d0520);
    border: 2px solid #c39bd3;
    transform: rotateY(180deg);
    color: #c39bd3;
}

.card-front .emoji { font-size: 40px; }
.card-front .name { font-size: 12px; margin-top: 8px; font-weight: 700; }
</style>
</head>
<body>
<script>
const cards = ['🃏 광대','🪄 마법사','🌙 여사제','🌺 여황제','👑 황제','🙏 교황','💕 연인','⚡ 전차','🦁 힘','🔦 은둔자','🎡 운명','⚖️ 정의'];

cards.forEach((c, i) => {
    const [emoji, name] = c.split(' ');
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
        <div class="card-inner">
            <div class="card-face card-back">TAROT</div>
            <div class="card-face card-front">
                <div class="emoji">${emoji}</div>
                <div class="name">${name}</div>
            </div>
        </div>
    `;
    el.onclick = () => el.classList.toggle('flipped');
    document.body.appendChild(el);
});
</script>
</body>
</html>
