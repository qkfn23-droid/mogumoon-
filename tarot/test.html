<html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Flip Test</title>
<style>
body { background: #111; display: flex; flex-wrap: wrap; gap: 10px; padding: 20px; justify-content: center; }

.card {
    width: 120px;
    height: 180px;
    cursor: pointer;
    perspective: 800px;
}

.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s;
}

.card.flipped .card-inner {
    transform: rotateY(180deg);
}

.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.card-back {
    background: linear-gradient(135deg, #2a1540, #1a0d2e);
    border: 2px solid #9b59b6;
    color: #9b59b6;
    font-size: 12px;
    letter-spacing: 2px;
}

.card-front {
    background: linear-gradient(135deg, #1a0d2e, #0d0520);
    border: 2px solid #c39bd3;
    transform: rotateY(180deg);
    color: #c39bd3;
}

.card-front .emoji { font-size: 40px; }
.card-front .name { font-size: 12px; margin-top: 8px; font-weight: 700; }

.light-mode{background:#f5f5f5 !important;color:#333 !important}
.light-mode .nav{background:rgba(255,255,255,0.95) !important;border-color:#eee !important}
.light-mode .nav-links a{color:#666 !important}
.light-mode .nav-links a.active{background:rgba(201,168,76,0.15) !important;color:#c9a84c !important}
.light-mode .nav-lang{background:#fff !important;color:#666 !important;border-color:#ddd !important}
.light-mode .side-card{background:linear-gradient(135deg,#fff,#fafafa) !important;border-color:#e0e0e0 !important}
.light-mode .section-title,.light-mode h2{color:#b8860b !important}
.light-mode p,.light-mode li,.light-mode td,.light-mode .content{color:#555 !important}
.light-mode .page-layout,.light-mode .seo-section,.light-mode .seo-section p{color:#666 !important}
.light-mode footer,.light-mode .app-footer{color:#999 !important}
.light-mode .rel-item{color:#666 !important}
.light-mode article,.light-mode .about-section,.light-mode .privacy-section{color:#555 !important}
.light-mode .interp-card,.light-mode .category-header,.light-mode .input-bar-inner{background:linear-gradient(135deg,#fff,#fafafa) !important;border-color:#e0e0e0 !important;color:#333 !important}
.light-mode select,.light-mode input{background:#fff !important;color:#333 !important;border-color:#ddd !important}
</style>
</head>
<body>
<script>if(localStorage.getItem('moguMoonLight')==='true')document.body.classList.add('light-mode');</script>
<script>
const cards = ['🃏 광대','🪄 마법사','🌙 여사제','🌺 여황제','👑 황제','🙏 교황','💕 연인','⚡ 전차','🦁 힘','🔦 은둔자','🎡 운명','⚖️ 정의'];

cards.forEach((c, i) => {
    const [emoji, name] = c.split(' ');
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
        <div class="card-inner">
            <div class="card-face card-back">TAROT</div>
            <div class="card-face card-front">
                <div class="emoji">${emoji}</div>
                <div class="name">${name}</div>
            </div>
        </div>
    `;
    el.onclick = () => el.classList.toggle('flipped');
    document.body.appendChild(el);
});
</script>
<button id="themeToggle" onclick="document.body.classList.toggle('light-mode');localStorage.setItem('moguMoonLight',document.body.classList.contains('light-mode'));this.textContent=document.body.classList.contains('light-mode')?'🌙':'☀️'" style="position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;border:none;font-size:20px;cursor:pointer;background:#2a1530;color:#e84393;box-shadow:0 2px 8px rgba(0,0,0,0.3);z-index:999;">☀️</button><script>if(document.body.classList.contains('light-mode')&&document.getElementById('themeToggle'))document.getElementById('themeToggle').textContent='🌙';</script>
</body>
</html>
